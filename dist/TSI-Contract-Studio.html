      'Site': 'The delivery / installation location named on the cover sheet.',
      'Contract Price': 'The total price payable to Seller, as adjusted by Change Orders.',
      'Commissioning': 'The Article 5 activities to place the Equipment into operating condition.',
      'Substantial Completion': 'The point, certified under Annex K, at which the Equipment can operate for its intended purpose, subject to punch-list items.',
      'Confidential Information': 'Non-public information disclosed under this Agreement — see Article 18.',
      'Intellectual Property': 'Patents, copyrights, trade secrets, know-how, and other proprietary rights.',
      'Force Majeure': 'An event beyond a party’s reasonable control — see Article 16.'
    };

    const STD_DEFAULTS = {
      warrantyPeriod: '12 months from Commissioning completion', governingLaw: 'Washington',
      delayLDGracePeriod: 2, delayLDRate: 1, delayLDCap: 10, performanceLDCap: 10,
      aggregateLDCap: 15, minPerformanceThreshold: 80, changeOrderMarkup: 20, terminationFeePercent: 20,
      sellerNotice: 'Vancouver, Washington, USA'
    };

    let state = { index: null, project: null, templates: { standard: null, lite: null },
                  stubReg: null, docReg: null, format: 'standard', stance: 'balanced' };

    function fillTemplate(tpl, p) {
      const map = {
        projectName: p.name || '—', buyer: p.buyer || '—', buyerAddress: p.buyerAddress || '—',
        buyerNotices: p.buyerNotices || '—', site: p.site || '—', sellerNotice: p.sellerNotice || STD_DEFAULTS.sellerNotice,
        contractPriceFmt: TSI.fmtMoney(p.contractPrice), effectiveDate: TSI.fmtDate(p.effectiveDate),
        governingLaw: p.governingLaw || 'Washington', warrantyPeriod: p.warrantyPeriod || STD_DEFAULTS.warrantyPeriod,
        delayLDGracePeriod: p.delayLDGracePeriod, delayLDRate: p.delayLDRate, delayLDCap: p.delayLDCap,
        performanceLDCap: p.performanceLDCap, aggregateLDCap: p.aggregateLDCap,
        minPerformanceThreshold: p.minPerformanceThreshold, changeOrderMarkup: p.changeOrderMarkup,
        terminationFeePercent: p.terminationFeePercent
      };
      return tpl.replace(/\{\{(\w+)\}\}/g, function (_, k) { return (map[k] != null ? map[k] : ''); });
    }

    async function injectStubs(root, p) {
      const slots = root.querySelectorAll('.stub-slot');
      await Promise.all(Array.prototype.map.call(slots, async function (slot) {
        const id = slot.getAttribute('data-stub');
        const meta = state.stubReg.stubs.find(function (s) { return s.id === id; });
        if (!meta) { slot.innerHTML = '<span class="open-issue note-block">[OPEN: stub “' + id + '” not found in registry.]</span>'; return; }
        // A stub may be overridden (modified) within this project. When it is,
        // inject the project override and offer an in-place diff vs the library
        // version. Reviewer checks reset on modification (spec Module 2).
        const sec = (p.sections || []).find(function (s) { return s.stubId === id; });
        const overrideFile = sec && sec.modified && sec.stubOverrideFile;
        // Resolve the variant (format × stance) unless a project override wins.
        const r = TSI.resolveStub(meta, state.stubReg, state.format, state.stance);
        const sourceFile = overrideFile || r.file;
        let html;
        try { html = await TSI.readText(sourceFile); }
        catch (e) { slot.innerHTML = '<span class="open-issue note-block">[OPEN: could not load stub ' + id + '.]</span>'; return; }

        // Variant tags (working view): show which format/stance actually rendered.
        function tag(txt, cls) { return '<span class="badge ' + cls + '" style="margin-right:5px;">' + txt + '</span>'; }
        let variantTags = tag(r.resolvedFormat === 'lite' ? 'lite' : 'standard', 'badge-neutral') +
          tag(r.resolvedStance === 'pro-tsi' ? 'pro-TSI' : 'balanced', r.resolvedStance === 'pro-tsi' ? 'badge-warning' : 'badge-teal');
        if (r.fellBackStance) variantTags += '<span class="cell-muted" style="font-size:0.8em;">no pro-TSI variant — using balanced</span>';

        let flag = '';
        if (sec && sec.modified && overrideFile) {
          flag = '<span class="stub-flag working-only">Modified from standard v' + TSI.escapeHTML(sec.stubVersion || meta.version) +
                 ' — reviewer checks reset. ' +
                 '<button class="btn btn-sm stub-diff-btn no-print" data-lib="' + TSI.escapeHTML(meta.file) +
                 '" data-override="' + TSI.escapeHTML(overrideFile) + '" data-name="' + TSI.escapeHTML(meta.name) +
                 '" data-ver="' + TSI.escapeHTML(sec.stubVersion || meta.version) +
                 '" style="margin-left:8px;vertical-align:middle;">View diff vs standard</button></span>';
        } else {
          flag = '<span class="working-only" style="display:block;font-size:0.8em;margin-bottom:4px;">' + variantTags +
                 '<span class="cell-muted">v' + TSI.escapeHTML(meta.version) + '</span></span>';
        }
        slot.innerHTML = flag + html;
      }));
    }

    async function injectAnnexes(root, p) {
      const annexes = p.annexes || [];
      // Cover-sheet annex list (working view only)
      const listSlot = root.querySelector('.annex-list-slot');
      if (listSlot) {
        listSlot.innerHTML = '<table class="particulars"><tr><th style="width:12%;">Annex</th><th style="width:58%;">Title</th><th>Reviewer</th></tr>' +
          annexes.map(function (a) {
            return '<tr><td>' + TSI.escapeHTML(a.letter) + '</td><td class="text">' + TSI.escapeHTML(a.name) +
              '</td><td class="text">' + TSI.escapeHTML(a.reviewer || '—') + '</td></tr>';
          }).join('') + '</table>';
      }
      // Annex bodies
      const bodySlot = root.querySelector('.annex-body-slot');
      if (!bodySlot) return;
      const parts = await Promise.all(annexes.map(async function (a) {
        let body;
        if (a.overrideFile) {
          // Project-specific annex content (no library source).
          try { body = await TSI.readText(a.overrideFile); }
          catch (e) { body = '<span class="open-issue note-block">[OPEN: could not load project annex ' + TSI.escapeHTML(a.overrideFile) + '.]</span>'; }
        } else if (a.sourceDoc) {
          const doc = state.docReg.documents.find(function (d) { return d.id === a.sourceDoc; });
          if (doc) {
            try { body = await TSI.readText(doc.file); }
            catch (e) { body = '<span class="open-issue note-block">[OPEN: could not load ' + TSI.escapeHTML(a.sourceDoc) + '.]</span>'; }
          } else {
            body = '<span class="open-issue note-block">[OPEN: source document “' + TSI.escapeHTML(a.sourceDoc) + '” not in library.]</span>';
          }
        } else {
          body = '<p class="draft-note note-block">[DRAFT NOTE: ' + TSI.escapeHTML(a.name) +
                 ' is project-specific — draft or attach the content for this project.]</p>';
        }
        return '<div class="article" id="annex-' + TSI.escapeHTML(a.letter.toLowerCase()) + '">' +
          '<h2>Annex ' + TSI.escapeHTML(a.letter) + ' — ' + TSI.escapeHTML(a.name) + '</h2>' +
          '<span class="working-only cell-muted" style="display:block;font-size:0.8em;margin-bottom:6px;">Reviewer: ' +
          TSI.escapeHTML(a.reviewer || '—') + '</span>' + body + '</div>';
      }));
      bodySlot.innerHTML = parts.join('');
    }

    async function renderContract() {
      const p = state.project, paper = document.getElementById('docPaper');
      const tpl = state.templates[state.format] || state.templates.standard;
      paper.classList.toggle('lite', state.format === 'lite');
      paper.innerHTML = fillTemplate(tpl, p);
      await injectStubs(paper, p);
      await injectAnnexes(paper, p);
      TSI.initDefinedTerms(paper, DEFINITIONS);
      TSI.initCalcFields(paper, p.contractPrice);
    }

    // Format / stance toggles — re-render the contract on change and
    // remember the choice on the project.
    function wireVariantToggle(sel, attr, key) {
      document.querySelectorAll(sel + ' .toggle-opt').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll(sel + ' .toggle-opt').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          state[key] = btn.dataset[attr];
          if (state.project) state.project[key] = state[key];
          if (state.project) renderContract();
        });
      });
    }
    function setToggle(sel, attr, val) {
      document.querySelectorAll(sel + ' .toggle-opt').forEach(function (b) {
        b.classList.toggle('active', b.dataset[attr] === val);
      });
    }
    wireVariantToggle('#formatToggle', 'fmt', 'format');
    wireVariantToggle('#stanceToggle', 'stance', 'stance');

    // In-project modified-stub diff (delegated — survives re-render).
    const diffModal = document.getElementById('diffModal');
    document.getElementById('docPaper').addEventListener('click', async function (e) {
      const btn = e.target.closest('.stub-diff-btn');
      if (!btn) return;
      document.getElementById('diffTitle').textContent = btn.dataset.name + ' — project vs standard v' + btn.dataset.ver;
      document.getElementById('diffPane').innerHTML = '<div class="empty-state">Computing diff…</div>';
      document.getElementById('diffCounts').textContent = '';
      diffModal.classList.add('open');
      try {
        const [libHTML, ovrHTML] = await Promise.all([TSI.readText(btn.dataset.lib), TSI.readText(btn.dataset.override)]);
        const libText = TSIDiff.htmlToText(libHTML), ovrText = TSIDiff.htmlToText(ovrHTML);
        const counts = TSIDiff.changeCount(libText, ovrText);
        document.getElementById('diffPane').innerHTML = TSIDiff.renderInline(libText, ovrText);
        document.getElementById('diffCounts').textContent = counts.insertions + ' added · ' + counts.deletions + ' removed';
      } catch (err) {
        document.getElementById('diffPane').innerHTML = '<div class="banner banner-error">Diff failed: ' + TSI.escapeHTML(err.message) + '</div>';
      }
    });
    diffModal.querySelectorAll('[data-diff-close]').forEach(function (b) {
      b.addEventListener('click', function () { diffModal.classList.remove('open'); });
    });

    async function selectProject(id) {
      const entry = state.index.projects.find(function (x) { return x.id === id; });
      if (!entry) return;
      state.project = await TSI.readJSON(entry.path);
      // Adopt the project's saved format / stance (default standard / balanced).
      state.format = (state.project.format === 'lite') ? 'lite' : 'standard';
      state.stance = (state.project.stance === 'pro-tsi') ? 'pro-tsi' : 'balanced';
      setToggle('#formatToggle', 'fmt', state.format);
      setToggle('#stanceToggle', 'stance', state.stance);
      const url = new URL(location.href); url.searchParams.set('project', id); history.replaceState(null, '', url);
      await renderContract();
    }

    // ── Views ──
    document.querySelectorAll('#viewToggle .toggle-opt').forEach(function (btn) {
      btn.addEventListener('click', function () {
        const v = btn.dataset.v;
        if (v === 'print') { TSI.setView('clean', document.getElementById('docPaper')); window.print(); return; }
        document.querySelectorAll('#viewToggle .toggle-opt').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        TSI.setView(v, document.getElementById('docPaper'));
      });
    });

    // ── New project ──
    const modal = document.getElementById('newModal');
    function openModal() { modal.classList.add('open'); }
    function closeModal() { modal.classList.remove('open'); }
    document.getElementById('newBtn').addEventListener('click', openModal);
    modal.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeModal); });

    document.getElementById('createBtn').addEventListener('click', function () {
      const name = document.getElementById('f-name').value.trim();
      if (!name) { TSI.toast('Project name is required', 'warn'); return; }
      const id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + new Date().getFullYear();
      const annexTemplate = state.docReg.annexTemplate.map(function (a) {
        return { id: 'annex-' + a.letter.toLowerCase(), letter: a.letter, name: a.name, sourceDoc: a.sourceDoc, reviewer: a.reviewer, status: 'pending', notes: '' };
      });
      const sections = [{ id: 'cover', name: 'Cover sheet', reviewer: 'JT', status: 'pending', notes: '' }]
        .concat(buildArticleSections());
      const proj = Object.assign({
        id: id, name: name,
        buyer: document.getElementById('f-buyer').value.trim(),
        buyerAddress: document.getElementById('f-buyerAddress').value.trim(),
        buyerNotices: document.getElementById('f-buyerNotices').value.trim(),
        site: document.getElementById('f-site').value.trim(),
        contractPrice: Number(document.getElementById('f-contractPrice').value) || 0,
        effectiveDate: document.getElementById('f-effectiveDate').value || TSI.stamp(),
        status: 'In Review', createdAt: new Date().toISOString(), lastModified: new Date().toISOString(),
        sections: sections, annexes: annexTemplate, exportLog: []
      }, {
        warrantyPeriod: STD_DEFAULTS.warrantyPeriod, governingLaw: document.getElementById('f-governingLaw').value.trim() || 'Washington',
        delayLDGracePeriod: STD_DEFAULTS.delayLDGracePeriod, delayLDRate: STD_DEFAULTS.delayLDRate,
        delayLDCap: STD_DEFAULTS.delayLDCap, performanceLDCap: STD_DEFAULTS.performanceLDCap,
        aggregateLDCap: STD_DEFAULTS.aggregateLDCap, minPerformanceThreshold: STD_DEFAULTS.minPerformanceThreshold,
        changeOrderMarkup: STD_DEFAULTS.changeOrderMarkup, terminationFeePercent: STD_DEFAULTS.terminationFeePercent,
        sellerNotice: STD_DEFAULTS.sellerNotice,
        format: document.getElementById('f-format').value,
        stance: document.getElementById('f-stance').value
      });
      state.project = proj;
      state.format = proj.format === 'lite' ? 'lite' : 'standard';
      state.stance = proj.stance === 'pro-tsi' ? 'pro-tsi' : 'balanced';
      setToggle('#formatToggle', 'fmt', state.format);
      setToggle('#stanceToggle', 'stance', state.stance);
      closeModal();
      renderContract();
      TSI.toast('Project created in memory — Save working file, then add it to projects/index.json', 'ok', 4200);
      // reflect in selector
      const sel = document.getElementById('projectSelect');
      if (![].some.call(sel.options, function (o) { return o.value === id; })) {
        const opt = document.createElement('option'); opt.value = id; opt.textContent = id + ' (new)'; sel.appendChild(opt);
      }
      sel.value = id;
    });

    // Article section skeleton for a new project (stub articles carry stubId).
    function buildArticleSections() {
      const arts = [
        [1,'Definitions','Attorney'],[2,'Scope of work & engineering','JT / PM'],[3,'Delivery, title & risk','PM'],
        [4,'Liquidated damages','Commercial'],[5,'Commissioning','Engineering'],[6,'Performance testing','Engineering'],
        [7,'Contract price & payment','Commercial'],[8,'Change orders','PM / Commercial'],
        [9,'Intellectual property','Attorney','ip-license'],[10,'Warranty','Attorney / Engineering'],
        [11,'Spare parts','Engineering'],[12,'Indemnification','Attorney','indemnification'],
        [13,'Insurance','Attorney / CFO','insurance'],[14,'Limitation of liability','Attorney','limitation-of-liability'],
        [15,'Events of default & remedies','Attorney'],[16,'Force majeure','Attorney','force-majeure'],
        [17,'Representations & warranties','Attorney','representations-warranties'],
        [18,'Confidentiality','Attorney','confidentiality'],[19,'Compliance with laws','Attorney','anti-corruption'],
        [20,'Change in law','Attorney'],[21,'Dispute resolution','Attorney','dispute-resolution'],
        [22,'Miscellaneous','Attorney']
      ];
      return arts.map(function (a) {
        const s = { id: 'article-' + a[0], name: 'Art. ' + a[0] + ' — ' + a[1], reviewer: a[2], status: 'pending', notes: '' };
        if (a[3]) { s.stubId = a[3]; const m = state.stubReg.stubs.find(function (x) { return x.id === a[3]; }); s.stubVersion = m ? m.version : ''; s.modified = false; }
        return s;
      });
    }

    // ── Save working file ──
    document.getElementById('saveBtn').addEventListener('click', async function () {
      if (!state.project) return;
      const paper = document.getElementById('docPaper');
      const working = wrapStandalone(state.project.name + ' — working', paper.innerHTML, true);
      const res = await TSI.saveFile('working-' + state.project.id, 'contract-working.html', working);
      if (res.method === 'cancelled') return;
      TSI.toast(res.method === 'download' ? 'Downloaded contract-working.html' : 'Saved working file', 'ok');
    });

    // ── Export clean (Module 4) ──
    document.getElementById('exportBtn').addEventListener('click', async function () {
      if (!state.project) return;
      const p = state.project;
      const paper = document.getElementById('docPaper');
      const clean = TSI.stripInternal(paper);   // strips .draft-note/.int-note/.atty-note/.open-issue/.working-only/.stub-flag
      const nextVer = nextVersion(p.exportLog);
      const nameSafe = (p.name || 'ESA').replace(/[^A-Za-z0-9]+/g, '');
      const stamp = TSI.stamp();
      const filename = 'TSI_ESA_' + nameSafe + '_v' + nextVer + '_' + stamp + '.html';
      const guidance = '<p style="font-family:sans-serif;font-size:9pt;color:#888;border-top:1px solid #ccc;margin-top:24px;padding-top:8px;">' +
        'Open this file in Microsoft Word and Save As .docx for attorney / counterparty exchange. ' +
        'Generated by TSI Contract Studio — ' + TSI.escapeHTML(filename) + '</p>';
      const out = wrapStandalone(p.name + ' — ' + TSI.escapeHTML(filename), clean + guidance, false);
      const res = await TSI.saveFile('export-' + p.id, filename, out);
      if (res.method === 'cancelled') return;
      // Append to export log + persist project.json
      p.exportLog = p.exportLog || [];
      p.exportLog.push({ version: nextVer, date: new Date().toISOString(), filename: filename });
      p.lastModified = new Date().toISOString();
      await TSI.saveFile('project-' + p.id, 'project.json', JSON.stringify(p, null, 2), { repick: true });
      TSI.toast('Exported ' + filename + ' (v' + nextVer + ') · log updated', 'ok', 4000);
    });

    function nextVersion(log) {
      if (!log || !log.length) return '1.0';
      const last = log[log.length - 1].version || '1.0';
      const parts = last.split('.').map(Number);
      parts[1] = (parts[1] || 0) + 1;
      return parts[0] + '.' + parts[1];
    }

    // Standalone HTML wrapper carrying enough of the document CSS to open on its own.
    function wrapStandalone(title, bodyHTML, working) {
      const css = [
        'body{font:12pt/1.6 "Inter",system-ui,sans-serif;color:#333;max-width:8.5in;margin:0 auto;padding:0.9in;background:#fff;}',
        'h1,h2,h3{color:#19446C;font-weight:500;}',
        '.doc-title{font:24pt/1.2 "DM Serif Display",Georgia,serif;text-align:center;color:#19446C;}',
        '.doc-subtitle{text-align:center;color:#666;margin-bottom:24px;}',
        '.article{margin-top:24px;}',
        '.article>h2{font-size:14pt;text-transform:uppercase;border-bottom:1px solid #00929F;padding-bottom:4px;}',
        'ol.legal{list-style:none;counter-reset:item;padding-left:0;}',
        'ol.legal>li{counter-increment:item;margin:8px 0;padding-left:2.4em;position:relative;}',
        'ol.legal>li::before{content:counters(item,".") " ";position:absolute;left:0;font-weight:500;color:#19446C;}',
        '.clause-num{font-weight:500;color:#19446C;}',
        'table.particulars{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:11pt;}',
        'table.particulars th,table.particulars td{padding:6px 10px;border:0.5px solid #ccc;text-align:left;vertical-align:top;}',
        'table.particulars th{width:34%;background:#eaf0f5;color:#19446C;font-weight:500;}',
        'table.particulars td{font-family:"JetBrains Mono",monospace;}',
        'table.particulars td.text{font-family:"Inter",sans-serif;}',
        '.data-table{width:100%;border-collapse:collapse;font-size:10pt;}',
        '.data-table th{background:#19446C;color:#fff;padding:6px 8px;text-align:left;font-weight:500;}',
        '.data-table td{padding:5px 8px;border-bottom:0.5px solid #ddd;}',
        '.term{color:#19446C;border-bottom:1px dotted #00929F;}.calc{color:#00929F;}',
        '.sig-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px;}',
        '.sig-line{border-top:1px solid #333;padding-top:4px;margin-top:40px;font-size:10pt;color:#666;}',
        '.hr{border:none;border-top:0.5px solid #ccc;margin:16px 0;}',
        '.fill{display:inline-block;min-width:120px;border-bottom:1px solid #999;font-family:"JetBrains Mono",monospace;color:#00929F;}',
        '@page{size:letter;margin:0.9in;}'
      ].join('');
      return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>' + TSI.escapeHTML(title) +
        '</title><style>' + css + '</style></head><body>' +
        (working ? '<!-- WORKING FILE — contains internal drafting notes. Not for counterparty. -->' :
                   '<!-- CLEAN EXPORT — internal markup stripped. -->') +
        bodyHTML + '</body></html>';
    }

    async function init() {
      TSI.initChrome();
      const [tplStd, tplLite, stubReg, docReg, index] = await Promise.all([
        TSI.readText('templates/master-agreement.html'),
        TSI.readText('templates/master-agreement-lite.html'),
        TSI.readJSON('config/stub-registry.json'),
        TSI.readJSON('config/doc-library-registry.json'),
        TSI.readJSON('projects/index.json')
      ]);
      state.templates.standard = tplStd; state.templates.lite = tplLite;
      state.stubReg = stubReg; state.docReg = docReg; state.index = index;

      const sel = document.getElementById('projectSelect');
      sel.innerHTML = index.projects.map(function (p) { return '<option value="' + p.id + '">' + TSI.escapeHTML(p.id) + '</option>'; }).join('');
      sel.addEventListener('change', function () { selectProject(sel.value); });

      const params = TSI.params();
      if (params.project === 'new') {
        // Prefill modal from Intel handoff URL params, then open it.
        if (params.buyer) document.getElementById('f-buyer').value = params.buyer;
        if (params.site) document.getElementById('f-site').value = params.site;
        if (params.price) document.getElementById('f-contractPrice').value = params.price;
        if (params.name) document.getElementById('f-name').value = params.name;
        if (params.format === 'lite') document.getElementById('f-format').value = 'lite';
        if (params.stance === 'pro-tsi') document.getElementById('f-stance').value = 'pro-tsi';
        openModal();
        if (index.projects.length) { sel.value = index.projects[0].id; await selectProject(index.projects[0].id); }
      } else {
        const start = (params.project && index.projects.some(function (p) { return p.id === params.project; })) ? params.project : index.projects[0].id;
        sel.value = start;
        await selectProject(start);
      }
    }
    init().catch(function (e) {
      document.getElementById('docPaper').innerHTML = '<div class="banner banner-error">Failed to load: ' + TSI.escapeHTML(e.message) +
        '<br>Serve over localhost (python -m http.server 8080).</div>';
    });
  
},
"stubs.html": function(){

    document.getElementById('themeBtn').addEventListener('click', TSI.toggleTheme);

    let reg = null, current = null;
    const stubView = { format: 'standard', stance: 'balanced' };

    function reviewerComplete(s) {
      return s.reviewers && s.reviewers.attorney && s.reviewers.attorney.done && s.reviewers.jt && s.reviewers.jt.done;
    }

    function renderList() {
      document.getElementById('stubCount').textContent = reg.stubs.length + ' stubs';
      document.getElementById('stubList').innerHTML = reg.stubs.map(function (s) {
        const ok = reviewerComplete(s);
        return '<div class="toggle-row" data-id="' + s.id + '" style="cursor:pointer;padding:10px var(--sp-3);' +
          (current && current.id === s.id ? 'background:var(--row-hover-bg);' : '') + '">' +
          '<div style="flex:1;"><div class="cell-primary">' + TSI.escapeHTML(s.name) + '</div>' +
          '<div class="cell-muted">Art. ' + (s.article || '—') + ' · v' + TSI.escapeHTML(s.version) + '</div></div>' +
          (ok ? '<span class="rstatus rstatus-done">Reviewed</span>' : '<span class="rstatus rstatus-pending">Pending</span>') +
          '</div>';
      }).join('');
      document.querySelectorAll('#stubList .toggle-row').forEach(function (row) {
        row.addEventListener('click', function () { select(row.dataset.id); });
      });
    }

    async function select(id) {
      current = reg.stubs.find(function (s) { return s.id === id; });
      if (!current) return;
      renderList();

      const prev = (current.changelog || []).find(function (c) { return c.prev; });
      const changelog = (current.changelog || []).map(function (c) {
        return '<div class="feed-item" style="display:flex;gap:12px;padding:6px 0;border-bottom:0.5px solid var(--color-border);">' +
          '<span class="mono cell-muted" style="min-width:96px;">v' + TSI.escapeHTML(c.version) + ' · ' + TSI.fmtDate(c.date) + '</span>' +
          '<span style="flex:1;">' + TSI.escapeHTML(c.note) + '</span></div>';
      }).join('');

      const r = current.reviewers || {};
      document.getElementById('detail').innerHTML =
        '<div class="card-header"><div class="card-title">' + TSI.escapeHTML(current.name) + ' <span class="cell-muted">v' + TSI.escapeHTML(current.version) + '</span></div>' +
          '<div class="row">' +
            (prev ? '<button class="btn btn-sm btn-secondary" id="diffBtn">Diff vs previous</button>' : '<span class="cell-muted">No prior version</span>') +
          '</div>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="row" style="gap:var(--sp-4);flex-wrap:wrap;margin-bottom:var(--sp-3);">' +
            '<label class="toggle-row" style="border:none;padding:0;gap:8px;cursor:pointer;"><input type="checkbox" class="checkbox" id="rev-attorney"' + (r.attorney && r.attorney.done ? ' checked' : '') + '> Attorney reviewed' +
              (r.attorney && r.attorney.date ? ' <span class="cell-muted mono">' + TSI.fmtDate(r.attorney.date) + '</span>' : '') + '</label>' +
            '<label class="toggle-row" style="border:none;padding:0;gap:8px;cursor:pointer;"><input type="checkbox" class="checkbox" id="rev-jt"' + (r.jt && r.jt.done ? ' checked' : '') + '> JT reviewed' +
              (r.jt && r.jt.date ? ' <span class="cell-muted mono">' + TSI.fmtDate(r.jt.date) + '</span>' : '') + '</label>' +
            '<span class="badge badge-blue">Approved ' + TSI.fmtDate(current.approvedDate) + '</span>' +
          '</div>' +
          '<div id="diffArea"></div>' +
          '<div class="section-label" style="color:var(--tsi-teal);font:500 11px var(--font-ui);text-transform:uppercase;letter-spacing:0.08em;margin:var(--sp-3) 0 var(--sp-2);border-bottom:0.5px solid var(--tint-teal);padding-bottom:6px;">Clause content</div>' +
          '<div class="row row-wrap no-print" style="gap:6px;margin-bottom:var(--sp-2);">' +
            '<span class="cell-muted" style="align-self:center;">Format</span>' +
            '<button class="chip variant-chip" data-axis="format" data-val="standard">Standard</button>' +
            '<button class="chip variant-chip" data-axis="format" data-val="lite">Lite</button>' +
            '<span class="cell-muted" style="align-self:center;margin-left:12px;">Stance</span>' +
            '<button class="chip variant-chip" data-axis="stance" data-val="balanced">Balanced</button>' +
            '<button class="chip variant-chip" data-axis="stance" data-val="pro-tsi">Pro-TSI</button>' +
            '<span id="variantNote" class="cell-muted" style="align-self:center;margin-left:8px;"></span>' +
          '</div>' +
          '<div class="doc-paper" id="clauseBody" style="width:auto;border:0.5px solid var(--color-border);padding:var(--sp-4);" data-view="working"><div class="empty-state">Loading…</div></div>' +
          '<div class="section-label" style="color:var(--tsi-teal);font:500 11px var(--font-ui);text-transform:uppercase;letter-spacing:0.08em;margin:var(--sp-4) 0 var(--sp-2);border-bottom:0.5px solid var(--tint-teal);padding-bottom:6px;">Change history</div>' +
          changelog +
        '</div>';

      // Variant chips (format × stance) — show the lite / pro-TSI versions here too.
      document.querySelectorAll('#detail .variant-chip').forEach(function (chip) {
        chip.addEventListener('click', function () { stubView[chip.dataset.axis] = chip.dataset.val; loadClauseBody(); });
      });
      loadClauseBody();

      // Reviewer checkboxes
      document.getElementById('rev-attorney').addEventListener('change', function (e) { setReviewer('attorney', e.target.checked); });
      document.getElementById('rev-jt').addEventListener('change', function (e) { setReviewer('jt', e.target.checked); });

      const diffBtn = document.getElementById('diffBtn');
      if (diffBtn) diffBtn.addEventListener('click', function () { showDiff(current, prev); });
    }

    async function loadClauseBody() {
      if (!current) return;
      const r = TSI.resolveStub(current, reg, stubView.format, stubView.stance);
      // Reflect active chips (using the RESOLVED variant so fallbacks read true).
      document.querySelectorAll('#detail .variant-chip').forEach(function (chip) {
        const val = chip.dataset.axis === 'format' ? r.resolvedFormat : r.resolvedStance;
        chip.classList.toggle('active', chip.dataset.val === val);
      });
      const note = document.getElementById('variantNote');
      const msgs = [];
      if (r.fellBackFormat) msgs.push('no lite variant');
      if (r.fellBackStance) msgs.push('no pro-TSI variant');
      if (note) note.textContent = msgs.length ? '(' + msgs.join(' · ') + ' — showing ' + r.resolvedFormat + ' / ' + r.resolvedStance + ')' : '';
      const el = document.getElementById('clauseBody');
      try { el.innerHTML = await TSI.readText(r.file); }
      catch (e) { el.innerHTML = '<div class="banner banner-error">Could not load ' + TSI.escapeHTML(r.file) + '</div>'; return; }
      TSI.initDefinedTerms(el, null);
    }

    function setReviewer(who, done) {
      current.reviewers = current.reviewers || {};
      current.reviewers[who] = { done: done, date: done ? TSI.stamp() : null };
      renderList();
      TSI.toast(done ? (who === 'jt' ? 'JT' : 'Attorney') + ' marked reviewed' : 'Review cleared', done ? 'ok' : 'warn');
    }

    async function showDiff(stub, prevEntry) {
      const area = document.getElementById('diffArea');
      area.innerHTML = '<div class="empty-state">Computing diff…</div>';
      try {
        const [curHTML, prevHTML] = await Promise.all([TSI.readText(stub.file), TSI.readText(prevEntry.prev)]);
        const curText = TSIDiff.htmlToText(curHTML), prevText = TSIDiff.htmlToText(prevHTML);
        const counts = TSIDiff.changeCount(prevText, curText);
        area.innerHTML =
          '<div class="diff-legend"><span><i style="background:color-mix(in srgb,var(--tsi-succ-green) 40%,#fff)"></i>Added in v' + TSI.escapeHTML(stub.version) + '</span>' +
          '<span><i style="background:color-mix(in srgb,var(--tsi-coral) 40%,#fff)"></i>Removed since v' + TSI.escapeHTML(prevEntry.version) + '</span>' +
          '<span class="cell-muted mono">' + counts.insertions + ' added · ' + counts.deletions + ' removed</span></div>' +
          '<div class="diff-pane">' + TSIDiff.renderInline(prevText, curText) + '</div>';
      } catch (e) {
        area.innerHTML = '<div class="banner banner-error">Diff failed: ' + TSI.escapeHTML(e.message) + '</div>';
      }
    }

    document.getElementById('saveBtn').addEventListener('click', async function () {
      reg.updated = TSI.stamp();
      const res = await TSI.saveFile('stub-registry', 'stub-registry.json', JSON.stringify(reg, null, 2));
      if (res.method === 'cancelled') return;
      TSI.toast(res.method === 'download' ? 'Downloaded stub-registry.json — replace config/ copy' : 'Saved reviewer state', 'ok');
    });

    async function init() {
      TSI.initChrome();
      reg = await TSI.readJSON('config/stub-registry.json');
      renderList();
      const want = TSI.params().stub;
      select(want && reg.stubs.some(function (s) { return s.id === want; }) ? want : reg.stubs[0].id);
    }
    init().catch(function (e) {
      document.getElementById('detail').innerHTML = '<div class="banner banner-error">' + TSI.escapeHTML(e.message) + '</div>';
    });
  
},
"tracker.html": function(){

    document.getElementById('themeBtn').addEventListener('click', TSI.toggleTheme);

    const STATUSES = [
      { v: 'pending',     label: 'Pending' },
      { v: 'in-progress', label: 'In progress' },
      { v: 'done',        label: 'Done' },
      { v: 'flagged',     label: 'Flagged' }
    ];

    let state = { index: null, project: null, projectId: null };

    function statusPill(s) {
      const map = { 'done': 'Done', 'in-progress': 'In progress', 'pending': 'Pending', 'flagged': 'Flagged' };
      return '<span class="rstatus rstatus-' + s + '">' + (map[s] || s) + '</span>';
    }

    function rowsFor(items, kind) {
      return items.map(function (it, i) {
        const modified = it.modified ? ' <span class="badge badge-warning" title="Modified from standard stub">modified</span>' : '';
        const stub = it.stubId ? ' <span class="cell-muted">· stub ' + TSI.escapeHTML(it.stubId) + ' v' + TSI.escapeHTML(it.stubVersion || '') + '</span>' : '';
        const opts = STATUSES.map(function (st) {
          return '<option value="' + st.v + '"' + (it.status === st.v ? ' selected' : '') + '>' + st.label + '</option>';
        }).join('');
        return '<tr>' +
          '<td class="cell-primary">' + TSI.escapeHTML(it.name) + stub + modified + '</td>' +
          '<td><span class="badge badge-sage">' + TSI.escapeHTML(it.reviewer || '—') + '</span></td>' +
          '<td>' + statusPill(it.status) +
            '<select class="select btn-sm no-print" data-kind="' + kind + '" data-i="' + i + '" style="height:28px;margin-top:4px;">' + opts + '</select></td>' +
          '<td><input class="input no-print" data-notes-kind="' + kind + '" data-notes-i="' + i + '" value="' + TSI.escapeHTML(it.notes || '') + '" placeholder="—" style="height:28px;">' +
            '<span class="working-only cell-muted print-notes">' + TSI.escapeHTML(it.notes || '') + '</span></td>' +
        '</tr>';
      }).join('');
    }

    function renderProject() {
      const p = state.project;
      if (!p) return;
      const sections = p.sections || [], annexes = p.annexes || [];
      const all = sections.concat(annexes);
      const done = all.filter(function (s) { return s.status === 'done'; }).length;
      const pct = TSI.pct(done, all.length);
      const ready = done === all.length && all.length > 0;

      document.getElementById('projectSummary').innerHTML =
        '<div class="card"><div class="card-header">' +
          '<div class="card-title">' + TSI.escapeHTML(p.name) + '</div>' +
          '<span class="badge badge-' + (p.status === 'In Review' ? 'warning' : 'info') + '">' + TSI.escapeHTML(p.status || '') + '</span>' +
        '</div><div class="card-body">' +
          '<div class="row" style="gap:var(--sp-4);flex-wrap:wrap;">' +
            '<div><div class="kpi-label">Buyer</div><div>' + TSI.escapeHTML(p.buyer || '—') + '</div></div>' +
            '<div><div class="kpi-label">Site</div><div>' + TSI.escapeHTML(p.site || '—') + '</div></div>' +
            '<div><div class="kpi-label">Contract price</div><div class="mono">' + TSI.fmtMoney(p.contractPrice) + '</div></div>' +
            '<div style="flex:1;min-width:200px;"><div class="kpi-label">Completion</div>' +
              '<div class="row"><div class="progress" style="flex:1;"><div class="progress-fill' + (ready ? ' full' : '') + '" style="width:' + pct + '%"></div></div>' +
              '<span class="mono">' + pct + '%</span></div></div>' +
          '</div>' +
        '</div></div>';

      const body = document.getElementById('sectionsBody');
      body.innerHTML =
        '<tr><td colspan="4" style="background:var(--color-bg);"><strong class="cell-muted" style="text-transform:uppercase;letter-spacing:0.06em;font-size:11px;">Terms &amp; conditions</strong></td></tr>' +
        rowsFor(sections, 'section') +
        '<tr><td colspan="4" style="background:var(--color-bg);"><strong class="cell-muted" style="text-transform:uppercase;letter-spacing:0.06em;font-size:11px;">Annexes</strong></td></tr>' +
        rowsFor(annexes, 'annex');

      // wire status + notes editors
      body.querySelectorAll('select[data-kind]').forEach(function (sel) {
        sel.addEventListener('change', function () {
          const arr = sel.dataset.kind === 'section' ? state.project.sections : state.project.annexes;
          const it = arr[+sel.dataset.i];
          it.status = sel.value;
          if (sel.value === 'done') it.completedAt = new Date().toISOString();
          renderProject();
        });
      });
      body.querySelectorAll('input[data-notes-kind]').forEach(function (inp) {
        inp.addEventListener('input', function () {
          const arr = inp.dataset.notesKind === 'section' ? state.project.sections : state.project.annexes;
          arr[+inp.dataset.notesI].notes = inp.value;
        });
      });

      document.getElementById('summaryFooter').innerHTML =
        '<div class="card-body row" style="justify-content:space-between;flex-wrap:wrap;gap:var(--sp-3);">' +
          '<div><span class="kpi-label">Complete</span> <span class="mono" style="font-size:18px;color:var(--color-heading);">' + done + ' of ' + all.length + '</span> sections</div>' +
          '<div><span class="kpi-label">Ready to package</span> ' +
            (ready ? '<span class="rstatus rstatus-done">Yes</span>' : '<span class="rstatus rstatus-pending">No — ' + (all.length - done) + ' open</span>') + '</div>' +
        '</div>';
    }

    async function selectProject(id) {
      state.projectId = id;
      const entry = state.index.projects.find(function (p) { return p.id === id; });
      if (!entry) return;
      state.project = await TSI.readJSON(entry.path);
      const url = new URL(location.href); url.searchParams.set('project', id); history.replaceState(null, '', url);
      renderProject();
    }

    async function renderAll() {
      const projects = await Promise.all(state.index.projects.map(function (p) {
        return TSI.readJSON(p.path).catch(function () { return null; });
      }));
      document.getElementById('allBody').innerHTML = projects.filter(Boolean).map(function (p) {
        const all = (p.sections || []).concat(p.annexes || []);
        const done = all.filter(function (s) { return s.status === 'done'; }).length;
        const pct = TSI.pct(done, all.length);
        const ready = done === all.length && all.length > 0;
        return '<tr>' +
          '<td class="cell-primary"><a href="?project=' + encodeURIComponent(p.id) + '">' + TSI.escapeHTML(p.name) + '</a></td>' +
          '<td><span class="badge badge-' + (p.status === 'In Review' ? 'warning' : 'info') + '">' + TSI.escapeHTML(p.status || '') + '</span></td>' +
          '<td class="num">' + done + ' / ' + all.length + '</td>' +
          '<td><div class="progress"><div class="progress-fill' + (ready ? ' full' : '') + '" style="width:' + pct + '%"></div></div></td>' +
          '<td>' + (ready ? '<span class="rstatus rstatus-done">Yes</span>' : '<span class="rstatus rstatus-pending">No</span>') + '</td>' +
          '<td class="cell-muted">' + TSI.fmtDate(p.lastModified) + '</td>' +
        '</tr>';
      }).join('');
    }

    document.getElementById('saveBtn').addEventListener('click', async function () {
      if (!state.project) return;
      state.project.lastModified = new Date().toISOString();
      const res = await TSI.saveFile('project-' + state.project.id, 'project.json', JSON.stringify(state.project, null, 2));
      if (res.method === 'cancelled') return;
      TSI.toast(res.method === 'download' ? 'Downloaded project.json — drop it into the project folder' : 'Saved review state', 'ok');
    });

    document.querySelectorAll('#scopeToggle .toggle-opt').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('#scopeToggle .toggle-opt').forEach(function (b) { b.classList.remove('active'); });
        btn.classList.add('active');
        const all = btn.dataset.scope === 'all';
        document.getElementById('allView').classList.toggle('hidden', !all);
        document.getElementById('projectView').classList.toggle('hidden', all);
        if (all) renderAll();
      });
    });

    async function init() {
      TSI.initChrome();
      state.index = await TSI.readJSON('projects/index.json');
      const sel = document.getElementById('projectSelect');
      sel.innerHTML = state.index.projects.map(function (p) {
        return '<option value="' + p.id + '">' + TSI.escapeHTML(p.id) + '</option>';
      }).join('');
      sel.addEventListener('change', function () { selectProject(sel.value); });
      const want = TSI.params().project;
      const start = (want && state.index.projects.some(function (p) { return p.id === want; })) ? want : state.index.projects[0].id;
      sel.value = start;
      await selectProject(start);
    }
    init().catch(function (e) {
      document.getElementById('projectSummary').innerHTML = '<div class="banner banner-error">' + TSI.escapeHTML(e.message) + '</div>';
    });
  
},
"visits.html": function(){

    document.getElementById('themeBtn').addEventListener('click', TSI.toggleTheme);

    // Column layout. `type` drives the cell control. c-index = position in COLS.
    const COLS = [
      { key: 'date', type: 'date' },
      { key: 'mill', type: 'mill' },
      { key: 'location', type: 'text' },
      { key: 'attendees', type: 'people' },
      { key: 'purpose', type: 'select' },
      { key: 'summary', type: 'text' },
      { key: 'followup', type: 'text' },
      { key: 'owner', type: 'owner' },
      { key: 'status', type: 'select' }
    ];

    const state = {
      visits: [], mills: [], people: [], purposes: [], statuses: [],
      dirty: false, millsDirty: false, peopleDirty: false, filter: ''
    };
    const tbody = document.getElementById('sheetBody');

    function markDirty() {
      state.dirty = true;
      document.getElementById('dirty').classList.remove('hidden');
    }
    function newVisit() {
      return { id: 'v-' + Math.random().toString(36).slice(2, 8), date: '', mill: '', location: '',
        attendees: [], purpose: '', summary: '', followup: '', owner: 'John Teal', status: 'Planned' };
    }
    function isBlank(v) {
      return !v.date && !v.mill && !v.location && !(v.attendees && v.attendees.length) &&
        !v.purpose && !v.summary && !v.followup && !v.status && (!v.owner || v.owner === 'John Teal');
    }

    // ── Cell builders ──────────────────────────────────────────
    function cellInput(v, col, r, c, type) {
      const inp = document.createElement('input');
      inp.className = 'sheet-input'; inp.type = type || 'text';
      inp.value = v[col.key] || ''; inp.dataset.r = r; inp.dataset.c = c;
      inp.addEventListener('input', function () { v[col.key] = inp.value; markDirty(); ensureTrailingBlank(); });
      wireNav(inp);
      return inp;
    }
    function cellSelect(v, col, r, c, options) {
      const sel = document.createElement('select');
      sel.className = 'sheet-select'; sel.dataset.r = r; sel.dataset.c = c;
      sel.innerHTML = '<option value=""></option>' + options.map(function (o) {
        return '<option' + (v[col.key] === o ? ' selected' : '') + '>' + TSI.escapeHTML(o) + '</option>';
      }).join('');
      if (col.key === 'status') applyStatusColor(sel, v.status);
      sel.addEventListener('change', function () {
        v[col.key] = sel.value; if (col.key === 'status') applyStatusColor(sel, sel.value);
        markDirty(); ensureTrailingBlank();
      });
      wireNav(sel);
      return sel;
    }
    function applyStatusColor(sel, val) {
      sel.className = 'sheet-select' + (val ? ' status-cell-' + val.replace(/[^A-Za-z]/g, '-') : '');
    }
    function cellMill(v, r, c) {
      const inp = document.createElement('input');
      inp.className = 'sheet-input'; inp.value = v.mill || ''; inp.dataset.r = r; inp.dataset.c = c;
      inp.addEventListener('input', function () { v.mill = inp.value; markDirty(); });
      TSI.autocomplete(inp, {
        source: function () { return state.mills; },
        label: function (m) { return m.name; },
        meta: function (m) { return m.location; },
        allowAdd: true,
        onPick: function (m) {
          if (m.__new) { addMill(m.name); v.mill = m.name; }
          else { v.mill = m.name; const loc = v.location; if (!loc && m.location) { v.location = m.location; syncCell(inp, 2); } }
          inp.value = v.mill; markDirty(); ensureTrailingBlank(); focusCol(inp, 3);
        }
      });
      wireNav(inp);
      return inp;
    }
    function cellOwner(v, r, c) {
      const inp = document.createElement('input');
      inp.className = 'sheet-input'; inp.value = v.owner || ''; inp.dataset.r = r; inp.dataset.c = c;
      inp.addEventListener('input', function () { v.owner = inp.value; markDirty(); });
      TSI.autocomplete(inp, {
        source: function () { return state.people; },
        label: function (p) { return p.name; },
        meta: function (p) { return p.org + (p.role ? ' · ' + p.role : ''); },
        allowAdd: true,
        onPick: function (p) { if (p.__new) addPerson(p.name); v.owner = p.name; inp.value = p.name; markDirty(); ensureTrailingBlank(); }
      });
      wireNav(inp);
      return inp;
    }
    // Attendees: chips + a typing input with autocomplete on the current token.
    function cellPeople(v, r, c) {
      const wrap = document.createElement('div');
      wrap.className = 'tokens'; wrap.dataset.r = r;
      const inp = document.createElement('input');
      inp.className = 'token-input'; inp.dataset.r = r; inp.dataset.c = c;
      function render() {
        wrap.querySelectorAll('.token').forEach(function (t) { t.remove(); });
        (v.attendees || []).forEach(function (name, i) {
          const isExt = !state.people.some(function (p) { return p.name === name && p.org === 'TSI'; });
          const chip = document.createElement('span');
          chip.className = 'token' + (isExt ? ' token-ext' : '');
          chip.innerHTML = TSI.escapeHTML(name) + '<span class="tk-x" title="Remove">×</span>';
          chip.querySelector('.tk-x').addEventListener('mousedown', function (e) {
            e.preventDefault(); v.attendees.splice(i, 1); markDirty(); render();
          });
          wrap.insertBefore(chip, inp);
        });
      }
      function addName(name) {
        name = (name || '').trim(); if (!name) return;
        v.attendees = v.attendees || [];
        if (v.attendees.indexOf(name) === -1) v.attendees.push(name);
        if (!state.people.some(function (p) { return p.name === name; })) addPerson(name);
        inp.value = ''; markDirty(); ensureTrailingBlank(); render();
      }
      wrap.addEventListener('mousedown', function (e) { if (e.target === wrap) { e.preventDefault(); inp.focus(); } });
      inp.addEventListener('keydown', function (e) {
        if ((e.key === ',' ) && inp.value.trim()) { e.preventDefault(); addName(inp.value); }
        else if (e.key === 'Backspace' && !inp.value && v.attendees && v.attendees.length) { v.attendees.pop(); markDirty(); render(); }
      });
      TSI.autocomplete(inp, {
        source: function () { return state.people.filter(function (p) { return (v.attendees || []).indexOf(p.name) === -1; }); },
        label: function (p) { return p.name; },
        meta: function (p) { return p.org + (p.role ? ' · ' + p.role : ''); },
        allowAdd: true,
        onPick: function (p) { addName(p.name); }
      });
      wireNav(inp);
      wrap.appendChild(inp); render();
      return wrap;
    }

    // ── Navigation (Enter = down same column) ──────────────────
    function wireNav(ctrl) {
      ctrl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !isAcOpen()) { e.preventDefault(); focusCol(ctrl, +ctrl.dataset.c, +1); }
      });
    }
    function isAcOpen() { const m = document.querySelector('.ac-menu'); return m && m.style.display === 'block'; }
    function focusCol(fromCtrl, c, delta) {
      const rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
      const tr = fromCtrl.closest('tr'); let ri = rows.indexOf(tr);
      if (delta) ri += delta; else ri = ri; // same row when delta undefined? no — for tab-into location we pass no delta and want same row
      let target;
      if (delta) {
        let next = rows[ri];
        if (!next) { addRow(newVisit()); next = tbody.lastElementChild; }
        target = next.querySelector('[data-c="' + c + '"]');
      } else {
        target = tr.querySelector('[data-c="' + c + '"]');
      }
      if (target) target.focus();
    }
    // Re-sync a cell's control value from state (e.g. mill pick fills location).
    function syncCell(fromCtrl, c) {
      const tr = fromCtrl.closest('tr');
      const ctrl = tr.querySelector('[data-c="' + c + '"]');
      const r = +tr.dataset.r; const v = state.visits[r];
      if (ctrl && v) ctrl.value = v[COLS[c].key] || '';
    }

    // ── Row rendering ──────────────────────────────────────────
    function buildRow(v, r) {
      const tr = document.createElement('tr');
      tr.dataset.r = r;
      const num = document.createElement('td');
      num.className = 'rownum'; num.textContent = r + 1;
      const del = document.createElement('div'); del.className = 'row-del'; del.title = 'Delete row'; del.textContent = '×';
      del.addEventListener('click', function () { deleteRow(r); });
      num.appendChild(del); tr.appendChild(num);

      COLS.forEach(function (col, c) {
        const td = document.createElement('td');
        let ctrl;
        if (col.type === 'date') ctrl = cellInput(v, col, r, c, 'date');
        else if (col.type === 'text') ctrl = cellInput(v, col, r, c, 'text');
        else if (col.type === 'select') ctrl = cellSelect(v, col, r, c, col.key === 'purpose' ? state.purposes : state.statuses);
        else if (col.type === 'mill') ctrl = cellMill(v, r, c);
        else if (col.type === 'owner') ctrl = cellOwner(v, r, c);
        else if (col.type === 'people') ctrl = cellPeople(v, r, c);
        td.appendChild(ctrl); tr.appendChild(td);
      });
      return tr;
    }
    function renderAll() {
      tbody.innerHTML = '';
      const q = state.filter.toLowerCase();
      state.visits.forEach(function (v, r) {
        if (q) {
          const hay = [v.mill, v.location, v.summary, v.followup, v.owner, (v.attendees || []).join(' '), v.purpose, v.status].join(' ').toLowerCase();
          if (hay.indexOf(q) === -1) return;
        }
        tbody.appendChild(buildRow(v, r));
      });
      updateCount();
    }
    function addRow(v) {
      state.visits.push(v);
      if (!state.filter) tbody.appendChild(buildRow(v, state.visits.length - 1));
      updateCount();
    }
    function deleteRow(r) {
      state.visits.splice(r, 1); markDirty(); renderAll();
    }
    function ensureTrailingBlank() {
      const last = state.visits[state.visits.length - 1];
      if (!last || !isBlank(last)) { addRow(newVisit()); }
    }
    function updateCount() {
      const real = state.visits.filter(function (v) { return !isBlank(v); }).length;
      document.getElementById('count').textContent = real + ' visit' + (real === 1 ? '' : 's');
    }

    // ── Reference-list additions ───────────────────────────────
    function addMill(name) {
      if (state.mills.some(function (m) { return m.name === name; })) return;
      state.mills.push({ id: 'mill-' + Math.random().toString(36).slice(2, 7), name: name, location: '', region: '', contact: '' });
      state.millsDirty = true;
    }
    function addPerson(name) {
      if (state.people.some(function (p) { return p.name === name; })) return;
      state.people.push({ id: 'p-' + Math.random().toString(36).slice(2, 7), name: name, org: '', role: '' });
      state.peopleDirty = true;
    }

    // ── Save / export ──────────────────────────────────────────
    function cleanVisits() { return state.visits.filter(function (v) { return !isBlank(v); }); }

    document.getElementById('saveBtn').addEventListener('click', async function () {
      const payload = { _comment: 'Mill visit log.', updated: TSI.stamp(), purposes: state.purposes, statuses: state.statuses, visits: cleanVisits() };
      const res = await TSI.saveFile('mill-visits', 'mill-visits.json', JSON.stringify(payload, null, 2));
      if (res.method === 'cancelled') return;
      if (state.millsDirty) {
        await TSI.saveFile('mills', 'mills.json', JSON.stringify({ _comment: 'Mill reference list.', updated: TSI.stamp(), mills: state.mills }, null, 2), { repick: true });
        state.millsDirty = false;
      }
      if (state.peopleDirty) {
        await TSI.saveFile('people', 'people.json', JSON.stringify({ _comment: 'People reference list.', updated: TSI.stamp(), people: state.people }, null, 2), { repick: true });
        state.peopleDirty = false;
      }
      state.dirty = false; document.getElementById('dirty').classList.add('hidden');
      TSI.toast(res.method === 'download' ? 'Downloaded mill-visits.json — drop it in the visits folder' : 'Saved mill visits', 'ok');
    });

    document.getElementById('csvBtn').addEventListener('click', function () {
      const headers = ['Date', 'Mill', 'Location', 'Attendees', 'Purpose', 'Summary', 'Follow-up', 'Owner', 'Status'];
      const q = function (s) { return '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"'; };
      const rows = cleanVisits().map(function (v) {
        return [v.date, v.mill, v.location, (v.attendees || []).join('; '), v.purpose, v.summary, v.followup, v.owner, v.status].map(q).join(',');
      });
      const csv = headers.map(q).join(',') + '\n' + rows.join('\n');
      TSI.downloadFile('mill-visits_' + TSI.stamp() + '.csv', csv, 'text/csv');
      TSI.toast('Exported CSV', 'ok');
    });

    document.getElementById('addBtn').addEventListener('click', function () {
      // drop any trailing blank first so the new row lands at the end cleanly
      addRow(newVisit());
      const rows = tbody.querySelectorAll('tr');
      const last = rows[rows.length - 1];
      if (last) { const first = last.querySelector('[data-c="0"]'); if (first) first.focus(); }
    });

    document.getElementById('search').addEventListener('input', function (e) {
      state.filter = e.target.value; renderAll();
    });

    // ── Init ───────────────────────────────────────────────────
    async function init() {
      TSI.initChrome();
      const [visitsFile, millsFile, peopleFile] = await Promise.all([
        TSI.readJSON('visits/mill-visits.json'),
        TSI.readJSON('config/mills.json'),
        TSI.readJSON('config/people.json')
      ]);
      state.visits = visitsFile.visits || [];
      state.purposes = visitsFile.purposes || [];
      state.statuses = visitsFile.statuses || [];
      state.mills = millsFile.mills || [];
      state.people = peopleFile.people || [];
      renderAll();
      ensureTrailingBlank();
    }
    init().catch(function (e) {
      tbody.innerHTML = '<tr><td colspan="10"><div class="banner banner-error" style="margin:12px;">Failed to load: ' + TSI.escapeHTML(e.message) + '</div></td></tr>';
    });
  
}
};

var NAMES = ['index.html','assembly.html','stubs.html','tracker.html','visits.html'];
function mount(file, params){
  if(!window.__PAGES[file]) file='index.html';
  window.__pendingParams = params || {};
  window.__activePage = file;
  document.getElementById('app').innerHTML = window.__PAGES[file];
  try { window.__INITS[file](); } catch(e){ console.error('page init error ('+file+'):', e); }
  document.querySelectorAll('#app .app-nav a').forEach(function(a){ a.classList.toggle('active', a.getAttribute('href')===file); });
  try { location.hash = file + (params && Object.keys(params).length ? ('?'+Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&')) : ''); } catch(e){}
  window.scrollTo(0,0);
}
window.__nav = function(href){
  var file = href.split('?')[0].split('/').pop() || 'index.html';
  var q = href.indexOf('?')>=0 ? href.slice(href.indexOf('?')+1) : '';
  var params = {}; if(q) q.split('&').forEach(function(kv){ var p=kv.split('='); if(p[0]) params[decodeURIComponent(p[0])]=decodeURIComponent((p[1]||'').replace(/\+/g,' ')); });
  mount(file, params);
};
document.addEventListener('click', function(e){
  var a = e.target && e.target.closest && e.target.closest('a[href]'); if(!a) return;
  var href = a.getAttribute('href'); if(!href || /^https?:|^mailto:|^#/.test(href)) return;
  var file = href.split('?')[0].split('/').pop();
  if(NAMES.indexOf(file)!==-1){ e.preventDefault(); window.__nav(href); }
}, true);
(function(){ var h=(location.hash||'').replace(/^#/,''); window.__nav(h||'index.html'); })();
</script>
