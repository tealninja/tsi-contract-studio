statement so a withheld signature does\n    not, by itself, defeat an otherwise-earned milestone.]\u003c/span\u003e\n\n  \u003cdiv class=\"sig-grid\"\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eCertified by Seller — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eConfirmed by Buyer — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n","document-library/forms/form-notice-of-readiness.html":"\u003c!-- TSI Contract Studio · form · Notice of commissioning readiness · v1.0\n     Fragment only — the annex letter and title are supplied by the annex slot.\n     Internal markup (.draft-note, .atty-note) is stripped on clean export. --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"form-notice-of-readiness\"\u003e\n  \u003cp\u003eBy this notice \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e declares to \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e that the\n    \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e at the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e is ready for\n    \u003cspan data-term=\"Commissioning\"\u003eCommissioning\u003c/span\u003e under the \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e. The\n    notice fixes the readiness date and lists the prerequisites Seller has satisfied; Buyer then has a defined window to\n    respond.\u003c/p\u003e\n\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eProject\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eNotice date\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eReadiness date declared\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eEquipment / scope covered\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003eStatement of readiness\u003c/h3\u003e\n  \u003cp\u003eSeller confirms that the Equipment has been installed, inspected, and mechanically completed in accordance with the\n    Agreement, and is ready for Commissioning to begin on the readiness date declared above.\u003c/p\u003e\n\n  \u003ch3\u003ePrerequisites satisfied by Seller\u003c/h3\u003e\n  \u003cdiv class=\"tbl-wrap\"\u003e\n    \u003ctable class=\"data-table\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\u003cth\u003ePrerequisite\u003c/th\u003e\u003cth\u003eSatisfied\u003c/th\u003e\u003cth\u003eReference\u003c/th\u003e\u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003eMechanical completion inspection closed\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003ePre-commissioning checks completed (loop, rotation, leak)\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eSafety systems and interlocks proven\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eAs-built and operating documentation issued\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eOutstanding punch items non-blocking\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n  \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Mark each prerequisite satisfied and cite the closing document (inspection report,\n    check sheet, transmittal number). Any item that remains open should be listed as a non-blocking punch item, not\n    marked satisfied.]\u003c/span\u003e\n\n  \u003ch3\u003eBuyer response window\u003c/h3\u003e\n  \u003cp\u003eBuyer shall, within \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e business days of receipt, either accept this notice and confirm\n    the Commissioning start, or state in writing the specific prerequisites it disputes. If Buyer does not respond within\n    the window, the Equipment is deemed ready and Commissioning may proceed on the declared readiness date.\u003c/p\u003e\n  \u003cspan class=\"atty-note note-block\"\u003e[ATTY: The deemed-readiness default on Buyer silence is a Seller-protective term.\n    Confirm the response window matches the notice-and-response mechanism in the main agreement, and that \"business days\"\n    is defined consistently there before relying on the deeming provision.]\u003c/span\u003e\n\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eSeller contact\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eTelephone / email\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003cdiv class=\"sig-grid\"\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eIssued by Seller — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eReceived by Buyer — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n","document-library/technical/installation-precommissioning-requirements.html":"\u003c!-- TSI Contract Studio · technical annex · installation & pre-commissioning requirements · fragment only --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"installation-precommissioning-requirements\"\u003e\n  \u003cp\u003eThis annex sets the site, scope, and readiness requirements for installation and pre-commissioning of the\n    \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e. It defines the division of work between \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e\n    and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e and the conditions that must be in place before\n    \u003cspan data-term=\"Commissioning\"\u003eCommissioning\u003c/span\u003e begins. The responsibility matrix in the accompanying annex governs\n    line-by-line allocation; this annex sets the substance.\u003c/p\u003e\n\n  \u003ch3\u003e1. Division of scope\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eSeller scope\u003c/th\u003e\u003ctd\u003esupply of the Equipment, supervision of mechanical and electrical installation, controls configuration, functional checks, pre-commissioning, Commissioning, and performance testing\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eBuyer scope\u003c/th\u003e\u003ctd\u003efoundations and civil works, building services, utility connections to the agreed terminal points, rigging and setting labor, bulk materials, permits, and operating personnel\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eTerminal points\u003c/th\u003e\u003ctd\u003eas shown on the interface drawing; Seller responsible from the terminal point inward\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm whether Seller supervises only or installs; several rows below assume supervised install with Buyer labor.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e2. Foundations and civil readiness\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003eFoundations poured, cured to design strength, and surveyed within the tolerances on the foundation drawing before the Equipment is set.\u003c/li\u003e\n    \u003cli\u003eAnchor bolts, pockets, and embedments placed to the setting plan; as-built survey issued to Seller.\u003c/li\u003e\n    \u003cli\u003eFloor loading, drainage, and access routes for rigging confirmed clear.\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003ch3\u003e3. Utilities readiness\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eElectrical\u003c/th\u003e\u003ctd\u003esupply energized to the terminal points at the rated voltage and capacity; grounding grid complete\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eSteam / condensate\u003c/th\u003e\u003ctd\u003eavailable at the design pressure and temperature, clean and blown through\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eCompressed air\u003c/th\u003e\u003ctd\u003einstrument air at design pressure, dry, oil-free, to the terminal point\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eWater\u003c/th\u003e\u003ctd\u003eprocess and cooling water at design flow, pressure, and quality\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eNetwork\u003c/th\u003e\u003ctd\u003econtrol-network drop and plant time source available at the Equipment\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"int-note\"\u003e[INT: List actual terminal-point pressures/flows from the utility datasheet; energy guarantees in the test protocol depend on these being met.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e4. Environmental conditions\u003c/h3\u003e\n  \u003cp\u003eThe installation area shall be weather-tight, lit, and ventilated, with ambient held within the design range and free of\n    construction dust before electrical and controls equipment is uncrated. Housekeeping and lay-down areas are provided by\n    \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e.\u003c/p\u003e\n\n  \u003ch3\u003e5. Safety and lockout/tagout\u003c/h3\u003e\n  \u003cp\u003eAll work follows the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e safety plan. Energy isolation uses the Site lockout/tagout (LOTO)\n    procedure; no \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e is energized or pressurized for pre-commissioning until isolation\n    boundaries are established and permits issued. Safety data sheets (SDS) for all commissioning fluids and lubricants are\n    provided and reviewed before use.\n    \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Confirm whose LOTO program controls during shared occupancy (Buyer's Site program typically governs); align with the site-access and indemnity articles.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e6. Pre-commissioning checklist\u003c/h3\u003e\n  \u003cp\u003ePre-commissioning confirms the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e is mechanically and electrically complete and\n    safe to energize. The following are signed off before \u003cspan data-term=\"Commissioning\"\u003eCommissioning\u003c/span\u003e:\u003c/p\u003e\n  \u003cdiv class=\"tbl-wrap\"\u003e\n    \u003ctable class=\"data-table\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\u003cth\u003eCheck\u003c/th\u003e\u003cth\u003eMethod\u003c/th\u003e\u003cth class=\"num\"\u003eStatus\u003c/th\u003e\u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003eAlignment and level within tolerance\u003c/td\u003e\u003ctd\u003esurvey / dial indicator\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eFasteners torqued, torque log complete\u003c/td\u003e\u003ctd\u003ecalibrated wrench log\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eLubrication charged to schedule\u003c/td\u003e\u003ctd\u003elubrication chart sign-off\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eGuards fitted, interlocks proven\u003c/td\u003e\u003ctd\u003efunction test\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003ePiping flushed, leak-tested\u003c/td\u003e\u003ctd\u003epressure test record\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eGrounding and bonding verified\u003c/td\u003e\u003ctd\u003econtinuity test\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eMotor rotation confirmed (uncoupled)\u003c/td\u003e\u003ctd\u003ebump test\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eI/O loop checks complete (SAT)\u003c/td\u003e\u003ctd\u003eloop check sheets\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eSafety system proven\u003c/td\u003e\u003ctd\u003etrip test\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003ch3\u003e7. Sign-off\u003c/h3\u003e\n  \u003cp\u003eCompletion of pre-commissioning is recorded on a joint sign-off. Outstanding items are logged on a punch list with owners\n    and dates; only items that do not affect safe energization may remain open into \u003cspan data-term=\"Commissioning\"\u003eCommissioning\u003c/span\u003e.\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eSeller representative\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill-block\"\u003e\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eBuyer representative\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill-block\"\u003e\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eDate\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\u003c/div\u003e\n","document-library/technical/mill-standards-coatings.html":"\u003c!-- TSI Contract Studio · technical annex · mill coatings & surface-protection standards · fragment only --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"mill-standards-coatings\"\u003e\n  \u003cp\u003eThis annex sets the surface-preparation and protective-coating standards for the\n    \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e supplied by \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e. Systems are selected for\n    the humid, warm paper-mill environment; the wet-end and washdown zones receive the more resistant systems. Color and\n    system selections shown for confirmation shall match the \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e mill standard.\n    \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm Buyer equipment color (RAL) and any corporate coating specification before release.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e1. Surface preparation\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eFerrous, immersion / wet-end\u003c/th\u003e\u003ctd\u003eabrasive blast to SSPC-SP 10 / NACE No. 2 (near-white)\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eFerrous, general\u003c/th\u003e\u003ctd\u003eabrasive blast to SSPC-SP 6 / NACE No. 3 (commercial)\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eMachined / touch-up areas\u003c/th\u003e\u003ctd\u003eSSPC-SP 2 / SP 3 (hand or power tool) where blasting is impractical\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eSurface profile\u003c/th\u003e\u003ctd\u003e50&ndash;75 µm angular anchor pattern\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eCleanliness before coat\u003c/th\u003e\u003ctd\u003esoluble salts within the coating maker's limit; dust ISO 8502-3 rating ≤ 2\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003e2. Coating systems\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eGeneral structural\u003c/th\u003e\u003ctd\u003ezinc-rich epoxy primer + epoxy intermediate + polyurethane topcoat\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eWet-end / washdown\u003c/th\u003e\u003ctd\u003ehigh-build epoxy, chemically resistant, over zinc-rich primer\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eHigh-temperature (&gt; 120 °C)\u003c/th\u003e\u003ctd\u003einorganic silicone or silicone-aluminium, no organic topcoat\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eStainless / non-ferrous\u003c/th\u003e\u003ctd\u003euncoated unless required for identification\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003e3. Dry film thickness\u003c/h3\u003e\n  \u003cdiv class=\"tbl-wrap\"\u003e\n    \u003ctable class=\"data-table\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\u003cth\u003eSystem\u003c/th\u003e\u003cth class=\"num\"\u003ePrimer (µm)\u003c/th\u003e\u003cth class=\"num\"\u003eIntermediate (µm)\u003c/th\u003e\u003cth class=\"num\"\u003eTopcoat (µm)\u003c/th\u003e\u003cth class=\"num\"\u003eTotal DFT (µm)\u003c/th\u003e\u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003eGeneral structural\u003c/td\u003e\u003ctd class=\"num\"\u003e50&ndash;75\u003c/td\u003e\u003ctd class=\"num\"\u003e100&ndash;125\u003c/td\u003e\u003ctd class=\"num\"\u003e50&ndash;75\u003c/td\u003e\u003ctd class=\"num\"\u003e200&ndash;275\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eWet-end / washdown\u003c/td\u003e\u003ctd class=\"num\"\u003e75\u003c/td\u003e\u003ctd class=\"num\"\u003e150&ndash;200\u003c/td\u003e\u003ctd class=\"num\"\u003e75\u003c/td\u003e\u003ctd class=\"num\"\u003e300&ndash;350\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eHigh-temperature\u003c/td\u003e\u003ctd class=\"num\"\u003e25&ndash;40\u003c/td\u003e\u003ctd class=\"num\"\u003e&mdash;\u003c/td\u003e\u003ctd class=\"num\"\u003e25&ndash;40\u003c/td\u003e\u003ctd class=\"num\"\u003e50&ndash;80\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n  \u003cp\u003e\u003cspan class=\"int-note\"\u003e[INT: DFT is nominal per SSPC-PA 2; over-application on high-temp silicone causes mud-cracking — hold to the range.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e4. Color and finish\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eEquipment body\u003c/th\u003e\u003ctd\u003eRAL \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e (Buyer standard to confirm)\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eGuards / hazard\u003c/th\u003e\u003ctd\u003eRAL 1023 traffic yellow\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eSafety stops / hazard edges\u003c/th\u003e\u003ctd\u003eRAL 3020 traffic red\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eFinish\u003c/th\u003e\u003ctd\u003esemi-gloss; gloss not required\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003e5. Inspection and testing\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003eAmbient hold points: surface temperature ≥ 3 °C above dew point, RH ≤ 85%, recorded before each coat.\u003c/li\u003e\n    \u003cli\u003eDFT verified per SSPC-PA 2 with a calibrated gauge; readings logged by area.\u003c/li\u003e\n    \u003cli\u003eAdhesion by cross-cut (ASTM D3359) or pull-off (ASTM D4541) on witness coupons for the wet-end system.\u003c/li\u003e\n    \u003cli\u003eHoliday / pinhole detection on immersion and washdown coatings per NACE SP0188 (low-voltage wet sponge for DFT &lt; 500 µm).\u003c/li\u003e\n    \u003cli\u003eEach stage recorded on a coating inspection report; final report issued with the Equipment.\u003c/li\u003e\n  \u003c/ul\u003e\n  \u003cp\u003e\u003cspan class=\"atty-note note-block\"\u003e[ATTY: Coating warranty duration and exclusions (mechanical damage, Buyer washdown chemistry) should be tied to the general warranty article, not left open here.]\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n","document-library/technical/mill-standards-controls.html":"\u003c!-- TSI Contract Studio · technical annex · mill controls & automation standards · fragment only --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"mill-standards-controls\"\u003e\n  \u003cp\u003eThis annex sets the control-system, automation, and acceptance-test standards for the\n    \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e supplied by \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e. Platform selections\n    shown for confirmation shall match the \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e mill automation standard before detailed design.\n    \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm PLC/HMI platform and network standard against the mill's existing automation base before release.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e1. Control platform\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003ePLC / controller\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e (Buyer standard to confirm)\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eProgramming standard\u003c/th\u003e\u003ctd\u003eIEC 61131-3, structured and reusable function blocks\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eHMI / SCADA\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e, high-performance graphics per ISA-101\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eRedundancy\u003c/th\u003e\u003ctd\u003econtroller and power supply redundancy on machine-critical loops\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eTime source\u003c/th\u003e\u003ctd\u003eplant NTP; controllers synchronized to a single reference\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003e2. I/O standards\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003eAnalog inputs: 4&ndash;20 mA, 2-wire where possible, individually fused, with signal conditioning and channel-level diagnostics.\u003c/li\u003e\n    \u003cli\u003eRTD / thermocouple inputs to the sensor standard on the instrument datasheet; RTDs are 3-wire Pt100.\u003c/li\u003e\n    \u003cli\u003eDiscrete I/O: 24 V DC, isolated, LED-indicated, with 20% installed spare capacity per rack minimum.\u003c/li\u003e\n    \u003cli\u003eSafety I/O routed through a separate safety controller rated to the required SIL; not commingled with the process controller.\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003ch3\u003e3. Networks\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003ePlant / supervisory\u003c/th\u003e\u003ctd\u003eEthernet/IP on managed switches, ring or star with media redundancy\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eDevice level\u003c/th\u003e\u003ctd\u003eEthernet/IP or Profibus DP to drives and remote I/O, per Buyer standard\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eInstrument bus\u003c/th\u003e\u003ctd\u003eHART over 4&ndash;20 mA for smart transmitters; Profibus PA where specified\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eSegregation\u003c/th\u003e\u003ctd\u003econtrol network physically and logically separated from the business network\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"int-note\"\u003e[INT: Confirm whether existing mill backbone is Ethernet/IP or Profibus; mixed-protocol gateways add FAT scope.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e4. Batch and information models\u003c/h3\u003e\n  \u003cp\u003eWhere the process is procedural, control is structured to ISA-88 (physical model, procedures, phases) for portability and\n    clear state handling. Data exchange with the \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e manufacturing systems follows the ISA-95\n    equipment and information hierarchy so that production, quality, and downtime data map to the mill MES without bespoke\n    translation.\u003c/p\u003e\n\n  \u003ch3\u003e5. Alarms\u003c/h3\u003e\n  \u003cp\u003eAlarm design follows ISA-18.2: every alarm is rationalized, prioritized, and actionable, with defined setpoint, deadband,\n    and operator response. Nuisance and standing alarms are eliminated before SAT. Alarm rate targets and shelving rules are\n    agreed with the \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e operations team.\u003c/p\u003e\n\n  \u003ch3\u003e6. Tag naming\u003c/h3\u003e\n  \u003cp\u003eEvery instrument, loop, and I/O point carries a unique tag from the project tag register, consistent across the P&amp;IDs,\n    loop diagrams, PLC program, and HMI. Tag structure follows ISA-5.1 identification (measured variable + loop number +\n    suffix), extended by the mill area/unit convention.\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eTag pattern\u003c/th\u003e\u003ctd\u003e[area]-[unit]-[ISA function][loop no.] (e.g. DR1-TT-2104)\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eRegister owner\u003c/th\u003e\u003ctd\u003eSeller maintains during design; handed to Buyer at close-out\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003e7. Cybersecurity baseline\u003c/h3\u003e\n  \u003cp\u003eThe control system is delivered hardened to a baseline aligned with IEC 62443: default credentials removed, unused ports\n    and services disabled, role-based access with named accounts, signed firmware where supported, and a documented backup of\n    controller, HMI, and drive configurations at handover. No remote access is enabled without the Buyer's written authorization\n    and an agreed secure method.\n    \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Remote-access provisions interact with the support/warranty terms and Buyer IT policy; confirm the authorized method and audit obligations.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e8. Factory and site acceptance testing\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eFAT\u003c/th\u003e\u003ctd\u003eat Seller works, on simulated I/O, against the approved test plan; Buyer witness invited\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eSAT\u003c/th\u003e\u003ctd\u003eat Site, on live I/O, loop-checked end to end before \u003cspan data-term=\"Commissioning\"\u003eCommissioning\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003ePunch list\u003c/th\u003e\u003ctd\u003eopen items logged and closed before \u003cspan data-term=\"Substantial Completion\"\u003eSubstantial Completion\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Set FAT witness notice period and whether FAT sign-off is a payment milestone.]\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n","document-library/technical/mill-standards-electrical.html":"\u003c!-- TSI Contract Studio · technical annex · mill electrical standards · fragment only --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"mill-standards-electrical\"\u003e\n  \u003cp\u003eThis annex sets the electrical design, supply, and installation standards to which the\n    \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e is engineered and delivered by \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e.\n    Values marked for confirmation are project-specific and shall be verified against the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e\n    electrical single-line diagram before release for manufacture.\n    \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm all supply values against the Site single-line and utility study before first send.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e1. Supply and reference conditions\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eMain power supply\u003c/th\u003e\u003ctd\u003e480 V, 3-phase, 60 Hz, 3-wire plus ground\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eControl power\u003c/th\u003e\u003ctd\u003e120 V, 1-phase, 60 Hz, derived from control transformers within each enclosure\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eDC control / instrument\u003c/th\u003e\u003ctd\u003e24 V DC, regulated, from redundant supplies\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eVoltage tolerance\u003c/th\u003e\u003ctd\u003e±10% steady state, ±15% transient\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eFrequency tolerance\u003c/th\u003e\u003ctd\u003e±2%\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eShort-circuit withstand (SCCR)\u003c/th\u003e\u003ctd\u003e65 kA at 480 V, minimum \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eDesign ambient\u003c/th\u003e\u003ctd\u003e40 °C in-enclosure, ≤ 95% RH non-condensing\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"int-note\"\u003e[INT: Utility fault current at the incomer governs SCCR; do not release panel ratings until the study is closed.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e2. Area classification\u003c/h3\u003e\n  \u003cp\u003eElectrical apparatus shall be selected for the area classification of its installed location. Unless stated otherwise on\n    the classification drawing, the wet-end, hydraulic room, and dryer hood plenum are treated as ordinary (unclassified)\n    industrial areas with high ambient moisture; enclosures in washdown zones are IP66 / NEMA 4X. Any location classified as\n    hazardous under NFPA 70 (NEC) Article 500 shall use apparatus rated for the applicable Class, Division, and Group.\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eStandard indoor, dry\u003c/th\u003e\u003ctd\u003eIP54 / NEMA 12\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eWashdown and wet-end\u003c/th\u003e\u003ctd\u003eIP66 / NEMA 4X, stainless enclosures\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eOutdoor\u003c/th\u003e\u003ctd\u003eIP66 / NEMA 4X with condensation control\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eClassified areas (if any)\u003c/th\u003e\u003ctd\u003eper NFPA 70 Article 500 &mdash; Class \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e, Div \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e, Group \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003e3. Cabling and conduit\u003c/h3\u003e\n  \u003cp\u003ePower, control, and instrument cabling shall be segregated and routed in separate raceways or with the minimum\n    separation set by IEEE 518 to limit coupled noise. Cable sizing, derating, and overcurrent protection follow NFPA 70.\u003c/p\u003e\n  \u003cul\u003e\n    \u003cli\u003ePower conductors: XLPE or EPR insulated copper, 600 V rated, sized for continuous load with no derated conductor above 75% of ampacity.\u003c/li\u003e\n    \u003cli\u003eInstrument signals: individually shielded twisted pair, drain grounded at one end only (control system side).\u003c/li\u003e\n    \u003cli\u003eVFD motor leads: symmetrical shielded VFD cable, gland-terminated with 360° shield bond at both ends.\u003c/li\u003e\n    \u003cli\u003eConduit: rigid galvanized steel in process areas; liquidtight flexible for final motor and instrument connections; PVC-coated in washdown zones.\u003c/li\u003e\n    \u003cli\u003eFill and bend radius per NFPA 70; no raceway above 40% fill.\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003ch3\u003e4. Motors and variable-frequency drives\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eMotor standard\u003c/th\u003e\u003ctd\u003eNEMA MG 1, Design B, inverter-duty per MG 1 Part 31 where fed from a VFD\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eEfficiency\u003c/th\u003e\u003ctd\u003eNEMA Premium, minimum\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eInsulation / rise\u003c/th\u003e\u003ctd\u003eClass F insulation, Class B temperature rise\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eEnclosure\u003c/th\u003e\u003ctd\u003eTEFC standard; TENV or washdown-duty in wet-end\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eBearings (VFD-fed ≥ 75 kW)\u003c/th\u003e\u003ctd\u003einsulated non-drive-end bearing or shaft grounding ring to control circulating current\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eVFD platform\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e (Buyer standard to confirm)\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eVFD input\u003c/th\u003e\u003ctd\u003eactive front end or 6-pulse with line reactor; harmonic distortion to meet IEEE 519 at the point of common coupling\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm Buyer's preferred VFD and PLC vendors; harmonic compliance point (PCC vs. drive terminals) must be agreed.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e5. Grounding and bonding\u003c/h3\u003e\n  \u003cp\u003eGrounding and bonding follow NFPA 70 Article 250 and IEEE 142. All enclosures, motor frames, conduit, cable trays, and\n    exposed metalwork are bonded to the equipment grounding conductor and tied to the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e\n    ground grid. A dedicated, isolated instrument ground reference is provided for the control system where required by the\n    vendor, brought to a single ground point to avoid loops.\u003c/p\u003e\n\n  \u003ch3\u003e6. Labeling and identification\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003eEvery enclosure, device, terminal, and conductor is uniquely tagged per the project tag register and the loop diagrams.\u003c/li\u003e\n    \u003cli\u003eEngraved laminate nameplates (white-on-black for equipment, white-on-red for hazard/arc-flash) mechanically fastened, not adhesive.\u003c/li\u003e\n    \u003cli\u003eArc-flash incident-energy labels applied per NFPA 70E following the Buyer's study.\n      \u003cspan class=\"int-note\"\u003e[INT: Arc-flash study is Buyer scope; Seller supplies equipment data to feed it.]\u003c/span\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003ch3\u003e7. Recommended spares\u003c/h3\u003e\n  \u003cp\u003eSeller shall furnish a recommended spare-parts list covering, at minimum, one of each fuse rating, control relay, contactor\n    coil, VFD control board, and I/O module family, plus commissioning spares consumed during startup. Quantities to be agreed.\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eCommissioning spares\u003c/th\u003e\u003ctd\u003eincluded in supply\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eTwo-year operational spares\u003c/th\u003e\u003ctd\u003equoted separately, Buyer election \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"atty-note note-block\"\u003e[ATTY: Recommended-spares list is advisory; confirm it does not create a warranty that the listed spares are sufficient for any stated availability figure.]\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n","document-library/technical/mill-standards-mechanical.html":"\u003c!-- TSI Contract Studio · technical annex · mill mechanical standards · fragment only --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"mill-standards-mechanical\"\u003e\n  \u003cp\u003eThis annex sets the mechanical design, materials, and workmanship standards for the\n    \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e supplied by \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e &mdash; dryer sections,\n    rolls, frames, and rotating assemblies. Where a value is shown for confirmation it is project-specific and shall be\n    verified against the process datasheet before release for manufacture.\u003c/p\u003e\n\n  \u003ch3\u003e1. Materials of construction\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eStructural steel\u003c/th\u003e\u003ctd\u003eASTM A36 / A572 Gr. 50, painted per the coatings annex\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eMachined frames\u003c/th\u003e\u003ctd\u003ecast iron ASTM A48 Class 40 or fabricated and stress-relieved steel\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eRolls (shells)\u003c/th\u003e\u003ctd\u003ecentrifugally cast iron or fabricated steel, dynamically balanced\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eWetted / washdown parts\u003c/th\u003e\u003ctd\u003estainless steel AISI 304L, or 316L in chemically aggressive zones\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eShafting\u003c/th\u003e\u003ctd\u003eASTM A322 alloy steel, quench-and-tempered\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eFasteners\u003c/th\u003e\u003ctd\u003eSAE Gr. 5 / Gr. 8 or ISO 8.8 / 10.9; stainless A2-70 in wet-end\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm stainless grade for wet-end per the process chemistry (chloride exposure drives 304L vs 316L).]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e2. Welding and pressure parts\u003c/h3\u003e\n  \u003cp\u003eWelding of load-bearing and pressure-retaining components is performed to ASME Boiler and Pressure Vessel Code, Section IX,\n    by qualified procedures and welders. Steam-heated dryer cylinders and any pressure vessel within the supply are designed,\n    fabricated, and stamped to ASME BPVC Section VIII, Division 1. Structural welds follow AWS D1.1. Weld inspection extent:\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eStructural welds\u003c/th\u003e\u003ctd\u003e100% visual; magnetic-particle on primary load paths\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003ePressure welds\u003c/th\u003e\u003ctd\u003eradiographic or ultrasonic per ASME VIII acceptance\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003ePost-weld heat treatment\u003c/th\u003e\u003ctd\u003eas required by code and wall thickness\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"int-note\"\u003e[INT: Dryer cylinder design pressure and MAWP drive the code stamp requirement; confirm on the mechanical datasheet.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e3. Fasteners and torque\u003c/h3\u003e\n  \u003cp\u003eBolted joints are torqued to the values on the assembly drawings, developed from the fastener grade, thread, and lubricated\n    condition. Critical joints (bearing housings, coupling hubs, roll journals) are recorded on a torque log at assembly and\n    re-checked during installation.\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eTorque method\u003c/th\u003e\u003ctd\u003ecalibrated wrench; hydraulic tensioning above M36\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eThread condition\u003c/th\u003e\u003ctd\u003elightly oiled unless drawing specifies dry or anti-seize\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eRetention\u003c/th\u003e\u003ctd\u003emechanical (locking plates, safety wire); thread-locker only where specified\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003e4. Alignment and balance tolerances\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eCoupling alignment\u003c/th\u003e\u003ctd\u003e≤ 0.05 mm parallel offset, ≤ 0.05 mm/100 mm angular, cold\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eRoll parallelism\u003c/th\u003e\u003ctd\u003e≤ 0.10 mm over the working face\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eRotating balance\u003c/th\u003e\u003ctd\u003eISO 21940-11 grade G 2.5 for rolls and drive rotors\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eResidual runout\u003c/th\u003e\u003ctd\u003e≤ 25 µm TIR at journals\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eVibration acceptance\u003c/th\u003e\u003ctd\u003eISO 10816 zone A/B at rated speed\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Tighten roll parallelism if the grade/basis-weight target requires; confirm with the paper-machine specialist.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e5. Lubrication\u003c/h3\u003e\n  \u003cp\u003eBearings are grease- or oil-lubricated per the component supplier's schedule. A consolidated lubrication chart listing\n    point, lubricant type, quantity, and interval is furnished with the Equipment. Circulating-oil systems, where supplied,\n    include filtration to ISO 4406 cleanliness class \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e and cooling sized for the\n    \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e ambient.\u003c/p\u003e\n\n  \u003ch3\u003e6. Guarding and safety\u003c/h3\u003e\n  \u003cp\u003eAll rotating and nip points reachable in normal operation are guarded to ANSI B11 and ISO 14120, with interlocked access\n    where guards must open for threading or maintenance. Guards are removable without cutting and are painted per the coatings annex.\u003c/p\u003e\n\n  \u003ch3\u003e7. Piping\u003c/h3\u003e\n  \u003cp\u003eProcess and utility piping within the supply is designed to ASME B31.1 (power/steam) or B31.3 (process) as applicable,\n    with materials, wall thickness, and supports per the piping datasheet. Steam and condensate lines are insulated;\n    hydraulic and lubrication lines are flushed to the specified cleanliness before commissioning.\u003c/p\u003e\n\n  \u003ch3\u003e8. Nameplates\u003c/h3\u003e\n  \u003cp\u003eEach major assembly carries a stainless nameplate with manufacturer, model, serial number, mass, rated speed, and\n    applicable code stamp. Nameplates are mechanically fastened and legible after painting.\n    \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Confirm serial-number and code-stamp traceability requirements match the warranty and any lender/insurer conditions.]\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n","document-library/technical/performance-test-protocol.html":"\u003c!-- TSI Contract Studio · technical annex · performance test protocol · fragment only --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"performance-test-protocol\"\u003e\n  \u003cp\u003eThis annex defines the performance test by which the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e is demonstrated to meet\n    the guaranteed parameters. The test establishes whether \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e has met its performance\n    obligations and is the basis for the performance element of \u003cspan data-term=\"Substantial Completion\"\u003eSubstantial Completion\u003c/span\u003e.\u003c/p\u003e\n\n  \u003ch3\u003e1. Purpose\u003c/h3\u003e\n  \u003cp\u003eTo verify, under representative and stable operating conditions, that the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e\n    achieves the guaranteed throughput, product moisture, and specific energy consumption set out below, measured by agreed\n    methods and instruments.\u003c/p\u003e\n\n  \u003ch3\u003e2. Test conditions\u003c/h3\u003e\n  \u003cp\u003eThe test is run only after \u003cspan data-term=\"Commissioning\"\u003eCommissioning\u003c/span\u003e is complete, on the reference furnish and\n    grade, with feed within the design envelope and all utilities within their supply tolerances. Steady state is held for a\n    stabilization period before data collection.\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eReference product\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e grade, \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e g/m² basis weight\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eStabilization period\u003c/th\u003e\u003ctd\u003e≥ 2 h at steady state before the measured run\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eMeasured run duration\u003c/th\u003e\u003ctd\u003e≥ 4 h continuous\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eFeed / utility limits\u003c/th\u003e\u003ctd\u003ewithin the design datasheet envelope throughout\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eAmbient\u003c/th\u003e\u003ctd\u003erecorded; corrections applied per the correction curves in the datasheet\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm reference grade, basis weight, and run duration with process engineering before first send.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e3. Guaranteed parameters\u003c/h3\u003e\n  \u003cdiv class=\"tbl-wrap\"\u003e\n    \u003ctable class=\"data-table\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\u003cth\u003eParameter\u003c/th\u003e\u003cth class=\"num\"\u003eGuaranteed value\u003c/th\u003e\u003cth class=\"num\"\u003eUnit\u003c/th\u003e\u003cth class=\"num\"\u003eTolerance\u003c/th\u003e\u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003eThroughput (bone-dry)\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003et/h\u003c/td\u003e\u003ctd class=\"num\"\u003e−0% / +n.a.\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eProduct moisture at reel\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e% wt\u003c/td\u003e\u003ctd class=\"num\"\u003e± 0.5 % wt\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eMoisture profile (CD, 2σ)\u003c/td\u003e\u003ctd class=\"num\"\u003e≤ 1.0\u003c/td\u003e\u003ctd class=\"num\"\u003e% wt\u003c/td\u003e\u003ctd class=\"num\"\u003e&mdash;\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eSpecific thermal energy\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003eMJ/kg H₂O\u003c/td\u003e\u003ctd class=\"num\"\u003e+3%\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eSpecific electrical energy\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003ekWh/t\u003c/td\u003e\u003ctd class=\"num\"\u003e+3%\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n  \u003cp\u003e\u003cspan class=\"int-note\"\u003e[INT: Populate guaranteed values from the proposal datasheet; energy guarantees are conditional on utility supply temperatures/pressures being met.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e4. Measurement method and instruments\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003eThroughput from calibrated reel/winder counters cross-checked against the stock flow and consistency measurement.\u003c/li\u003e\n    \u003cli\u003eMoisture from the on-machine scanner, verified against oven-dry laboratory samples (TAPPI T 412) taken during the run.\u003c/li\u003e\n    \u003cli\u003eThermal energy from calibrated steam flow, pressure, and condensate metering; electrical energy from calibrated power metering at the drive lineups.\u003c/li\u003e\n    \u003cli\u003eAll test instruments carry current calibration certificates traceable to a national standard; calibration records are appended to the report.\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003ch3\u003e5. Acceptance criteria\u003c/h3\u003e\n  \u003cp\u003eThe \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e passes when each guaranteed parameter is met within its stated tolerance\n    over the measured run, after agreed corrections for off-reference ambient and utility conditions. Where results are\n    expressed against a guarantee, performance is assessed as the corrected measured value relative to the guaranteed value.\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eFull acceptance\u003c/th\u003e\u003ctd\u003eall guaranteed parameters met within tolerance\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eMinimum performance threshold\u003c/th\u003e\u003ctd\u003e≥ 80% of guaranteed throughput with product within moisture tolerance\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eBelow threshold\u003c/th\u003e\u003ctd\u003enot accepted; Seller to remedy and re-test, subject to Article on liquidated damages / rejection\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: The 80% minimum-performance threshold is the floor below which the Equipment is not accepted; confirm alignment with the liquidated-damages and rejection provisions in the main agreement.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e6. Repeat tests\u003c/h3\u003e\n  \u003cp\u003eIf a test does not achieve full acceptance, \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e may make adjustments and repeat the test.\n    Up to two (2) repeat tests are permitted. A run is disregarded and does not count against this limit where it is invalidated\n    by a cause outside \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e's scope &mdash; including feed, furnish, or utility supply\n    provided by \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e that falls outside the design envelope, or an upstream or downstream\n    process constraint that prevents the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e from running at its rated point (the\n    \"upstream/downstream carve-out\"). Buyer shall afford reasonable production time and the reference furnish for each repeat test.\n    \u003cspan class=\"atty-note note-block\"\u003e[ATTY: The upstream/downstream carve-out shifts risk of Buyer-side process limits to Buyer; confirm the boundary of Seller's scope on the P&amp;ID so the carve-out is not open-ended.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e7. Reporting\u003c/h3\u003e\n  \u003cp\u003eA performance test report is issued within ten (10) business days of the run, stating the measured and corrected values\n    against each guarantee, the instruments and calibration used, the raw data, and the pass/fail determination. The report,\n    once accepted by both parties, is the record of performance for \u003cspan data-term=\"Substantial Completion\"\u003eSubstantial Completion\u003c/span\u003e.\u003c/p\u003e\n\u003c/div\u003e\n","document-library/technical/responsibility-matrix-blank.html":"\u003c!-- TSI Contract Studio · technical annex · responsibility (RACI-style) matrix, blank · fragment only --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"responsibility-matrix-blank\"\u003e\n  \u003cp\u003eThis annex allocates responsibility for each project activity between \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e,\n    \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e, and any third party. It is issued blank for completion during contract finalization\n    and, once agreed, governs the scope split read alongside the installation and pre-commissioning annex. Enter the applicable\n    code in each cell; leave a cell blank where the party has no role in that activity.\u003c/p\u003e\n\n  \u003ch3\u003e1. Legend\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eS\u003c/th\u003e\u003ctd\u003eSupply &mdash; furnishes the equipment, materials, or documentation\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eI\u003c/th\u003e\u003ctd\u003eInstall &mdash; performs or directly executes the physical work\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eW\u003c/th\u003e\u003ctd\u003eWitness &mdash; attends, inspects, or approves\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003e(blank)\u003c/th\u003e\u003ctd\u003eno role in this activity\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003e\u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Complete every cell during finalization; the responsibility matrix controls where this annex and the scope narrative disagree — confirm which prevails in the order-of-precedence clause.]\u003c/span\u003e\u003c/p\u003e\n\n  \u003ch3\u003e2. Responsibility matrix\u003c/h3\u003e\n  \u003cdiv class=\"tbl-wrap\"\u003e\n    \u003ctable class=\"data-table\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003eActivity\u003c/th\u003e\n          \u003cth class=\"num\"\u003eSeller\u003c/th\u003e\n          \u003cth class=\"num\"\u003eBuyer\u003c/th\u003e\n          \u003cth class=\"num\"\u003eThird party\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003eEngineering and design\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eDelivery to Site\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eMechanical installation\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr ng unwind stand, slitting section, and rider roll.\u003c/li\u003e\n    \u003cli\u003eDrive and control package for the rewinder.\u003c/li\u003e\n    \u003cli\u003eRecommended commissioning spares.\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003ch3\u003eServices\u003c/h3\u003e\n  \u003cul\u003e\n    \u003cli\u003eEngineering and general arrangement drawings.\u003c/li\u003e\n    \u003cli\u003eSupervision of installation (installation labor by Buyer).\u003c/li\u003e\n    \u003cli\u003eCommissioning support, performance testing, and operator training at the Site.\u003c/li\u003e\n    \u003cli\u003eOperation and maintenance manuals before Commissioning.\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003ch3\u003eDelivery\u003c/h3\u003e\n  \u003cp\u003eCIP Hải Phòng (Incoterms 2020). \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e handles import clearance, civil works,\n    foundations, and utility connections to the equipment terminal points.\n    \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: confirm the delivery term and named port with the PM.]\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n","projects/anphat-tissue-2025/project.json":"{\n  \"id\": \"anphat-tissue-2025\",\n  \"name\": \"An Phát Tissue Line Rewinder\",\n  \"buyer\": \"An Phát Paper JSC\",\n  \"buyerAddress\": \"Hưng Yên, Vietnam\",\n  \"buyerNotices\": \"An Phát Paper JSC, Hưng Yên Industrial Zone, Hưng Yên, Vietnam\",\n  \"site\": \"Hưng Yên, Vietnam\",\n  \"sellerNotice\": \"Vancouver, Washington, USA\",\n  \"contractPrice\": 685000,\n  \"effectiveDate\": \"2025-03-01\",\n  \"warrantyPeriod\": \"12 months from Commissioning completion\",\n  \"governingLaw\": \"Washington\",\n  \"delayLDGracePeriod\": 2,\n  \"delayLDRate\": 1,\n  \"delayLDCap\": 10,\n  \"performanceLDCap\": 10,\n  \"aggregateLDCap\": 15,\n  \"minPerformanceThreshold\": 80,\n  \"changeOrderMarkup\": 20,\n  \"terminationFeePercent\": 20,\n  \"format\": \"lite\",\n  \"stance\": \"balanced\",\n  \"status\": \"In Review\",\n  \"creat E: Replace target dates once the baseline schedule is agreed at kickoff.\n    The week offsets above are the contractual reference; the Gantt detail is maintained separately by the PM.]\u003c/p\u003e\n\u003c/div\u003e\n","projects/berneck-dryer-2025/annexes/scope-summary.html":"\u003c!-- TSI Contract Studio · PROJECT ANNEX · Berneck Dryer Island Rebuild\n     Annex A · Scope of work summary. Project-specific content. --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"berneck-scope-summary\"\u003e\n  \u003cp\u003eThis Annex A summarizes the scope of the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e and services\n    \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e supplies for the dryer island rebuild at the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e.\n    It governs the scope inclusions referenced on the cover sheet.\u003c/p\u003e\n\n  \u003ch3\u003eEquipment supply\u003c/h3\u003e\n  \u003cdiv class=\"tbl-wrap\"\u003e\n    \u003ctable class=\"data-table\"\u003e\n      \u003cthead\u003e\u003ctr\u003e\u003cth\u003eItem\u003c/th\u003e\u003cth\u003eDescription\u003c/th\u003e\u003cth class=\"num\"\u003eQty\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003eDryer section\u003c/td\u003e\u003ctd\u003eMulti-cylinder dryer section rebuild, including new dryer cylinders, bearings, and drives\u003c/td\u003e\u003ctd class=\"num\"\u003e1 lot\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eSteam &amp; condensate\u003c/td\u003e\u003ctd\u003eSteam and condensate system for the dryer section, including syphons and separators\u003c/td\u003e\u003ctd class=\"num\"\u003e1 lot\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eDrive system\u003c/td\u003e\u003ctd\u003eSectional drives, motors, and VFDs per Annex O (electrical standards)\u003c/td\u003e\u003ctd class=\"num\"\u003e1 lot\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eControls\u003c/td\u003e\u003ctd\u003eDryer control system and HMI integration per Annex Q (controls standards)\u003c/td\u003e\u003ctd class=\"num\"\u003e1 lot\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eSpares\u003c/td\u003e\u003ctd\u003eRecommended commissioning and operating spares (Article 11)\u003c/td\u003e\u003ctd class=\"num\"\u003e1 lot\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003ch3\u003eServices\u003c/h3\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eEngineering.\u003c/span\u003e Detailed engineering, general arrangement drawings, and interface\n      definition with the existing machine.\u003c/li\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSupervision.\u003c/span\u003e Supervision of mechanical, electrical, and controls installation\n      performed by Buyer's installation contractor (installation labor is by Buyer — see Annex I).\u003c/li\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCommissioning.\u003c/span\u003e Commissioning and start-up support per Article 5 and Annex I.\u003c/li\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003ePerformance testing.\u003c/span\u003e Performance testing per Article 6 and Annex F.\u003c/li\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eTraining.\u003c/span\u003e Operator and maintenance training at the Site.\u003c/li\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eDocumentation.\u003c/span\u003e O&amp;M manuals delivered prior to \u003cspan data-term=\"Commissioning\"\u003eCommissioning\u003c/span\u003e.\u003c/li\u003e\n  \u003c/ol\u003e\n\n  \u003ch3\u003eExclusions\u003c/h3\u003e\n  \u003cp\u003eCivil works, foundations, installation labor, utility supply to the equipment terminal points, and demolition of\n    removed equipment are by Buyer unless added by executed Change Order.\n    \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm the demolition and disposal boundary with the PM before first send.]\u003c/span\u003e\u003c/p\u003e\n\u003c/div\u003e\n","projects/berneck-dryer-2025/overrides/limitation-of-liability.html":"\u003c!-- TSI Contract Studio · PROJECT OVERRIDE · Berneck Dryer Island Rebuild\n     Article 14 · Limitation of liability · modified from standard v1.2.\n     Reviewer checks reset when a stub is modified in a project. The Stub\n     manager / Assembly modified flag diffs this against the library version. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"limitation-of-liability\" data-stub-version=\"1.2\" data-modified=\"true\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWaiver of consequential damages.\u003c/span\u003e Neither \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e nor\n      \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e is liable to the other for indirect, incidental, special, punitive, or\n      consequential damages, including loss of profit, loss of revenue, loss of use, cost of capital, cost of replacement\n      power, or loss of production, whether the claim sounds in contract, tort, strict liability, or otherwise, even if\n      advised of the possibility of such damages. This waiver is mutual and applies regardless of the failure of any\n      exclusive remedy.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eAggregate liability cap.\u003c/span\u003e The total aggregate liability of Seller arising out of or\n      relating to this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e shall not exceed an amount equal to the\n      \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e. The cap applies in the aggregate across all claims and is not\n      per-occurrence.\n      \u003cspan class=\"int-note note-block\"\u003e[INT: Berneck negotiated the cap up to 100% of the Contract Price; the reduced\n        15% tier from standard v1.2 is removed for this deal. Confirmed with Commercial on 2025-01-11.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCarve-outs from the cap.\u003c/span\u003e The cap in clause 2 does not apply to liability for\n      (a) Seller's gross negligence or willful misconduct, (b) the third-party\n      \u003cspan data-term=\"Intellectual Property\"\u003eIntellectual Property\u003c/span\u003e infringement indemnity, (c) breach of the\n      obligations governing \u003cspan data-term=\"Confidential Information\"\u003eConfidential Information\u003c/span\u003e, (d) liability for\n      bodily injury, death, or damage to third-party tangible property, which is uncapped for this Agreement, or\n      (e) a party's payment obligations that are due and undisputed.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Carve-out (d) is UNCAPPED in this project version (Buyer requirement),\n        departing from the insurance-proceeds limit in standard v1.2. Confirm Seller's insurance tower in Annex N is\n        sufficient before signature.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eApplication of the waiver to carve-outs.\u003c/span\u003e The waiver of consequential damages in\n      clause 1 applies notwithstanding the carve-outs in clause 3, except that it does not limit indemnified third-party\n      damages that the indemnifying party is otherwise obligated to pay under the Article on indemnification.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eExclusive remedies.\u003c/span\u003e The remedies stated in this Agreement, including the warranty\n      remedies in the Article on warranties and the liquidated damages for delay and performance shortfall, are the\n      exclusive remedies for the matters they address, in lieu of all other remedies at law or in equity.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eLiquidated damages within the cap.\u003c/span\u003e Liquidated damages payable under this Agreement\n      count toward, and are not additional to, the aggregate cap in clause 2, unless the Article imposing them states\n      otherwise.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBasis of the bargain.\u003c/span\u003e The parties acknowledge that the\n      \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e reflects the allocation of risk in this Article and that these\n      limitations would apply even if a limited remedy is found to have failed of its essential purpose.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSurvival.\u003c/span\u003e This Article survives termination, expiration, or completion of the\n      Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","projects/berneck-dryer-2025/project.json":"{\n  \"id\": \"berneck-dryer-2025\",\n  \"name\": \"Berneck Dryer Island Rebuild\",\n  \"buyer\": \"Berneck S.A.\",\n  \"buyerAddress\": \"Araucária, Paraná, Brazil\",\n  \"buyerNotices\": \"Legal Department, Berneck S.A., Araucária, Paraná, Brazil\",\n  \"site\": \"Araucária, Brazil\",\n  \"sellerNotice\": \"Vancouver, Washington, USA\",\n  \"contractPrice\": 1815850,\n  \"effectiveDate\": \"2025-01-01\",\n  \"warrantyPeriod\": \"12 months from Commissioning completion\",\n  \"governingLaw\": \"Washington\",\n  \"delayLDGracePeriod\": 2,\n  \"delayLDRate\": 1,\n  \"delayLDCap\": 10,\n  \"performanceLDCap\": 10,\n  \"aggregateLDCap\": 15,\n  \"minPerformanceThreshold\": 80,\n  \"changeOrderMarkup\": 20,\n  \"terminationFeePercent\": 20,\n  \"status\": \"In Review\",\n  \"createdAt\": \"2025-01-01T00:00:00Z\",\n  \"lastModified\": \"2025-01-12T00:00:00Z\",\n  \"sections\": [\n    { \"id\": \"cover\",      \"name\": \"Cover sheet\",                          \"reviewer\": \"JT\",              \"status\": \"done\",        \"complete "index.html": function(){

    document.getElementById('themeBtn').addEventListener('click', TSI.toggleTheme);

    async function load() {
      TSI.initChrome();
      let stubReg, docReg, projIndex;
      try {
        [stubReg, docReg, projIndex] = await Promise.all([
          TSI.readJSON('config/stub-registry.json'),
          TSI.readJSON('config/doc-library-registry.json'),
          TSI.readJSON('projects/index.json')
        ]);
      } catch (e) {
        document.getElementById('projectsBody').innerHTML =
          '<tr><td colspan="8"><div class="banner banner-error">Could not read data files: ' + TSI.escapeHTML(e.message) + '</div></td></tr>';
        return;
      }

      // Stub KPIs
      document.getElementById('kpiStubs').textContent = stubReg.stubs.length;
      const stubsPending = stubReg.stubs.filter(function (s) {
        return !s.reviewers || !s.reviewers.attorney || !s.reviewers.attorney.done || !s.reviewers.jt || !s.reviewers.jt.done;
      }).length;
      document.getElementById('kpiStubsPending').textContent = stubsPending;
      document.getElementById('kpiDocs').textContent = docReg.documents.length;

      // Projects
      const projects = await Promise.all(projIndex.projects.map(function (p) {
        return TSI.readJSON(p.path).catch(function () { return null; });
      }));
      const live = projects.filter(Boolean);
      document.getElementById('kpiProjects').textContent = live.length;

      let readyCount = 0;
      const rows = live.map(function (p) {
        const all = (p.sections || []).concat(p.annexes || []);
        const done = all.filter(function (s) { return s.status === 'done'; }).length;
        const pct = TSI.pct(done, all.length);
        const ready = done === all.length && all.length > 0;
        if (ready) readyCount++;
        return '<tr>' +
          '<td class="cell-primary"><a href="tracker.html?project=' + encodeURIComponent(p.id) + '">' + TSI.escapeHTML(p.name) + '</a></td>' +
          '<td>' + TSI.escapeHTML(p.buyer || '—') + '</td>' +
          '<td class="num">' + TSI.fmtMoney(p.contractPrice) + '</td>' +
          '<td><span class="badge badge-' + (p.status === 'In Review' ? 'warning' : 'info') + '">' + TSI.escapeHTML(p.status || '—') + '</span></td>' +
          '<td class="num">' + done + ' / ' + all.length + '</td>' +
          '<td><div class="progress"><div class="progress-fill' + (ready ? ' full' : '') + '" style="width:' + pct + '%"></div></div></td>' +
          '<td>' + (ready ? '<span class="rstatus rstatus-done">Yes</span>' : '<span class="rstatus rstatus-pending">No</span>') + '</td>' +
          '<td class="cell-muted">' + TSI.fmtDate(p.lastModified) + '</td>' +
        '</tr>';
      }).join('');
      document.getElementById('projectsBody').innerHTML = rows || '<tr><td colspan="8"><div class="empty-state">No projects yet. Create one to get started.</div></td></tr>';
      document.getElementById('kpiReady').textContent = readyCount;
    }
    load();
  
},
