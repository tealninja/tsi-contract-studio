s are listed in project-lifecycle order; in conflict, the\n      earlier letter governs.\u003c/p\u003e\n    \u003cdiv class=\"annex-body-slot\"\u003e\u003c!-- filled by assembly: one .article per project annex, each with an annex-slot --\u003e\u003c/div\u003e\n  \u003c/section\u003e\n\n\u003c/article\u003e\n","stubs/anti-corruption.html":"\u003c!-- TSI Contract Studio · stub · Compliance with laws & anti-corruption · v1.0\n     Reusable legal stub. Fragment only — the article number and title are\n     supplied by the master agreement slot. Internal markup (.atty-note,\n     .draft-note, .int-note, .open-issue) is stripped on clean export. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"anti-corruption\" data-stub-version=\"1.0\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eGeneral compliance.\u003c/span\u003e Each of \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and\n      \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e shall comply with the laws and regulations applicable to its performance of this\n      \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, including those governing labor, health and safety, the environment,\n      and trade.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eAnti-bribery and FCPA.\u003c/span\u003e Neither party, nor anyone acting on its behalf, shall offer,\n      promise, give, request, or accept any bribe, kickback, or other improper advantage to obtain or retain business or\n      any improper benefit in connection with this Agreement. Each party shall comply with the U.S. Foreign Corrupt\n      Practices Act (FCPA) and with any other applicable anti-corruption law, including the local law of the\n      \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo improper payments to officials.\u003c/span\u003e Neither party shall make or authorize any payment\n      or transfer of value to a government official, political party, or candidate to influence an official act or decision,\n      or to secure any improper advantage relating to the\n      \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e or its permitting, clearance, or acceptance.\n      \u003cspan class=\"int-note\"\u003e[INT: Where local agents or customs brokers are engaged, add a flow-down and a facilitation-\n        payment prohibition; confirm the project uses no third-party intermediaries before relying on this baseline.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSanctions and OFAC.\u003c/span\u003e Each party represents that it, its owners of 50 percent or more,\n      and its personnel performing under this Agreement are not the target of sanctions administered by the U.S. Office of\n      Foreign Assets Control (OFAC), the United Nations, the European Union, or the United Kingdom, and shall not use, sell,\n      or divert the Equipment in violation of those sanctions.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Update the sanctions-authority list to the destinations in scope; add any\n        project-country regime before first send.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eExport controls.\u003c/span\u003e The Equipment, and any related technology, software, or technical\n      data, may be subject to export control laws, including the U.S. Export Administration Regulations. The party acting as\n      exporter shall obtain the required licenses and classifications, and neither party shall export, re-export, or\n      transfer the Equipment or related data contrary to those laws.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Confirm the ECCN and licensing responsibility split in Annex D and align\n        with the delivery and Incoterms allocation; the party of record as exporter carries the licensing duty here.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBooks and audit.\u003c/span\u003e Each party shall keep accurate books and records relating to its\n      performance and payments under this Agreement for the period required by applicable law and not less than five years.\n      On reasonable notice, a party may audit the other's relevant records to verify compliance with this Article, subject\n      to reasonable confidentiality protections.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNotice and cooperation.\u003c/span\u003e A party that learns of a violation or credible allegation of\n      a violation of this Article in connection with the Agreement shall promptly notify the other party and provide\n      reasonable cooperation in any resulting investigation.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eTermination for breach.\u003c/span\u003e A material breach of this Article by a party entitles the\n      other party to terminate this Agreement on written notice, without prejudice to its other rights and remedies. Neither\n      party is required to take any action under this Agreement that it reasonably believes would violate an applicable\n      anti-corruption, sanctions, or export control law.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/confidentiality.html":"\u003c!-- TSI Contract Studio · stub · Confidentiality · v1.0\n     Reusable legal stub. Fragment only — the article number and title are\n     supplied by the master agreement slot. Internal markup (.atty-note,\n     .draft-note, .int-note, .open-issue) is stripped on clean export. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"confidentiality\" data-stub-version=\"1.0\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eDefinition.\u003c/span\u003e \u003cspan data-term=\"Confidential Information\"\u003eConfidential\n      Information\u003c/span\u003e means non-public information disclosed by one party (the disclosing party) to the other (the\n      receiving party) under this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, whether disclosed in writing, orally, or by\n      inspection, that is marked confidential or that a reasonable person would understand to be confidential from its\n      nature or the circumstances of disclosure. It includes designs, drawings, pricing, and the technical documentation\n      for the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eObligations.\u003c/span\u003e The receiving party shall use Confidential Information only to perform\n      or exercise its rights under this Agreement, shall protect it with at least the degree of care it uses for its own\n      confidential information of like importance and no less than reasonable care, and shall disclose it only to its\n      employees, affiliates, and advisors who need it for that purpose and are bound by confidentiality obligations no less\n      protective than these.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eExclusions.\u003c/span\u003e Confidential Information does not include information that (a) is or\n      becomes public other than through the receiving party's breach, (b) was rightfully known to the receiving party\n      without obligation of confidence before disclosure, (c) is rightfully received from a third party without obligation\n      of confidence, or (d) is independently developed by the receiving party without use of the Confidential\n      Information.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCompelled disclosure.\u003c/span\u003e The receiving party may disclose Confidential Information to\n      the extent required by law or court or regulatory order, provided that, where lawful, it gives the disclosing party\n      prompt notice and reasonable cooperation to seek protective treatment, and discloses only the portion required.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm whether the parties want a securities-disclosure carve-out for a listed\n        \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e; add if applicable.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eTerm and survival.\u003c/span\u003e The obligations in this Article continue for five years after\n      termination or expiration of the Agreement, except that Confidential Information that is a trade secret remains\n      protected for as long as it qualifies as a trade secret under applicable law.\n      \u003cspan class=\"int-note\"\u003e[INT: Five-year tail is the house default; align with the confidentiality carve-out in the\n        limitation-of-liability stub, which lifts the cap for breach of this Article.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eReturn or destruction.\u003c/span\u003e On the disclosing party's written request or on termination\n      of the Agreement, the receiving party shall return or destroy the Confidential Information in its possession and, on\n      request, certify the destruction. The receiving party may retain one archival copy solely to evidence compliance and\n      copies held in routine backup, in each case subject to the continuing obligations of this Article.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eInjunctive relief.\u003c/span\u003e The parties agree that a breach of this Article may cause harm\n      for which monetary damages are inadequate, and that the disclosing party is entitled to seek injunctive relief in\n      addition to any other remedy, without the need to post a bond where permitted by law.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Confirm the no-bond phrasing is enforceable in the governing-law\n        jurisdiction selected in the governing-law article; some courts require a nominal bond regardless of\n        stipulation.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo license.\u003c/span\u003e Disclosure of Confidential Information does not grant the receiving\n      party any license or ownership in the disclosing party's\n      \u003cspan data-term=\"Intellectual Property\"\u003eIntellectual Property\u003c/span\u003e, which is governed by the Article on IP ownership\n      and license.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/dispute-resolution.html":"\u003c!-- TSI Contract Studio · stub · Dispute resolution · v1.0\n     Reusable legal stub. Fragment only — the article number and title are\n     supplied by the master agreement slot. Internal markup (.atty-note,\n     .draft-note, .int-note, .open-issue) is stripped on clean export. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"dispute-resolution\" data-stub-version=\"1.0\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eScope.\u003c/span\u003e This Article governs any dispute, claim, or controversy arising out of or\n      relating to this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, including its formation, interpretation, breach, or\n      termination, between \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eGood-faith negotiation.\u003c/span\u003e Before commencing any formal proceeding, the party raising a\n      dispute shall give written notice describing it. The parties' project representatives shall then attempt to resolve\n      the dispute in good faith within 15 days of the notice.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eEscalation.\u003c/span\u003e If the representatives do not resolve the dispute within that period,\n      each party shall refer it to a senior executive with authority to settle, and those executives shall confer within a\n      further 15 days. Neither party may commence arbitration or litigation until the escalation period has expired, except\n      to seek the interim relief permitted in clause 6.\n      \u003cspan class=\"int-note\"\u003e[INT: The two-tier 15+15 day ladder is the house default; shorten for fast-track supply\n        scopes where a stalled dispute would hold up \u003cspan data-term=\"Commissioning\"\u003eCommissioning\u003c/span\u003e.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBinding resolution.\u003c/span\u003e A dispute not resolved through negotiation and escalation shall\n      be finally resolved as provided in this clause.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Select ONE forum and delete the other before sending.\n        Option A — arbitration: The dispute shall be finally resolved by binding arbitration administered by the\n        International Chamber of Commerce under its Rules of Arbitration, by three arbitrators where the amount in dispute\n        exceeds 5,000,000 USD and otherwise by a sole arbitrator, with the seat at [SEAT / CITY] and the language of the\n        arbitration in English. The award is final and enforceable in any court of competent jurisdiction.\n        Option B — litigation: The dispute shall be resolved exclusively in the state or federal courts located in\n        [COUNTY, STATE], and each party consents to the personal jurisdiction and venue of those courts and waives any\n        objection based on inconvenient forum.]\u003c/span\u003e\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Forum choice must reconcile with the governing-law article. Where the\n        \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e is outside the United States, arbitration under the New York Convention is\n        usually preferred for enforceability; confirm seat neutrality with the client.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eInterim relief.\u003c/span\u003e Either party may apply to a court of competent jurisdiction, or to\n      the arbitral tribunal once constituted, for interim or conservatory relief, including injunctive relief to protect\n      \u003cspan data-term=\"Confidential Information\"\u003eConfidential Information\u003c/span\u003e or\n      \u003cspan data-term=\"Intellectual Property\"\u003eIntellectual Property\u003c/span\u003e, without waiving this Article or the chosen\n      forum.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eContinued performance.\u003c/span\u003e During any dispute, each party shall continue to perform its\n      obligations under this Agreement to the extent not directly in dispute, and Buyer shall continue to pay undisputed\n      amounts when due.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCosts.\u003c/span\u003e Each party bears its own costs of the negotiation and escalation stages. In\n      any arbitration or litigation, the tribunal or court may allocate the costs of the proceeding, including reasonable\n      attorneys' fees, in accordance with the applicable rules or law.\n      \u003cspan class=\"open-issue note-block\"\u003e[OPEN: Confirm whether the parties want a \"prevailing party recovers fees\" rule\n        or each-side-bears-own for the formal stage. Left to the tribunal's discretion in this draft.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSurvival.\u003c/span\u003e This Article survives termination, expiration, or completion of the\n      Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/force-majeure.html":"\u003c!-- TSI Contract Studio · stub · Force majeure · v1.0\n     Reusable legal stub. Fragment only — the article number and title are\n     supplied by the master agreement slot. Internal markup (.atty-note,\n     .draft-note, .int-note, .open-issue) is stripped on clean export. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"force-majeure\" data-stub-version=\"1.0\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eDefinition.\u003c/span\u003e \u003cspan data-term=\"Force Majeure\"\u003eForce Majeure\u003c/span\u003e means an event or\n      circumstance beyond the reasonable control of the affected party that it could not have avoided or overcome by the\n      exercise of reasonable diligence, including acts of God, war, terrorism, civil unrest, epidemic, fire, flood,\n      earthquake, severe weather, embargo, strike or labor dispute not specific to the affected party's workforce, and act\n      of a governmental authority. Force Majeure does not include a party's inability to pay, changes in market or\n      financial conditions, or the failure of a subcontractor except where that failure is itself caused by an event of\n      Force Majeure.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eRelief.\u003c/span\u003e Neither \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e nor\n      \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e is in breach of this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e to the extent\n      its performance, other than an obligation to pay money then due, is prevented or delayed by Force Majeure. The\n      affected party's obligations are suspended for the duration of the event and to the extent of the prevention or\n      delay.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNotice.\u003c/span\u003e The affected party shall give written notice to the other party within seven\n      days of becoming aware of the event, describing the event, the obligations affected, and the anticipated duration,\n      and shall give a further notice when the event ends.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm the 7-day notice window against the project's reporting cadence; some\n        owners require 48 hours for site-affecting events.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eMitigation.\u003c/span\u003e The affected party shall use reasonable efforts to mitigate the effect\n      of the event, to continue performance of unaffected obligations, and to resume affected performance as soon as\n      reasonably practicable. It shall keep the other party informed of the steps taken.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eEffect on schedule and liquidated damages.\u003c/span\u003e Where Force Majeure delays a milestone,\n      the affected dates, including the dates for \u003cspan data-term=\"Commissioning\"\u003eCommissioning\u003c/span\u003e and\n      \u003cspan data-term=\"Substantial Completion\"\u003eSubstantial Completion\u003c/span\u003e, are extended by the period of delay, and no\n      liquidated damages (LD) accrue for delay attributable to the event. An extension of time is the affected party's sole\n      remedy for Force Majeure; neither party owes the other compensation for costs caused by the event.\n      \u003cspan class=\"int-note\"\u003e[INT: This is a time-only relief clause — no cost recovery either way. Flag if the commercial\n        team expects Seller standby costs to be reimbursable.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eProlonged Force Majeure.\u003c/span\u003e If an event of Force Majeure continues for more than 120\n      consecutive days, or for more than 180 days in the aggregate, either party may terminate this Agreement on written\n      notice. On termination under this clause, Buyer shall pay Seller for\n      \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e delivered and work performed up to the date of termination, together\n      with the reasonable, documented cost of demobilization, without any further liability of either party.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Confirm the termination-payment basis reconciles with the payment\n        milestones and the termination-for-convenience article so Seller is neither double-paid nor left short on\n        long-lead items.]\u003c/span\u003e\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/governing-law.html":"\u003c!-- TSI Contract Studio · stub · Governing law · v1.0\n     Reusable legal stub. Fragment only — the article number and title are\n     supplied by the master agreement slot. Internal markup (.atty-note,\n     .draft-note, .int-note, .open-issue) is stripped on clean export. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"governing-law\" data-stub-version=\"1.0\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eGoverning law.\u003c/span\u003e This \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, and any dispute\n      arising out of or relating to it, is governed by and construed under the laws of the State of Washington, without\n      regard to its conflict-of-laws rules.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Washington is the house default. Override to the project state where the\n        \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e is located or where the client requires; confirm the substituted state's law is\n        neutral to both \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eVenue.\u003c/span\u003e Subject to the Article on dispute resolution, the state and federal courts\n      located in King County, Washington have jurisdiction over any matter not referred to arbitration, and each party\n      consents to that venue and waives any objection based on inconvenient forum.\n      \u003cspan class=\"int-note\"\u003e[INT: Keep this venue consistent with the litigation option in the dispute-resolution stub; if\n        arbitration is selected there, this clause governs only interim relief and enforcement.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eExclusion of the CISG.\u003c/span\u003e The United Nations Convention on Contracts for the\n      International Sale of Goods (UN CISG) does not apply to this Agreement or to any sale of the\n      \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e under it.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: The CISG exclusion is intentional for cross-border supply. Confirm it is\n        retained wherever the governing law is that of a U.S. state, since the CISG would otherwise apply by default to an\n        international sale of goods.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eLanguage.\u003c/span\u003e This Agreement is executed in English. English is the controlling language\n      for interpretation and for all notices, and any translation is provided for convenience only.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSeverability.\u003c/span\u003e If a provision of this Agreement is held invalid or unenforceable\n      under the governing law, that provision is modified to the minimum extent necessary to make it enforceable, or if it\n      cannot be so modified, it is severed, and the remaining provisions continue in full force.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo waiver.\u003c/span\u003e A party's failure or delay in exercising a right under this Agreement is\n      not a waiver of that right, and a single or partial exercise does not preclude any further exercise.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eEntire agreement.\u003c/span\u003e This Agreement, together with its annexes, is the entire agreement\n      between the parties on its subject matter and supersedes all prior proposals and understandings. It may be amended\n      only by a writing signed by both parties.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm the annex list is complete and the order-of-precedence clause in the\n        general conditions is consistent with this integration clause before execution.]\u003c/span\u003e\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/indemnification.html":"\u003c!-- TSI Contract Studio · stub · Indemnification · v1.0\n     Reusable legal stub. Fragment only — the article number and title are\n     supplied by the master agreement slot. Internal markup (.atty-note,\n     .draft-note, .int-note, .open-issue) is stripped on clean export. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"indemnification\" data-stub-version=\"1.0\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eMutual indemnity.\u003c/span\u003e Each party (the indemnifying party) shall indemnify, defend, and\n      hold harmless the other party, its affiliates, and their respective officers, employees, and agents from and against\n      third-party claims, damages, losses, and reasonable expenses (including reasonable attorneys' fees) to the extent\n      arising out of the indemnifying party's negligence, willful misconduct, or breach of this\n      \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003ePersonal injury and property damage.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e shall\n      indemnify \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e against claims for bodily injury, death, or damage to tangible property\n      to the extent caused by the acts or omissions of Seller or its subcontractors at the\n      \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e. Buyer shall indemnify Seller on the same basis for the acts or omissions of Buyer\n      or its other contractors. Where injury or damage is caused by the fault of both parties, each bears the indemnity in\n      proportion to its share of fault.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eThird-party IP infringement.\u003c/span\u003e Seller shall indemnify Buyer against claims that the\n      \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e as furnished infringes a third party's patent, copyright, or trade\n      secret, and shall pay the damages and costs finally awarded, provided Buyer meets the procedure in clause 5. If use\n      of the Equipment is enjoined, Seller shall, at its option and expense, procure the right to continue use, modify the\n      Equipment to be non-infringing while preserving its function, or refund the portion of the\n      \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e allocable to the affected Equipment less reasonable\n      depreciation.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eIP carve-outs.\u003c/span\u003e Seller's obligation in clause 3 does not apply to infringement\n      arising from Buyer's designs or specifications, from modification of the Equipment by anyone other than Seller, from\n      combination of the Equipment with items not supplied by Seller where the claim arises from the combination, or from\n      Buyer's use of the Equipment outside the operating parameters in Annex&nbsp;D.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Confirm the Buyer-specification carve-out aligns with the scope split in\n        Article 4. Where Buyer furnishes process design, Seller should not indemnify for infringement inherent in that\n        design.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eProcedure and notice.\u003c/span\u003e The indemnified party shall give prompt written notice of any\n      claim, shall not settle or admit liability without the indemnifying party's prior written consent, and shall grant\n      the indemnifying party control of the defense and reasonable cooperation at the indemnifying party's expense. Failure\n      to give prompt notice relieves the indemnifying party only to the extent it is actually prejudiced by the delay.\n      \u003cspan class=\"int-note\"\u003e[INT: Control-of-defense language is standard; watch for insurer consent conditions that\n        conflict with clause 5 once the insurance stub is finalized.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eRelationship to liability limits.\u003c/span\u003e The indemnities in this Article are subject to the\n      limitations and exclusions in the Article on limitation of liability, except where that Article expressly carves out\n      indemnity obligations.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Verify which indemnities sit above the liability cap once\n        limitation-of-liability v1.2 is slotted; IP indemnity is carved out there.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSurvival.\u003c/span\u003e This Article survives termination, expiration, or completion of the\n      Agreement with respect to any claim arising from acts or omissions occurring before that event.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/insurance.html":"\u003c!-- TSI Contract Studio · stub · Insurance · v1.0\n     Reusable legal stub. Fragment only — the article number and title are\n     supplied by the master agreement slot. Internal markup (.atty-note,\n     .draft-note, .int-note, .open-issue) is stripped on clean export. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"insurance\" data-stub-version=\"1.0\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eObligation to insure.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e shall, at its own\n      expense, carry and maintain the insurance set out in this Article with insurers rated A− VII or better by AM Best,\n      from the effective date of this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e through\n      \u003cspan data-term=\"Substantial Completion\"\u003eSubstantial Completion\u003c/span\u003e and for any tail period stated below. The\n      coverages and limits in Annex&nbsp;N control where they exceed those stated here.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCommercial general liability.\u003c/span\u003e Commercial general liability (CGL) on an occurrence\n      basis, covering bodily injury, property damage, products and completed operations, and contractual liability, with a\n      limit of not less than 2,000,000 USD per occurrence and 4,000,000 USD aggregate.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWorkers compensation and employers liability.\u003c/span\u003e Workers compensation at statutory\n      limits for the jurisdiction of the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e, and employers liability of not less than\n      1,000,000 USD each accident, each employee, and policy limit.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eAutomobile liability.\u003c/span\u003e Business automobile liability covering owned, hired, and\n      non-owned vehicles used in performance, with a combined single limit of not less than 1,000,000 USD per accident.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eProfessional and umbrella.\u003c/span\u003e Where Seller performs design or engineering, professional\n      liability (errors and omissions, E&amp;O) of not less than 2,000,000 USD per claim and in the aggregate, maintained\n      for two years after Substantial Completion. Seller shall also carry umbrella or excess liability of not less than\n      5,000,000 USD, sitting over the CGL, employers liability, and automobile layers.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: For projects above 10,000,000 USD Contract Price, consider raising the umbrella\n        layer to a limit equal to \u003cspan data-calc-pct=\"25\" data-calc-label=\"suggested umbrella layer\"\u003e25%\u003c/span\u003e of the\n        \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e and confirm against Annex N.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eAdditional insured and primary coverage.\u003c/span\u003e \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e and\n      its affiliates shall be named additional insureds on the CGL, automobile, and umbrella policies with respect to\n      liability arising from Seller's performance. Seller's insurance is primary and non-contributory to any insurance\n      carried by Buyer.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWaiver of subrogation.\u003c/span\u003e Each party waives, and shall cause its insurers to waive, all\n      rights of subrogation against the other party for loss covered by the policies required under this Article, to the\n      extent of that coverage.\n      \u003cspan class=\"int-note\"\u003e[INT: Mutual waiver assumes Buyer carries builder's risk / property on the\n        \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e at Site; confirm the risk-of-loss allocation in the delivery\n        article.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCertificates and notice.\u003c/span\u003e Seller shall deliver certificates of insurance evidencing\n      the required coverage before commencing work and on each renewal, and shall provide 30 days' written notice of\n      cancellation or material reduction (10 days for non-payment of premium). A certificate does not amend, extend, or\n      waive the coverage the policy actually provides.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Certificates evidence but do not guarantee coverage. For high-value scopes,\n        require endorsement copies for additional-insured and waiver-of-subrogation status rather than relying on the\n        certificate box.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo limitation of liability.\u003c/span\u003e The required insurance sets minimum coverage and does not\n      limit Seller's obligations or liability under this Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/ip-license.html":"\u003c!-- TSI Contract Studio · stub · IP ownership & license · Article 9 · v1.1\n     Reusable legal stub. Fragment only — the article number and title are\n     supplied by the master agreement slot. Internal markup (.atty-note,\n     .draft-note, .int-note, .open-issue) is stripped on clean export. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"ip-license\" data-stub-version=\"1.1\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBackground IP.\u003c/span\u003e Each party retains all right, title, and interest in\n      \u003cspan data-term=\"Intellectual Property\"\u003eIntellectual Property\u003c/span\u003e it owned or developed independently of this\n      \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e. Nothing in this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e\n      transfers ownership of a party's Background IP to the other party.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eDeliverable IP.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e retains ownership of all\n      Intellectual Property embodied in the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e, drawings, models, software, and\n      technical documentation furnished under this Agreement, including all improvements, modifications, and derivatives\n      developed by Seller in the course of performance.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eLicense to Buyer.\u003c/span\u003e Seller grants \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e a\n      non-exclusive, non-transferable, royalty-free, perpetual license to use the technical documentation and embedded\n      software solely to operate, maintain, and repair the Equipment at the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e. The license\n      does not extend to manufacture of the Equipment or its major components.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eReverse engineering.\u003c/span\u003e Buyer shall not, and shall not permit any third party to,\n      reverse engineer, decompile, disassemble, or otherwise derive the design, source code, or manufacturing method of the\n      Equipment or its embedded software, except to the limited extent required to maintain or repair the Equipment where\n      Seller has failed to supply spare parts or service within the response times set out in Article 10 (Warranty) or\n      Annex H.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: This maintenance carve-out (v1.1) is the negotiated fallback where Seller\n        cannot supply parts. Confirm it does not swallow the general reverse-engineering prohibition; tie the trigger\n        explicitly to the Annex H response times.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eThird-party components.\u003c/span\u003e Where the Equipment incorporates third-party software or\n      licensed technology, Buyer's rights are subject to the terms of the applicable third-party license, which Seller shall\n      identify in Annex&nbsp;C.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: List embedded third-party licenses (PLC firmware, HMI runtime) in Annex C\n        before first send.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eMarking and confidentiality.\u003c/span\u003e Buyer shall preserve all proprietary notices on the\n      documentation and treat it as Confidential Information under Article 18.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eFeedback.\u003c/span\u003e Any suggestions Buyer provides regarding the Equipment may be used by\n      Seller without obligation or attribution.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/limitation-of-liability.html":"\u003c!-- TSI Contract Studio · stub · Limitation of liability · v1.2\n     Reusable legal stub. Fragment only — the article number and title are\n     supplied by the master agreement slot. Internal markup (.atty-note,\n     .draft-note, .int-note, .open-issue) is stripped on clean export. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"limitation-of-liability\" data-stub-version=\"1.2\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWaiver of consequential damages.\u003c/span\u003e Neither \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e nor\n      \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e is liable to the other for indirect, incidental, special, punitive, or\n      consequential damages, including loss of profit, loss of revenue, loss of use, cost of capital, cost of replacement\n      power, or loss of production, whether the claim sounds in contract, tort, strict liability, or otherwise, even if\n      advised of the possibility of such damages. This waiver is mutual and applies regardless of the failure of any\n      exclusive remedy.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eAggregate liability cap.\u003c/span\u003e The total aggregate liability of Seller arising out of or\n      relating to this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e shall not exceed an amount equal to the\n      \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e. Where the parties agree a lower cap, it is expressed as\n      \u003cspan data-calc-pct=\"15\" data-calc-label=\"aggregate liability cap\"\u003e15%\u003c/span\u003e of the Contract Price. The cap applies\n      in the aggregate across all claims and is not per-occurrence.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: The cap tier (100% of Contract Price default, or the reduced\n        \u003cspan data-calc-pct=\"15\" data-calc-label=\"aggregate liability cap\"\u003e15%\u003c/span\u003e tier) is a commercial decision. Do\n        not send with both figures live — select one and confirm it sits above the liquidated-damages exposure so the cap\n        does not eclipse the LD regime.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCarve-outs from the cap.\u003c/span\u003e The cap in clause 2 does not apply to liability for\n      (a) Seller's gross negligence or willful misconduct, (b) the third-party\n      \u003cspan data-term=\"Intellectual Property\"\u003eIntellectual Property\u003c/span\u003e infringement indemnity, (c) breach of the\n      obligations governing \u003cspan data-term=\"Confidential Information\"\u003eConfidential Information\u003c/span\u003e, (d) liability for\n      bodily injury, death, or damage to third-party tangible property to the extent covered by required insurance, or\n      (e) a party's payment obligations that are due and undisputed.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Carve-out (d) is capped at insurance proceeds in this version; if Buyer pushes\n        for uncapped injury/property liability, escalate before amending.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eApplication of the waiver to carve-outs.\u003c/span\u003e The waiver of consequential damages in\n      clause 1 applies notwithstanding the carve-outs in clause 3, except that it does not limit indemnified third-party\n      damages that the indemnifying party is otherwise obligated to pay under the Article on indemnification.\n      \u003cspan class=\"open-issue note-block\"\u003e[OPEN: Confirm whether the consequential-damages waiver should yield for gross\n        negligence / willful misconduct. Current draft keeps the waiver intact and lifts only the cap. Awaiting client\n        position.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eExclusive remedies.\u003c/span\u003e The remedies stated in this Agreement, including the warranty\n      remedies in the Article on warranties and the liquidated damages for delay and performance shortfall, are the\n      exclusive remedies for the matters they address, in lieu of all other remedies at law or in equity.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eLiquidated damages within the cap.\u003c/span\u003e Liquidated damages payable under this Agreement\n      count toward, and are not additional to, the aggregate cap in clause 2, unless the Article imposing them states\n      otherwise.\n      \u003cspan class=\"int-note\"\u003e[INT: Cross-check the delay-LD and performance-LD sub-caps in the schedule and performance\n        articles so their sum reconciles with this aggregate cap.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBasis of the bargain.\u003c/span\u003e The parties acknowledge that the\n      \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e reflects the allocation of risk in this Article and that these\n      limitations would apply even if a limited remedy is found to have failed of its essential purpose.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSurvival.\u003c/span\u003e This Article survives termination, expiration, or completion of the\n      Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/anti-corruption.html":"\u003c!-- TSI Contract Studio · LITE stub · Compliance with laws & anti-corruption · condensed short-form --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"anti-corruption\" data-stub-version=\"1.0\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eFollow the law.\u003c/span\u003e Each of \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e will comply with the laws that apply to its performance of this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, including labor, health and safety, environment, and trade rules.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo bribery.\u003c/span\u003e Neither party, nor anyone acting for it, will offer or accept a bribe, kickback, or other improper advantage in connection with this Agreement. Each party will comply with the U.S. Foreign Corrupt Practices Act (FCPA), the local anti-corruption law of the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e, and applicable sanctions and export control laws.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eRecords.\u003c/span\u003e Each party will keep accurate records relating to this Agreement for at least five years, and will allow the other to audit them on reasonable notice to check compliance.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBreach.\u003c/span\u003e A party that learns of a violation will promptly tell the other. A material breach of this clause lets the other party end the Agreement in writing, without giving up its other rights.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/confidentiality.html":"\u003c!-- TSI Contract Studio · LITE stub · Confidentiality · condensed short-form --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"confidentiality\" data-stub-version=\"1.0\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWhat is confidential.\u003c/span\u003e \u003cspan data-term=\"Confidential Information\"\u003eConfidential Information\u003c/span\u003e is non-public information one party shares with the other under this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e that is marked confidential or is clearly confidential by its nature, such as designs, pricing, and the documentation for the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eHow it is used.\u003c/span\u003e The receiving party will use Confidential Information only for this Agreement, protect it with reasonable care, and share it only with people who need it and are under similar confidentiality duties.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eExceptions.\u003c/span\u003e These duties do not cover information that is public, already known without a duty of confidence, received from a third party freely, or independently developed. Disclosure required by law is allowed, with prompt notice to the other party where lawful.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eHow long it lasts.\u003c/span\u003e These duties continue for five years after the Agreement ends, and longer for anything that remains a trade secret. On request, the receiving party will return or destroy the information.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/dispute-resolution.html":"\u003c!-- TSI Contract Studio · LITE stub · Dispute resolution · condensed short-form --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"dispute-resolution\" data-stub-version=\"1.0\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eTalk first.\u003c/span\u003e For any dispute under this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e between \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e, the party raising it will give written notice, and the parties will try in good faith to settle it within 15 days, escalating to senior management if needed.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eArbitration.\u003c/span\u003e A dispute not settled that way will be finally resolved by binding arbitration under the Rules of Arbitration of the International Chamber of Commerce, before a sole arbitrator, in English. The award is final and enforceable in any competent court.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Set the arbitration seat (e.g. Singapore for a Vietnam supply deal) before first send.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eInterim relief.\u003c/span\u003e Either party may still ask a court for urgent interim relief, for example to protect \u003cspan data-term=\"Confidential Information\"\u003eConfidential Information\u003c/span\u003e, without giving up arbitration.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eKeep performing.\u003c/span\u003e During a dispute, each party keeps performing the parts not in dispute, and Buyer keeps paying undisputed amounts when due. This clause survives the end of the Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/force-majeure.html":"\u003c!-- TSI Contract Studio · LITE stub · Force majeure · condensed short-form --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"force-majeure\" data-stub-version=\"1.0\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWhat it means.\u003c/span\u003e \u003cspan data-term=\"Force Majeure\"\u003eForce Majeure\u003c/span\u003e is an event beyond a party's reasonable control that it could not avoid, such as natural disaster, war, epidemic, or an act of government. It does not include a party's inability to pay or a change in market conditions.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eRelief.\u003c/span\u003e Neither \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e nor \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e is in breach of this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e to the extent Force Majeure prevents its performance, except for money already due. Affected deadlines move by the length of the delay.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNotice and mitigation.\u003c/span\u003e The affected party will give written notice within seven days, make reasonable efforts to limit the delay, and resume performance as soon as it can. An extension of time is the only remedy; neither party owes the other for costs of the event.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eLong delay.\u003c/span\u003e If Force Majeure lasts more than 120 days in a row, either party may end the Agreement in writing. Buyer then pays for \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e delivered and work done up to that point.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/governing-law.html":"\u003c!-- TSI Contract Studio · LITE stub · Governing law · condensed short-form --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"governing-law\" data-stub-version=\"1.0\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eGoverning law.\u003c/span\u003e This \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, and any dispute about it, is governed by the laws of the State of Washington, without its conflict-of-laws rules. The UN Convention on Contracts for the International Sale of Goods (UN CISG) does not apply.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Washington is the house default; override to the law the parties agree for this deal.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eLanguage.\u003c/span\u003e This Agreement is in English, and English controls its interpretation and all notices. Any translation is for convenience only.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSeverability and waiver.\u003c/span\u003e If a provision is unenforceable, it is narrowed or removed and the rest stays in force. A delay in enforcing a right is not a waiver of it.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eEntire agreement.\u003c/span\u003e This Agreement and its annexes are the whole agreement between \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e on this subject and replace earlier understandings. It can be changed only in writing signed by both.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/indemnification.html":"\u003c!-- TSI Contract Studio · LITE stub · Indemnification · condensed short-form --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"indemnification\" data-stub-version=\"1.0\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eEach party covers its own fault.\u003c/span\u003e Each party will cover the other against third-party claims, losses, and reasonable costs caused by its own negligence, willful misconduct, or breach of this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e. Where both are at fault, each pays its share.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eInjury and property damage.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e covers \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e for injury, death, or property damage caused by Seller or its subcontractors at the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e. Buyer covers Seller on the same basis for its own people.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eIP infringement.\u003c/span\u003e Seller covers Buyer if the Equipment infringes a third party's IP, and will fix, replace, or refund it. This does not apply where the problem comes from Buyer's own designs or changes.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNotice and defence.\u003c/span\u003e The party seeking cover must give prompt written notice, let the other party run the defence, and not settle without its consent. This clause survives the end of the Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/insurance.html":"\u003c!-- TSI Contract Studio · LITE stub · Insurance · condensed short-form --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"insurance\" data-stub-version=\"1.0\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSeller insures.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e will carry, at its own cost, general liability, workers compensation, and vehicle insurance covering its work under this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, at limits usual for work of this size and no less than any figure in the annex.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBuyer as additional insured.\u003c/span\u003e \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e is named as an additional insured on the general liability cover for claims arising from Seller's work, and Seller's insurance applies first.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eProof and notice.\u003c/span\u003e Before starting work, Seller will give \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e certificates showing the cover, and will give 30 days' written notice before any cancellation or material reduction.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNot a liability cap.\u003c/span\u003e This insurance sets a minimum only and does not limit Seller's other obligations or liability under the Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/ip-license.html":"\u003c!-- TSI Contract Studio · LITE stub · IP ownership & license · condensed short-form --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"ip-license\" data-stub-version=\"1.1\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSeller owns the design.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e keeps ownership of the design, drawings, software, and documentation for the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e. Each party keeps whatever it owned before this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBuyer may use it.\u003c/span\u003e \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e gets a free, non-exclusive licence to use the documentation and embedded software to operate, maintain, and repair the Equipment. Buyer may not use it to manufacture the Equipment or its main parts.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo reverse engineering.\u003c/span\u003e Buyer will not reverse engineer or copy the design, source code, or manufacturing method, except where needed to keep the Equipment running if Seller fails to supply parts or service on time.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eKeep it confidential.\u003c/span\u003e Buyer will keep the documentation confidential and leave all proprietary notices in place.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/limitation-of-liability.html":"\u003c!-- TSI Contract Studio · LITE stub · Limitation of liability · condensed short-form --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"limitation-of-liability\" data-stub-version=\"1.2\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo indirect damages.\u003c/span\u003e Neither \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e nor \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e is liable to the other for indirect or consequential loss, including lost profit, lost revenue, or lost production. This applies both ways.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eLiability cap.\u003c/span\u003e Seller's total liability under this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e will not exceed the \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e. Where the parties agree a lower cap, it is \u003cspan data-calc-pct=\"15\" data-calc-label=\"aggregate liability cap\"\u003e15%\u003c/span\u003e of the Contract Price. The cap covers all claims together.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWhat the cap does not cover.\u003c/span\u003e The cap does not apply to gross negligence or willful misconduct, IP infringement, breach of confidentiality, injury or property damage covered by insurance, or undisputed amounts due.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eAgreed risk split.\u003c/span\u003e These limits reflect the agreed split of risk in the Contract Price and survive the end of the Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/pro-tsi/dispute-resolution.html":"\u003c!-- TSI Contract Studio · PRO-TSI stub · Dispute resolution · seller-favorable opening position · lite --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"dispute-resolution\" data-stub-version=\"1.0\" data-stance=\"pro-tsi\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eTalk first.\u003c/span\u003e For any dispute under this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e\n      between \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e, the party raising it will\n      give written notice, and the parties will try in good faith to settle it within 15 days, escalating to senior\n      management if needed, before starting arbitration.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eArbitration in Seattle.\u003c/span\u003e A dispute not settled that way will be finally resolved by\n      binding arbitration seated in Seattle, Washington, USA, under rules chosen by Seller, before a sole arbitrator, in\n      English, under Washington law. The award is final and enforceable in any competent court.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Seller-favorable opening position — Seller's home seat, Seller's rules,\n        prevailing-party costs, no court interim relief against Seller. Likely fallback to balanced is a neutral seat and\n        institutional rules.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eInterim relief.\u003c/span\u003e Seller may ask a court or the tribunal for urgent interim relief, for\n      example to protect \u003cspan data-term=\"Confidential Information\"\u003eConfidential Information\u003c/span\u003e. Buyer may seek such\n      relief only from the tribunal, not from a court.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eKeep performing; costs.\u003c/span\u003e During a dispute, each party keeps performing, and Buyer keeps\n      paying amounts it does not dispute in good faith. The prevailing party recovers its reasonable costs and fees. This\n      clause survives the end of the Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/pro-tsi/indemnification.html":"\u003c!-- TSI Contract Studio · PRO-TSI stub · Indemnification · seller-favorable opening position · lite --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"indemnification\" data-stub-version=\"1.0\" data-stance=\"pro-tsi\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSeller's limited cover.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e covers\n      \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e against third-party claims and reasonable costs only where they arise from\n      Seller's gross negligence or willful misconduct, or from direct IP infringement under clause 2. Seller has no other\n      indemnity duty under this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Seller-favorable opening position — narrow Seller indemnity, broad Buyer\n        indemnity. Likely fallback to balanced is a mutual fault-based indemnity with a restored injury/property\n        indemnity.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eIP infringement.\u003c/span\u003e Seller covers Buyer if the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e\n      as furnished directly infringes a third party's patent or registered copyright, and will at its option fix, replace,\n      or refund it less depreciation. This is Buyer's sole remedy, and does not apply where the problem comes from Buyer's\n      designs, changes, or misuse.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBuyer covers Seller.\u003c/span\u003e Buyer covers Seller and its people against claims arising from\n      the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e, Buyer's use of the Equipment, Buyer's contractors, or Buyer's breach, except\n      to the extent caused by Seller's gross negligence or willful misconduct.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNotice and defence.\u003c/span\u003e The party seeking cover must give prompt written notice, let\n      Seller run the defence, and not settle without Seller's consent. This clause survives the end of the Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/pro-tsi/insurance.html":"\u003c!-- TSI Contract Studio · PRO-TSI stub · Insurance · seller-favorable opening position · lite --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"insurance\" data-stub-version=\"1.0\" data-stance=\"pro-tsi\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSeller's minimum cover.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e will carry, at its own\n      cost, only the statutory minimum workers compensation, employers liability, and automobile insurance required where it\n      performs, plus general liability at limits customary for its scope, covering its work under this\n      \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Seller-favorable opening position — Seller carries statutory minimums only,\n        Buyer carries property/builder's risk at Site. Likely fallback to balanced restores stated CGL limits and names\n        Buyer as additional insured on Seller's cover.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBuyer insures the Site.\u003c/span\u003e \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e will carry builder's risk\n      or property insurance on the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e at and in transit to the\n      \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e, bears the risk of loss there, and will name Seller as an additional insured on\n      that cover.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eProof.\u003c/span\u003e On request, Seller will give Buyer a certificate showing its cover. Seller need\n      not provide endorsement copies or renewal notices.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNot a liability change.\u003c/span\u003e This insurance sets a minimum only and does not enlarge\n      Seller's obligations or liability, which remain governed by the limitation-of-liability Article.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/pro-tsi/ip-license.html":"\u003c!-- TSI Contract Studio · PRO-TSI stub · IP ownership & license · seller-favorable opening position · lite --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"ip-license\" data-stub-version=\"1.1\" data-stance=\"pro-tsi\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSeller owns the design.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e owns and keeps the\n      design, drawings, software, firmware, and documentation for the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e,\n      including anything developed at Buyer's request. Each party keeps whatever it owned before this\n      \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e. No ownership passes to \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Seller-favorable opening position — operate-only licence, no third-party\n        service, no sublicensing, absolute reverse-engineering ban. Likely fallback to balanced restores the\n        maintain/repair scope and a parts-failure carve-out.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBuyer may operate it.\u003c/span\u003e Buyer gets a non-exclusive, non-transferable,\n      non-sublicensable licence to use the documentation and embedded software only to operate the Equipment at the\n      \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e. Buyer may not manufacture the Equipment or its parts, use it elsewhere, or have\n      any third party service, repair, or modify it. Seller or its authorized providers perform maintenance.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo reverse engineering.\u003c/span\u003e Buyer will not reverse engineer, decompile, or copy the\n      design, source code, or manufacturing method of the Equipment or its software, for any purpose. This prohibition\n      admits no exception.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eKeep it confidential.\u003c/span\u003e Buyer will keep the documentation and software confidential and\n      leave all proprietary notices in place.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/pro-tsi/limitation-of-liability.html":"\u003c!-- TSI Contract Studio · PRO-TSI stub · Limitation of liability · seller-favorable opening position · lite --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"limitation-of-liability\" data-stub-version=\"1.2\" data-stance=\"pro-tsi\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo indirect damages.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e is not liable to\n      \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e for any indirect or consequential loss, including lost profit, lost revenue,\n      lost production, downtime, or cost of replacement power, on any basis, even if the possibility was known and even if a\n      remedy fails of its essential purpose.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eLiability cap.\u003c/span\u003e Seller's total liability under this\n      \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, for all claims combined, will not exceed\n      \u003cspan data-calc-pct=\"15\" data-calc-label=\"aggregate liability cap\"\u003e15%\u003c/span\u003e of the\n      \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e, inclusive of liquidated damages, warranty costs, and\n      indemnity.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Seller-favorable opening position — a\n        \u003cspan data-calc-pct=\"15\" data-calc-label=\"aggregate liability cap\"\u003e15%\u003c/span\u003e cap with few carve-outs. Likely\n        fallback to balanced is a cap at the full Contract Price and restored carve-outs for IP, confidentiality, and\n        gross negligence.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWhat the cap does not cover.\u003c/span\u003e The cap applies to everything except undisputed amounts\n      due and Seller's IP infringement indemnity as limited in the indemnity Article. Nothing else lifts the cap.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eExclusive remedies and agreed risk split.\u003c/span\u003e The remedies in this Agreement are Buyer's\n      sole and exclusive remedies. These limits reflect the agreed split of risk in the Contract Price and survive the end\n      of the Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/pro-tsi/representations-warranties.html":"\u003c!-- TSI Contract Studio · PRO-TSI stub · Representations & warranties · seller-favorable opening position · lite --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"representations-warranties\" data-stub-version=\"1.0\" data-stance=\"pro-tsi\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eAuthority only.\u003c/span\u003e Each of \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and\n      \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e confirms it is properly formed, has the power to enter and perform this\n      \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, and that the person signing is authorised. This is the only\n      representation Seller makes.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Seller-favorable opening position — Seller's reps cut to authority only,\n        broad implied-warranty disclaimer, added Buyer diligence rep. Likely fallback to balanced restores Seller's title\n        and compliance reps.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBuyer's diligence.\u003c/span\u003e Buyer confirms it selected the\n      \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e on its own judgment and diligence, not in reliance on any statement of\n      Seller other than the express warranties, and is responsible for confirming the Equipment suits its intended use and\n      \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo implied warranties.\u003c/span\u003e APART FROM THE EXPRESS WARRANTIES IN THE AGREEMENT, SELLER\n      MAKES NO WARRANTY AND DISCLAIMS ALL IMPLIED OR STATUTORY WARRANTIES, INCLUDING MERCHANTABILITY, FITNESS FOR A\n      PARTICULAR PURPOSE, AND NON-INFRINGEMENT.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/lite/representations-warranties.html":"\u003c!-- TSI Contract Studio · LITE stub · Representations & warranties · condensed short-form --\u003e\n\u003cdiv class=\"stub-content stub-lite\" data-stub-id=\"representations-warranties\" data-stub-version=\"1.0\" data-variant=\"lite\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eAuthority.\u003c/span\u003e Each of \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e confirms it is properly formed, has the power to enter and perform this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, and that the person signing is authorised to do so.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eGood title.\u003c/span\u003e Seller confirms it will pass good title to the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e, free of liens and other claims, except any created by Buyer.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCompliance.\u003c/span\u003e Seller confirms the Equipment is made in line with the applicable laws and the agreed codes and standards, and that Seller holds the licences needed for its work. Buyer handles permits specific to the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo implied warranties.\u003c/span\u003e Apart from the express warranties in the Agreement, Seller gives no other warranties, including any implied warranty of merchantability or fitness for a particular purpose.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/pro-tsi/dispute-resolution.html":"\u003c!-- TSI Contract Studio · PRO-TSI stub · Dispute resolution · seller-favorable opening position --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"dispute-resolution\" data-stub-version=\"1.0\" data-stance=\"pro-tsi\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eScope.\u003c/span\u003e This Article governs any dispute, claim, or controversy arising out of or\n      relating to this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, including its formation, interpretation, breach, or\n      termination, between \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eGood-faith negotiation.\u003c/span\u003e Before commencing arbitration, the party raising a dispute\n      shall give written notice describing it. The parties' project representatives shall attempt to resolve the dispute in\n      good faith within 15 days of the notice, and if they do not, senior executives with authority to settle shall confer\n      within a further 15 days. Neither party may commence arbitration until the escalation period has expired.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBinding arbitration.\u003c/span\u003e A dispute not resolved through negotiation and escalation shall\n      be finally resolved by binding arbitration seated in Seattle, Washington, USA, administered under arbitration rules\n      selected by Seller (which, absent Seller's election, shall be the Commercial Arbitration Rules of the American\n      Arbitration Association), before a sole arbitrator, in the English language, applying the substantive law of the\n      State of Washington. The award is final and binding and enforceable in any court of competent jurisdiction, and the\n      parties waive any right of appeal to the extent permitted by law.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: This is the seller-favorable opening position — arbitration seated at\n        Seller's location (Seattle, Washington), Seller's choice of rules, Washington law, and no court interim relief\n        against Seller. Likely fallback toward balanced is a neutral seat, an institutional-rules default (e.g. ICC), a\n        three-arbitrator panel above a threshold, and reciprocal access to court interim relief.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eInterim relief.\u003c/span\u003e Seller may apply to a court of competent jurisdiction or to the\n      arbitral tribunal for interim or conservatory relief, including relief to protect\n      \u003cspan data-term=\"Confidential Information\"\u003eConfidential Information\u003c/span\u003e or\n      \u003cspan data-term=\"Intellectual Property\"\u003eIntellectual Property\u003c/span\u003e. Buyer shall seek interim or conservatory relief\n      only from the arbitral tribunal once constituted, and shall not seek injunctive or other interim relief against Seller\n      from any court.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eContinued performance.\u003c/span\u003e During any dispute, each party shall continue to perform its\n      obligations under this Agreement, and Buyer shall continue to pay all amounts other than those Buyer disputes in good\n      faith and in writing with particulars.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCosts.\u003c/span\u003e The prevailing party in any arbitration or related proceeding shall recover\n      its reasonable costs, including reasonable attorneys' fees and the costs of the arbitration, from the other party.\n      Each party bears its own costs of the negotiation and escalation stages.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSurvival.\u003c/span\u003e This Article survives termination, expiration, or completion of the\n      Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/pro-tsi/indemnification.html":"\u003c!-- TS
