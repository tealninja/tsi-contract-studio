I Contract Studio · PRO-TSI stub · Indemnification · seller-favorable opening position --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"indemnification\" data-stub-version=\"1.0\" data-stance=\"pro-tsi\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSeller's limited indemnity.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e shall indemnify,\n      defend, and hold harmless \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e from and against third-party claims, damages, losses,\n      and reasonable expenses (including reasonable attorneys' fees) only to the extent they arise out of Seller's gross\n      negligence or willful misconduct, or out of the third-party\n      \u003cspan data-term=\"Intellectual Property\"\u003eIntellectual Property\u003c/span\u003e infringement indemnity in clause 3. Seller has\n      no other indemnity obligation under this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBuyer's indemnity of Seller.\u003c/span\u003e Buyer shall indemnify, defend, and hold harmless Seller,\n      its affiliates, and their respective officers, employees, subcontractors, and agents from and against all third-party\n      claims, damages, losses, and expenses (including reasonable attorneys' fees) arising out of or relating to the\n      \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e, Buyer's operation, use, or maintenance of the\n      \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e, the acts or omissions of Buyer or its other contractors, or Buyer's\n      breach of this Agreement, except to the extent a loss falls within Seller's limited indemnity in clause 1. Where a\n      loss is caused by the fault of both parties, Buyer's indemnity applies except to the proportion attributable to\n      Seller's gross negligence or willful misconduct.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eThird-party IP infringement.\u003c/span\u003e Seller shall indemnify Buyer against claims that the\n      Equipment as furnished directly infringes a third party's issued patent or registered copyright, and shall pay the\n      damages finally awarded, provided Buyer meets the procedure in clause 5. If use of the Equipment is enjoined, Seller\n      shall, at its sole option and expense, procure the right to continue use, modify the Equipment to be non-infringing,\n      or accept return of the affected Equipment and refund the portion of the\n      \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e allocable to it less reasonable depreciation. This is Buyer's\n      sole and exclusive remedy for infringement.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eIP carve-outs.\u003c/span\u003e Seller's obligation in clause 3 does not apply to infringement arising\n      from Buyer's designs, specifications, or instructions, from modification of the Equipment by anyone other than\n      Seller, from combination of the Equipment with items not supplied by Seller, from use of the Equipment outside the\n      parameters in Annex&nbsp;D, or from Buyer's continued use after Seller has provided a non-infringing alternative.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: This is the seller-favorable opening position — Seller's indemnity is\n        narrowed to gross negligence/willful misconduct and direct IP infringement, and Buyer broadly indemnifies Seller.\n        Likely fallback toward balanced is a mutual fault-based indemnity, restoration of the personal-injury/property\n        indemnity on a proportional basis, and IP indemnity extended to trade secrets.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eProcedure and notice.\u003c/span\u003e As a condition of any indemnity, the indemnified party shall\n      give prompt written notice of the claim (and in any event within 10 days of becoming aware of it), shall not settle,\n      compromise, or admit liability without Seller's prior written consent, shall grant Seller sole control of the defense\n      and settlement, and shall provide reasonable cooperation at the indemnified party's expense. Failure to give prompt\n      notice relieves the indemnifying party to the extent of any resulting prejudice.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eRelationship to liability limits.\u003c/span\u003e The indemnities in this Article are subject to the\n      limitations and exclusions in the Article on limitation of liability, including the aggregate cap and the waiver of\n      consequential damages.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSurvival.\u003c/span\u003e This Article survives termination, expiration, or completion of the\n      Agreement with respect to any claim arising from acts or omissions occurring before that event.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/pro-tsi/insurance.html":"\u003c!-- TSI Contract Studio · PRO-TSI stub · Insurance · seller-favorable opening position --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"insurance\" data-stub-version=\"1.0\" data-stance=\"pro-tsi\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSeller's insurance.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e shall, at its own expense,\n      carry and maintain the statutory minimum insurance required of it as an employer and operator in the jurisdiction of\n      its place of performance, namely workers compensation, employers liability, and automobile liability at the limits\n      required by applicable law, together with commercial general liability (CGL) at limits customary for Seller's scope.\n      Seller's obligations under this Article are limited to the coverages stated in this clause.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWorkers compensation and automobile.\u003c/span\u003e Workers compensation at statutory limits for the\n      jurisdiction of Seller's place of performance, employers liability at Seller's standard program limits, and business\n      automobile liability for vehicles used by Seller in performance at the statutory minimum limit.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBuyer's insurance.\u003c/span\u003e \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e shall, at its own expense,\n      carry and maintain from delivery of the first shipment through final acceptance builder's risk or property insurance\n      on an all-risk replacement-cost basis covering the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e and all materials at\n      or in transit to the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e, and shall carry CGL and any owner's or operator's coverage\n      appropriate to the Site and to operation of the Equipment. Buyer bears the risk of loss to the Equipment at the Site\n      and shall name Seller as an additional insured on the builder's risk and property policies.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: This is the seller-favorable opening position — Seller carries only its\n        statutory minimums and Buyer carries builder's risk/property at Site and names Seller as additional insured. Likely\n        fallback toward balanced is restoring Seller's stated CGL limits (2,000,000 USD per occurrence / 4,000,000 USD\n        aggregate), umbrella/excess and E&amp;O layers, and Buyer's additional-insured status on Seller's CGL.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWaiver of subrogation.\u003c/span\u003e Each party waives, and shall cause its insurers to waive, all\n      rights of subrogation against the other party for loss covered by the policies required under this Article, to the\n      extent of that coverage. Buyer's builder's risk and property insurers shall waive subrogation against Seller.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCertificates.\u003c/span\u003e On written request, Seller shall deliver a certificate of insurance\n      evidencing the coverage in clause 1. A certificate does not amend, extend, or waive the coverage the policy actually\n      provides, and Seller is not obligated to deliver endorsement copies, renewal certificates, or notices of change.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCoverage sets a minimum.\u003c/span\u003e The insurance in this Article sets minimum coverage and is\n      without prejudice to the limitations on Seller's liability in the Article on limitation of liability, which control.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/pro-tsi/ip-license.html":"\u003c!-- TSI Contract Studio · PRO-TSI stub · IP ownership & license · seller-favorable opening position --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"ip-license\" data-stub-version=\"1.1\" data-stance=\"pro-tsi\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBackground IP.\u003c/span\u003e Each party retains all right, title, and interest in\n      \u003cspan data-term=\"Intellectual Property\"\u003eIntellectual Property\u003c/span\u003e it owned or developed independently of this\n      \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e. Nothing in this Agreement transfers ownership of a party's Background IP\n      to the other party.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSeller ownership.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e owns and retains all right,\n      title, and interest in the Intellectual Property embodied in the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e,\n      drawings, models, software, firmware, and technical documentation furnished under this Agreement, including all\n      improvements, modifications, derivatives, and know-how developed by Seller before or during performance, and\n      including any developed at Buyer's request or funded in whole or in part by Buyer. No ownership, joint ownership, or\n      implied license passes to \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e except as expressly stated in clause 3.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eLicense to Buyer.\u003c/span\u003e Seller grants Buyer a non-exclusive, non-transferable,\n      non-sublicensable, revocable-for-breach, royalty-free license to use the technical documentation and embedded\n      software solely to operate the Equipment at the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e for Buyer's internal purposes. The\n      license does not extend to manufacture, reproduction, or reconstruction of the Equipment or its components, to use at\n      any other site, or to modification, servicing, or repair of the Equipment or software by any third party. Maintenance\n      and repair shall be performed by Seller or its authorized service providers.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eReverse engineering.\u003c/span\u003e Buyer shall not, and shall not permit any third party to,\n      reverse engineer, decompile, disassemble, or otherwise derive or attempt to derive the design, source code, or\n      manufacturing method of the Equipment or its embedded software, in whole or in part, for any purpose. This\n      prohibition is absolute and admits no exception.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: This is the seller-favorable opening position — operate-only license, no\n        third-party service, no sublicensing, and an unqualified reverse-engineering ban with the v1.1 maintenance\n        carve-out removed. Likely fallback toward balanced is to restore the operate/maintain/repair scope, permit\n        third-party maintenance, and reinstate the parts-failure carve-out tied to the Annex H response times.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eThird-party components.\u003c/span\u003e Where the Equipment incorporates third-party software or\n      licensed technology, Buyer's rights are subject to the terms of the applicable third-party license, which Seller shall\n      identify in Annex&nbsp;C.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eMarking and confidentiality.\u003c/span\u003e Buyer shall preserve all proprietary and copyright\n      notices on the documentation and software and treat all of it as\n      \u003cspan data-term=\"Confidential Information\"\u003eConfidential Information\u003c/span\u003e under Article 18.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eFeedback.\u003c/span\u003e Any suggestions, ideas, or feedback Buyer provides regarding the Equipment\n      are assigned to Seller and may be used by Seller for any purpose without obligation, attribution, or compensation.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/pro-tsi/limitation-of-liability.html":"\u003c!-- TSI Contract Studio · PRO-TSI stub · Limitation of liability · seller-favorable opening position --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"limitation-of-liability\" data-stub-version=\"1.2\" data-stance=\"pro-tsi\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWaiver of consequential damages.\u003c/span\u003e \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e waives, and\n      \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e shall not be liable for, any indirect, incidental, special, punitive,\n      exemplary, or consequential damages, including loss of profit, loss of revenue, loss of use, loss of product, cost of\n      capital, cost of replacement power, cost of substitute equipment or services, downtime, and loss of production or\n      opportunity, whether the claim sounds in contract, tort, strict liability, warranty, or otherwise, and even if the\n      possibility of such damages was known. This waiver applies regardless of the failure of any exclusive or limited\n      remedy and regardless of the basis of the claim.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eAggregate liability cap.\u003c/span\u003e The total aggregate liability of Seller arising out of or\n      relating to this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, from all causes and across all claims combined, shall\n      not exceed an amount equal to \u003cspan data-calc-pct=\"15\" data-calc-label=\"aggregate liability cap\"\u003e15%\u003c/span\u003e of the\n      \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e. The cap applies in the aggregate and is not per-occurrence,\n      and it is inclusive of any amounts payable as liquidated damages, warranty costs, or indemnity.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: This is the seller-favorable opening position — a\n        \u003cspan data-calc-pct=\"15\" data-calc-label=\"aggregate liability cap\"\u003e15%\u003c/span\u003e-of-Contract-Price cap. Likely\n        fallback toward balanced is to raise the cap toward 100% of the Contract Price and to lift the cap for the\n        carve-outs restored below (gross negligence, IP indemnity, confidentiality, insured injury/property). Confirm the\n        cap sits above the liquidated-damages exposure before send.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCarve-outs from the cap.\u003c/span\u003e The cap in clause 2 applies to all liability except a\n      party's payment obligations that are due and undisputed and Seller's third-party\n      \u003cspan data-term=\"Intellectual Property\"\u003eIntellectual Property\u003c/span\u003e infringement indemnity as limited in the Article\n      on indemnification. No other matter, including gross negligence, willful misconduct, or breach of the obligations\n      governing \u003cspan data-term=\"Confidential Information\"\u003eConfidential Information\u003c/span\u003e, lifts or increases the cap.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eApplication of the waiver.\u003c/span\u003e The waiver of consequential damages in clause 1 applies to\n      every claim under or relating to this Agreement, including the carve-outs in clause 3 and any indemnity, and is not\n      displaced by any allegation of gross negligence or willful misconduct.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eExclusive remedies.\u003c/span\u003e The remedies stated in this Agreement, including the warranty\n      remedies in the Article on warranties and any liquidated damages, are Buyer's sole and exclusive remedies for the\n      matters they address, in lieu of all other remedies at law or in equity, and Buyer waives all others.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eLiquidated damages within the cap.\u003c/span\u003e Liquidated damages payable under this Agreement\n      count toward, and are not additional to, the aggregate cap in clause 2.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBasis of the bargain.\u003c/span\u003e The parties acknowledge that the\n      \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e reflects the allocation of risk in this Article and that these\n      limitations are a material basis of the bargain, apply even if a limited remedy is found to have failed of its\n      essential purpose, and would be materially different absent these limits.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSurvival.\u003c/span\u003e This Article survives termination, expiration, or completion of the\n      Agreement.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/pro-tsi/representations-warranties.html":"\u003c!-- TSI Contract Studio · PRO-TSI stub · Representations & warranties · seller-favorable opening position --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"representations-warranties\" data-stub-version=\"1.0\" data-stance=\"pro-tsi\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eSeller's authority.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e represents that it is duly\n      organized and validly existing, that it has full power and authority to enter into and perform this\n      \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, and that the person signing on its behalf is authorized to bind it.\n      These are the only representations Seller makes under this Agreement.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBuyer's authority.\u003c/span\u003e \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e represents that it is duly\n      organized and validly existing, that it has full power and authority to enter into and perform this Agreement, and\n      that the person signing on its behalf is authorized to bind it.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBuyer's diligence and reliance.\u003c/span\u003e Buyer represents that it has had the opportunity to\n      conduct its own due diligence, that it has selected the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e based on its own\n      judgment and specifications and not in reliance on any statement, description, sample, model, projection, or advice of\n      Seller except the express warranties in the Article on warranties, and that Buyer is responsible for confirming the\n      Equipment's suitability for Buyer's intended use, process conditions, feedstock, and\n      \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003ePerformance warranty cross-reference.\u003c/span\u003e The mechanical, material, and performance\n      warranties for the Equipment, if any, including the warranty period and remedies, are set out solely in the Article on\n      warranties and are not repeated, implied, or expanded here.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eDisclaimer of implied warranties.\u003c/span\u003e EXCEPT FOR THE EXPRESS WARRANTIES STATED IN THE\n      ARTICLE ON WARRANTIES, SELLER MAKES NO WARRANTY OF ANY KIND AND DISCLAIMS ALL OTHER WARRANTIES, WHETHER EXPRESS,\n      IMPLIED, STATUTORY, OR ARISING FROM COURSE OF DEALING OR USAGE OF TRADE, INCLUDING THE IMPLIED WARRANTIES OF\n      MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE, AND NON-INFRINGEMENT. No description, sample, model, drawing,\n      projection, or performance estimate creates any warranty, and Buyer's exclusive remedies are those in the Article on\n      warranties.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: This is the seller-favorable opening position — Seller's reps narrowed to\n        authority only, an expanded and conspicuous (caps) implied-warranty disclaimer, and added Buyer diligence/reliance\n        reps. Likely fallback toward balanced is restoring Seller's title-and-no-liens and compliance-and-licenses reps\n        and softening the Buyer non-reliance language. Confirm the disclaimer's conspicuous presentation under UCC 2-316\n        survives assembly.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eReliance and survival.\u003c/span\u003e Seller has entered into this Agreement in reliance on Buyer's\n      representations in clauses 2 and 3. The representations in this Article are made as of the effective date, and this\n      Article survives \u003cspan data-term=\"Substantial Completion\"\u003eSubstantial Completion\u003c/span\u003e and acceptance of the\n      Equipment.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/representations-warranties.html":"\u003c!-- TSI Contract Studio · stub · Representations & warranties · v1.0\n     Reusable legal stub. Fragment only — the article number and title are\n     supplied by the master agreement slot. Internal markup (.atty-note,\n     .draft-note, .int-note, .open-issue) is stripped on clean export. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"representations-warranties\" data-stub-version=\"1.0\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eAuthority.\u003c/span\u003e Each of \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and\n      \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e represents that it is duly organized and validly existing, that it has full\n      power and authority to enter into and perform this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, and that the person\n      signing on its behalf is authorized to bind it.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eNo conflict.\u003c/span\u003e Each party represents that its execution and performance of this\n      Agreement do not and will not violate its organizational documents, any law applicable to it, or any material\n      agreement to which it is a party.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eTitle and no liens.\u003c/span\u003e Seller represents that, on transfer of title under this\n      Agreement, it will convey good title to the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e free and clear of liens,\n      security interests, and encumbrances, other than those created by or through Buyer.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eCompliance and licenses.\u003c/span\u003e Seller represents that the Equipment is manufactured and\n      furnished in compliance with the laws applicable to its manufacture and with the codes and standards stated in\n      Annex&nbsp;D, and that Seller holds the licenses and permits required to perform its scope. Buyer is responsible for\n      permits specific to the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e and to operation of the Equipment.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm the code-and-standard list in Annex D is the version in force at the\n        effective date; note any owner-directed later editions.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003ePerformance warranty cross-reference.\u003c/span\u003e The mechanical, material, and performance\n      warranties for the Equipment, including the warranty period and remedies, are set out in the Article on warranties and\n      are not repeated or expanded here.\n      \u003cspan class=\"int-note\"\u003e[INT: Keep all substantive equipment warranties in Article 10 only; this Article covers\n        transactional reps to avoid a conflicting second warranty regime.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eDisclaimer of implied warranties.\u003c/span\u003e Except for the express warranties in this Agreement\n      and in the Article on warranties, Seller disclaims all other warranties, whether express, implied, or statutory,\n      including the implied warranties of merchantability and fitness for a particular purpose. No description, sample, or\n      model creates a warranty beyond those expressly stated.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Disclaimer must be conspicuous under UCC 2-316 to be effective. The\n        studio.css styling renders this clause in the standard body weight; confirm the assembled document presents the\n        disclaimer conspicuously (bold or caps) before execution.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eReliance and survival.\u003c/span\u003e The parties have entered into this Agreement in reliance on\n      these representations and warranties, which are made as of the effective date and, where their subject matter so\n      requires, as of the date of each delivery. This Article survives Substantial Completion and acceptance of the\n      Equipment.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","stubs/versions/ip-license_v1.0.html":"\u003c!-- TSI Contract Studio · stub · IP ownership & license · Article 9 · v1.0 (ARCHIVED)\n     Previous approved version. Retained for diff against the current library\n     version (Stub Manager, Module 2). Do not edit — archival copy. --\u003e\n\u003cdiv class=\"stub-content\" data-stub-id=\"ip-license\" data-stub-version=\"1.0\"\u003e\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eBackground IP.\u003c/span\u003e Each party retains all right, title, and interest in\n      \u003cspan data-term=\"Intellectual Property\"\u003eIntellectual Property\u003c/span\u003e it owned or developed independently of this\n      \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e. Nothing in this \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e\n      transfers ownership of a party's Background IP to the other party.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eDeliverable IP.\u003c/span\u003e \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e retains ownership of all\n      Intellectual Property embodied in the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e, drawings, models, software, and\n      technical documentation furnished under this Agreement, including all improvements, modifications, and derivatives\n      developed by Seller in the course of performance.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eLicense to Buyer.\u003c/span\u003e Seller grants \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e a\n      non-exclusive, non-transferable, royalty-free, perpetual license to use the technical documentation and embedded\n      software solely to operate, maintain, and repair the Equipment at the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e. The license\n      does not extend to manufacture of the Equipment or its major components.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eReverse engineering.\u003c/span\u003e Buyer shall not, and shall not permit any third party to,\n      reverse engineer, decompile, disassemble, or otherwise derive the design, source code, or manufacturing method of the\n      Equipment or its embedded software.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eThird-party components.\u003c/span\u003e Where the Equipment incorporates third-party software or\n      licensed technology, Buyer's rights are subject to the terms of the applicable third-party license, which Seller shall\n      identify in Annex&nbsp;C.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eMarking and confidentiality.\u003c/span\u003e Buyer shall preserve all proprietary notices on the\n      documentation and treat it as Confidential Information under Article 18.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eFeedback.\u003c/span\u003e Any suggestions Buyer provides regarding the Equipment may be used by\n      Seller without obligation or attribution.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","document-library/commercial/buyer-info-form-blank.html":"\u003c!-- TSI Contract Studio · commercial · Buyer-provided information form (blank) · v1.0\n     Fragment only — the annex letter and title are supplied by the annex slot.\n     Internal markup (.draft-note, .atty-note, .int-note) is stripped on clean export. --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"buyer-info-form-blank\"\u003e\n  \u003cp\u003eThis form records the information \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e shall supply for the detailed engineering of the\n    \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e at the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e. Buyer's data is the basis of\n    \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e's design; where a value is later revised, the change may affect scope, price, and\n    schedule under the change-order procedure of the \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e. Enter values in the units\n    shown, or state the unit used.\u003c/p\u003e\n  \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Data returned on this form is Buyer-supplied information. Confirm the Agreement\n    allocates design responsibility for interfaces and existing conditions to Buyer to the extent Seller relies on these\n    entries, and ties any correction to the change-order and delay provisions.]\u003c/span\u003e\n\n  \u003ch3\u003eProject and contacts\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eProject name\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eSite address\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eForm completed by\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eDate\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\ /th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eAccess-road width / height / load limits\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eDoor / opening dimensions to install area\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eCrane / rigging availability at Site\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eLaydown / storage area\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003eLocal codes and standards\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eGoverning electrical code\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eGoverning mechanical / pressure code\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eLocal permits Buyer will obtain\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eLanguage of documentation required\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eOther applicable standards\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill-block\"\u003e\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Where Buyer states a national code that differs from Seller's default design basis,\n    confirm the compliance scope and any third-party certification cost as a priced item before design freeze.]\u003c/span\u003e\n\u003c/div\u003e\n","document-library/commercial/insurance-schedule.html":"\u003c!-- TSI Contract Studio · commercial · Insurance schedule (Annex N) · v1.0\n     Fragment only — the annex letter and title are supplied by the annex slot.\n     Supports the Article 13 insurance stub; limits here control where they exceed\n     those in the article. Internal markup is stripped on clean export. --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"insurance-schedule\"\u003e\n  \u003cp\u003eThis schedule sets the minimum insurance \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e shall carry and maintain under the\n    insurance article of the \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e, for performance of the work at the\n    \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e. Where a limit in this schedule exceeds the limit stated in the article, this\n    schedule controls. All policies shall be placed with insurers rated A− VII or better by AM Best.\u003c/p\u003e\n\n  \u003ch3\u003eRequired coverages and minimum limits\u003c/h3\u003e\n  \u003cdiv class=\"tbl-wrap\"\u003e\n    \u003ctable class=\"data-table\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\n          \u003cth\u003eCoverage\u003c/th\u003e\n          \u003cth\u003eBasis\u003c/th\u003e\n          \u003cth class=\"num\"\u003eMinimum limit (USD)\u003c/th\u003e\n        \u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\n          \u003ctd\u003eCommercial general liability (CGL)\u003c/td\u003e\n          \u003ctd\u003eOccurrence; includes products and completed operations, contractual liability\u003c/td\u003e\n          \u003ctd class=\"num\"\u003e2,000,000 per occurrence / 4,000,000 aggregate\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n          \u003ctd\u003eWorkers compensation\u003c/td\u003e\n          \u003ctd\u003eStatutory, jurisdiction of the Site\u003c/td\u003e\n          \u003ctd class=\"num\"\u003eStatutory\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n          \u003ctd\u003eEmployers liability\u003c/td\u003e\n          \u003ctd\u003eEach accident / each employee / policy limit\u003c/td\u003e\n          \u003ctd class=\"num\"\u003e1,000,000\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n          \u003ctd\u003eBusiness automobile liability\u003c/td\u003e\n          \u003ctd\u003eOwned, hired, and non-owned vehicles; combined single limit\u003c/td\u003e\n          \u003ctd class=\"num\"\u003e1,000,000 per accident\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n          \u003ctd\u003eProfessional liability (errors and omissions, E&amp;O)\u003c/td\u003e\n          \u003ctd\u003ePer claim and aggregate; where Seller performs design or engineering; two-year tail\u003c/td\u003e\n          \u003ctd class=\"num\"\u003e2,000,000\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n          \u003ctd\u003eUmbrella / excess liability\u003c/td\u003e\n          \u003ctd\u003eOver CGL, employers liability, and automobile layers\u003c/td\u003e\n          \u003ctd class=\"num\"\u003e5,000,000\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n          \u003ctd\u003eMarine cargo / transit\u003c/td\u003e\n          \u003ctd\u003eFull replacement value of the Equipment in transit to the Site\u003c/td\u003e\n          \u003ctd class=\"num\"\u003e100% of shipment value\u003c/td\u003e\n        \u003c/tr\u003e\n        \u003ctr\u003e\n          \u003ctd\u003eBuilder's risk / erection all risks\u003c/td\u003e\n          \u003ctd\u003eWhere Seller performs erection at Site; full value of work in place and materials\u003c/td\u003e\n          \u003ctd class=\"num\"\u003e100% of installed value\u003c/td\u003e\n        \u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n  \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Marine cargo and builder's risk apply only where the corresponding scope and\n    risk-of-loss allocation sit with Seller. Delete the rows that do not apply, and confirm which party places builder's\n    risk against the delivery and risk-of-loss article before first send.]\u003c/span\u003e\n\n  \u003ch3\u003eAdditional insured and waiver of subrogation\u003c/h3\u003e\n  \u003cp\u003e\u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e and its affiliates shall be named additional insureds on the CGL, automobile,\n    and umbrella policies with respect to liability arising from Seller's performance, and Seller's insurance shall be\n    primary and non-contributory to any insurance carried by Buyer. Each party waives, and shall cause its insurers to\n    waive, all rights of subrogation against the other for loss covered by the policies required under this schedule, to\n    the extent of that coverage.\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eAdditional insured — policies\u003c/th\u003e\u003ctd class=\"text\"\u003eCGL, automobile, umbrella / excess\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eAdditional insured — endorsement form\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eWaiver of subrogation — policies\u003c/th\u003e\u003ctd class=\"text\"\u003eAll policies required under this schedule\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003ePrimary and non-contributory\u003c/th\u003e\u003ctd class=\"text\"\u003eRequired on CGL, automobile, umbrella / excess\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cspan class=\"atty-note note-block\"\u003e[ATTY: For high-value scopes, require copies of the additional-insured and\n    waiver-of-subrogation endorsements rather than relying on the certificate box, which evidences but does not confer\n    coverage. Confirm the additional-insured form number covers both ongoing and completed operations.]\u003c/span\u003e\n\n  \u003ch3\u003eCertificates and notice\u003c/h3\u003e\n  \u003cp\u003eSeller shall deliver certificates of insurance evidencing the required coverage to Buyer before commencing work at the\n    Site and on each renewal, and shall provide 30 days' written notice of cancellation or material reduction, and 10 days'\n    notice for non-payment of premium. A certificate does not amend, extend, or waive the coverage the policy actually\n    provides. The required insurance sets minimum coverage and does not limit Seller's obligations or liability under the\n    Agreement.\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eCertificate holder\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eCertificate delivery — before\u003c/th\u003e\u003ctd class=\"text\"\u003eCommencement of work at Site\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eNotice of cancellation\u003c/th\u003e\u003ctd class=\"text\"\u003e30 days (10 days for non-payment)\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eDeliver certificates to\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003eProject-specific endorsements\u003c/h3\u003e\n  \u003cp\u003eThe following endorsements or coverage variations are agreed for this project and form part of this schedule.\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eEndorsement / variation\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eApplies to policy\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eReason / reference\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eAdditional detail\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill-block\"\u003e\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cspan class=\"int-note\"\u003e[INT: Capture any Site-owner-mandated endorsements (e.g. specific additional-insured wording,\n    aggregate-per-project, or extended completed-operations period) here so they are placed before mobilisation.]\u003c/span\u003e\n\u003c/div\u003e\n","document-library/commercial/warranty-standard.html":"\u003c!-- TSI Contract Studio · commercial · Standard equipment warranty · v1.0\n     Fragment only — the annex letter and title are supplied by the annex slot.\n     Internal markup (.draft-note, .atty-note, .int-note) is stripped on clean export. --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"warranty-standard\"\u003e\n  \u003cp\u003eThis warranty is given by \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e to \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e under the\n    \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e and covers the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e supplied to the\n    \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e. It sets the sole express warranty for the Equipment and the exclusive remedy for\n    defects, subject to the terms below.\u003c/p\u003e\n\n  \u003col class=\"legal\"\u003e\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eScope of warranty.\u003c/span\u003e Seller warrants that the Equipment will be free from defects in\n      workmanship and materials and will conform to the specifications and drawings agreed under the Agreement, when\n      operated and maintained in accordance with Seller's manuals. This warranty covers the Equipment of Seller's\n      manufacture and does not enlarge any warranty passed through from a component manufacturer.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWarranty period.\u003c/span\u003e The warranty period runs for the earlier of 12 months from\n      completion of \u003cspan data-term=\"Commissioning\"\u003eCommissioning\u003c/span\u003e or 18 months from the date of delivery of the\n      Equipment to the Site. Where Commissioning is delayed for reasons attributable to Buyer, the 18-month cap from\n      delivery controls.\n      \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Confirm the delivery Incoterm and the defined delivery date the 18-month cap\n        runs from; for staged shipments the period may need to run per delivered unit.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eRemedy.\u003c/span\u003e If a defect covered by this warranty appears within the warranty period and\n      Buyer gives written notice within 30 days of discovery, Seller shall, at its option and expense, repair or replace the\n      defective Equipment or part. Repair or replacement is Buyer's sole and exclusive remedy for a warranty defect. Title\n      to any part removed and replaced under this warranty passes to Seller.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eResponse times.\u003c/span\u003e Seller shall acknowledge a warranty claim within 2 business days of\n      notice and shall propose a corrective plan within 5 business days. For a defect that prevents operation of the\n      Equipment, Seller shall dispatch qualified personnel or parts to begin corrective work within 10 business days of\n      notice, or sooner where the Agreement or Annex sets a shorter time.\n      \u003cspan class=\"int-note\"\u003e[INT: Align these default response times with any service-level or availability commitment in\n        the operations and maintenance annex so the two do not conflict.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eExclusions.\u003c/span\u003e This warranty does not cover, and Seller has no obligation for, defects\n      or damage arising from: (a) misuse, abuse, negligence, or operation outside the agreed specifications or the manuals;\n      (b) normal wear, corrosion, or erosion consistent with the service duty; (c) items supplied, specified, or installed\n      by Buyer or its other contractors, and any defect caused by their design or interface; (d) consumables and wear\n      parts, including seals, gaskets, filters, belts, wire, felts, lubricants, and refractory; (e) alteration, repair, or\n      relocation of the Equipment by anyone other than Seller or a party authorised in writing by Seller; and (f) failure to\n      perform the maintenance set out in the manuals.\n      \u003cspan class=\"atty-note note-block\"\u003e[ATTY: The consumables list is illustrative for pulp/paper machinery; confirm the\n        wear-part schedule against the specific equipment supplied and cross-reference the spare-parts annex so a covered\n        component is not swept into this exclusion.]\u003c/span\u003e\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eWarranty on repaired or replaced parts.\u003c/span\u003e A part repaired or replaced under this\n      warranty is warranted for the remainder of the original warranty period, or for 90 days from the date the repair or\n      replacement is completed, whichever is longer. Repair or replacement of a part does not restart or extend the\n      warranty period for the Equipment as a whole.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eConditions.\u003c/span\u003e Seller's obligations under this warranty are conditioned on Buyer\n      operating and maintaining the Equipment in accordance with the manuals, keeping reasonable operating records, and\n      granting Seller reasonable access to the Equipment and those records to investigate a claim. Where investigation\n      shows the reported defect is not covered, Buyer shall reimburse Seller's reasonable investigation costs.\u003c/li\u003e\n\n    \u003cli\u003e\u003cspan class=\"clause-num\"\u003eDisclaimer of other warranties.\u003c/span\u003e The warranties in this document are the only\n      warranties Seller gives for the Equipment. To the extent permitted by law, Seller disclaims all other warranties,\n      express or implied, including any implied warranty of merchantability or fitness for a particular purpose. This\n      document does not limit any remedy the Agreement expressly provides for defects that are Seller's responsibility.\u003c/li\u003e\n  \u003c/ol\u003e\n\u003c/div\u003e\n","document-library/forms/form-certificate-completion.html":"\u003c!-- TSI Contract Studio · form · Certificate of completion · v1.0\n     Fragment only — the annex letter and title are supplied by the annex slot.\n     Internal markup (.draft-note, .atty-note) is stripped on clean export. --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"form-certificate-completion\"\u003e\n  \u003cp\u003eThis certificate is issued under the \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e between\n    \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e to record the stage of completion\n    of the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e at the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e. Select the applicable\n    stage; the two stages have different consequences for warranty and for release of retention.\u003c/p\u003e\n\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eCertificate type\u003c/th\u003e\u003ctd class=\"text\"\u003eSubstantial completion [&nbsp;&nbsp;] &nbsp; Final completion [&nbsp;&nbsp;] \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: mark one.]\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eCertificate number\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eProject\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eEquipment / scope covered\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eDate of completion certified\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003eStatement of completion\u003c/h3\u003e\n  \u003cp\u003eSeller certifies, and Buyer acknowledges, that as of the date above the Equipment has reached\n    \u003cspan data-term=\"Substantial Completion\"\u003eSubstantial Completion\u003c/span\u003e — it can be used for its intended purpose in\n    accordance with the Agreement, save for the minor items listed on the punch list — or, where Final Completion is\n    selected, that all punch-list items have been closed and all remaining obligations of Seller under the Agreement have\n    been performed.\u003c/p\u003e\n  \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Delete the branch that does not apply, or issue one certificate per stage.\n    Substantial Completion should reference an achieved performance test where the Agreement conditions it on one;\n    Final Completion should confirm the punch list is closed in full.]\u003c/span\u003e\n\n  \u003ch3\u003ePunch list\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003ePunch-list reference\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eNumber of open items\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eAgreed date for close-out\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eValue withheld pending close-out\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n  \u003cp\u003eThe open items listed in the referenced punch list do not, individually or together, prevent use of the Equipment\n    for its intended purpose. Seller shall complete them by the agreed date.\u003c/p\u003e\n\n  \u003ch3\u003eWarranty period\u003c/h3\u003e\n  \u003cp\u003eThe warranty period under the Agreement begins on the date of\n    \u003cspan data-term=\"Substantial Completion\"\u003eSubstantial Completion\u003c/span\u003e certified above and runs for\n    \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e months, unless the Agreement provides otherwise.\u003c/p\u003e\n  \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Confirm the warranty trigger. Where the agreement starts warranty at Final\n    Completion or at first commercial use rather than Substantial Completion, conform this clause to the operative term —\n    the two dates can differ materially.]\u003c/span\u003e\n\n  \u003cdiv class=\"sig-grid\"\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eFor Seller — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eFor Buyer — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n","document-library/forms/form-change-order.html":"\u003c!-- TSI Contract Studio · form · Change order · Annex G · v1.0\n     Fragment only — the annex letter and title are supplied by the annex slot.\n     Internal markup (.draft-note, .atty-note) is stripped on clean export. --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"form-change-order\"\u003e\n  \u003cp\u003eThis change order records an agreed variation to the \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e between\n    \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e. When executed by both parties it\n    adjusts the scope, the \u003cspan data-term=\"Contract Price\"\u003eContract Price\u003c/span\u003e, and the schedule only to the extent\n    stated below. All other terms of the Agreement remain unchanged.\u003c/p\u003e\n\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eChange order number\u003c/th\u003e\u003ctd\u003eCO-\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eDate issued\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eProject\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eAgreement reference\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eOriginated by\u003c/th\u003e\u003ctd class=\"text\"\u003eSeller [&nbsp;&nbsp;] &nbsp; Buyer [&nbsp;&nbsp;] \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: mark one.]\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003eDescription of change\u003c/h3\u003e\n  \u003cp\u003eDescribe the change to the work, the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e, or the manner of performance,\n    and the reason for it.\u003c/p\u003e\n  \u003cdiv class=\"fill-block\"\u003e\u003c/div\u003e\n  \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: State the change in scope terms, not narrative. Cross-reference the affected\n    specification section or drawing number so the baseline being varied is unambiguous.]\u003c/span\u003e\n\n  \u003ch3\u003ePrice adjustment\u003c/h3\u003e\n  \u003cdiv class=\"tbl-wrap\"\u003e\n    \u003ctable class=\"data-table\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\u003cth\u003eComponent\u003c/th\u003e\u003cth class=\"num\"\u003eAddition (+)\u003c/th\u003e\u003cth class=\"num\"\u003eDeduction (−)\u003c/th\u003e\u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003eDirect labour and materials\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eSubcontracted work\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eMarkup on additions (see note)\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e—\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eNet adjustment to Contract Price\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n  \u003cp\u003eMarkup on added work is applied at \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e % (convention: 20 %). Markup applies to net\n    additions only; deductions are credited at cost without markup reduction.\u003c/p\u003e\n  \u003cspan class=\"atty-note note-block\"\u003e[ATTY: The 20 % change-order markup is the default convention. Confirm it matches the\n    markup ceiling in the main agreement's variations article before completing; where the two differ, the agreement\n    governs and this figure should be conformed.]\u003c/span\u003e\n\n  \u003ch3\u003eSchedule impact\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eChange in time for completion\u003c/th\u003e\u003ctd\u003e+ \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e days &nbsp; / &nbsp; − \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e days\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eRevised date for Substantial Completion\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eEffect on liquidated-damages baseline\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003eEffect on milestones\u003c/h3\u003e\n  \u003cp\u003eIdentify each Annex E payment milestone affected and the revised amount or date. Enter \"none\" where the milestone\n    schedule is unchanged.\u003c/p\u003e\n  \u003cdiv class=\"tbl-wrap\"\u003e\n    \u003ctable class=\"data-table\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\u003cth\u003eMilestone\u003c/th\u003e\u003cth\u003eRevised description or trigger\u003c/th\u003e\u003cth class=\"num\"\u003eRevised amount\u003c/th\u003e\u003cth class=\"num\"\u003eRevised date\u003c/th\u003e\u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n\n  \u003cp\u003eBy signing, each party agrees that this change order fully accounts for the cost and time impact of the change\n    described, and waives any further claim arising from it except as expressly stated above.\u003c/p\u003e\n\n  \u003cdiv class=\"sig-grid\"\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eFor Seller — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eFor Buyer — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n","document-library/forms/form-commissioning-notice.html":"\u003c!-- TSI Contract Studio · form · Notice of commissioning start · v1.0\n     Fragment only — the annex letter and title are supplied by the annex slot.\n     Internal markup (.draft-note, .atty-note) is stripped on clean export. --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"form-commissioning-notice\"\u003e\n  \u003cp\u003eBy this notice \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e informs \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e that\n    \u003cspan data-term=\"Commissioning\"\u003eCommissioning\u003c/span\u003e of the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e at the\n    \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e will begin on the date stated. The notice records the scope of the activities and\n    the prerequisites that Buyer must have in place for Commissioning to proceed on schedule.\u003c/p\u003e\n\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eProject\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eNotice date\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eCommissioning start date\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eEstimated duration\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e days\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003eScope of commissioning\u003c/h3\u003e\n  \u003cp\u003eThe activities to be carried out during this period are:\u003c/p\u003e\n  \u003cdiv class=\"fill-block\"\u003e\u003c/div\u003e\n  \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: List the phases in sequence — energisation, no-load checks, functional testing,\n    and the performance test that triggers Substantial Completion. Reference the commissioning plan in the technical\n    annex rather than restating it.]\u003c/span\u003e\n\n  \u003ch3\u003eBuyer obligations and prerequisites\u003c/h3\u003e\n  \u003cp\u003eCommissioning cannot begin until the following are in place. Buyer confirms the status of each.\u003c/p\u003e\n  \u003cdiv class=\"tbl-wrap\"\u003e\n    \u003ctable class=\"data-table\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\u003cth\u003ePrerequisite\u003c/th\u003e\u003cth\u003eResponsible\u003c/th\u003e\u003cth\u003eStatus\u003c/th\u003e\u003cth\u003eRequired by\u003c/th\u003e\u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003eUtilities available at rated capacity (power, water, air)\u003c/td\u003e\u003ctd\u003eBuyer\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eFeedstock and consumables on Site\u003c/td\u003e\u003ctd\u003eBuyer\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eOperating personnel available for training\u003c/td\u003e\u003ctd\u003eBuyer\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003ePermits and safety clearances in force\u003c/td\u003e\u003ctd\u003eBuyer\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eWaste and effluent handling in service\u003c/td\u003e\u003ctd\u003eBuyer\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n  \u003cp\u003eWhere a prerequisite is not met by the required date, the commissioning start date shifts day for day and any\n    resulting standby cost is addressed under the delay provisions of the Agreement.\u003c/p\u003e\n  \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Confirm the standby-cost and day-for-day extension mechanism matches the\n    Buyer-caused-delay clause in the main agreement before relying on this notice to fix the baseline.]\u003c/span\u003e\n\n  \u003ch3\u003eContact\u003c/h3\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eSeller commissioning lead\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eTelephone / email\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eBuyer site contact\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003cdiv class=\"sig-grid\"\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eIssued by Seller — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eAcknowledged by Buyer — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n","document-library/forms/form-lien-waiver-conditional.html":"\u003c!-- TSI Contract Studio · form · Conditional waiver and release upon progress payment · v1.0\n     Fragment only — the annex letter and title are supplied by the annex slot.\n     Internal markup (.draft-note, .atty-note) is stripped on clean export. --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"form-lien-waiver-conditional\"\u003e\n  \u003cp\u003eThis document waives and releases lien, stop-payment, and payment-bond rights of\n    \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e arising from work performed under the \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e\n    at the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e, through the date and up to the amount stated. It becomes effective only on\n    receipt of the progress payment identified below.\u003c/p\u003e\n\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eProject\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eClaimant (Seller)\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eOwner (Buyer)\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eThrough date\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eAmount of this progress payment\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003eConditional waiver and release\u003c/h3\u003e\n  \u003cp\u003eOn receipt by the claimant of the progress payment stated above, the claimant waives and releases any mechanic's\n    lien, stop-payment notice, or claim against a payment bond that the claimant has on the\n    \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e for labour and materials furnished to\n    \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e through the through date. This waiver and release covers the progress payment\n    only and does not cover retention, items furnished after the through date, or the disputed amounts listed below.\u003c/p\u003e\n  \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: This is a conditional release — it takes effect only when payment is actually\n    received (for a cheque, when it clears). Do not exchange the unconditional form until funds have cleared. Confirm the\n    form matches the statutory wording of the governing jurisdiction where one is prescribed.]\u003c/span\u003e\n\n  \u003ch3\u003eExceptions\u003c/h3\u003e\n  \u003cp\u003eThis release does not cover the following, which remain secured by the claimant's rights:\u003c/p\u003e\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eRetention withheld to date\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eExtras or change orders not yet paid\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eDisputed claims reserved\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003eSignature\u003c/h3\u003e\n  \u003cdiv class=\"sig-grid\"\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eClaimant — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eNotary / witness — signature / date\u003c/div\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cp\u003eState of \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e, County of \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e. Subscribed and sworn before me\n    on \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e.\u003c/p\u003e\n  \u003cspan class=\"atty-note note-block\"\u003e[ATTY: A notarial block is included for jurisdictions that require acknowledgement.\n    Remove it where the governing law does not require notarisation for a progress-payment release.]\u003c/span\u003e\n\u003c/div\u003e\n","document-library/forms/form-lien-waiver-unconditional.html":"\u003c!-- TSI Contract Studio · form · Unconditional waiver and release upon final payment · v1.0\n     Fragment only — the annex letter and title are supplied by the annex slot.\n     Internal markup (.draft-note, .atty-note) is stripped on clean export. --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"form-lien-waiver-unconditional\"\u003e\n  \u003cp\u003eThis document waives and releases in full the lien, stop-payment, and payment-bond rights of\n    \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e for all work performed under the \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e\n    at the \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e. It is unconditional and should be signed only after final payment has been\n    received and has cleared.\u003c/p\u003e\n\n  \u003cspan class=\"atty-note note-block\"\u003e[ATTY: This release is effective on signature regardless of whether payment is ever\n    received. Do not deliver it in exchange for a promise of payment, a post-dated instrument, or an uncleared cheque —\n    once signed the claimant's security is gone. Use the conditional form until funds have cleared, then exchange for\n    this one.]\u003c/span\u003e\n\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eProject\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eClaimant (Seller)\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eOwner (Buyer)\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eAmount of final payment received\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003eUnconditional waiver and release\u003c/h3\u003e\n  \u003cp\u003eThe claimant has been paid in full for all labour, services, equipment, and materials furnished to\n    \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e for the \u003cspan data-term=\"Equipment\"\u003eEquipment\u003c/span\u003e at the\n    \u003cspan data-term=\"Site\"\u003eSite\u003c/span\u003e, including all retention. The claimant unconditionally waives and releases all\n    mechanic's lien, stop-payment notice, payment-bond, and other claims arising from the work, in full and without\n    reservation.\u003c/p\u003e\n  \u003cp\u003e\u003cstrong\u003eNotice:\u003c/strong\u003e this document waives and releases lien, stop-payment, and payment-bond rights\n    unconditionally and states that the claimant has been paid for the work. This document is enforceable against the\n    claimant even if the claimant has not been paid. If the claimant has not been paid, use a conditional release form.\u003c/p\u003e\n  \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Complete only after the final payment shown above has cleared. Leave no reserved\n    or disputed amounts — an unconditional final release is a full release. Any residual claim must be settled or carved\n    out before this form is signed.]\u003c/span\u003e\n\n  \u003ch3\u003eSignature\u003c/h3\u003e\n  \u003cdiv class=\"sig-grid\"\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eClaimant — name, title, signature / date\u003c/div\u003e\u003c/div\u003e\n    \u003cdiv\u003e\u003cdiv class=\"sig-line\"\u003eNotary / witness — signature / date\u003c/div\u003e\u003c/div\u003e\n  \u003c/div\u003e\n  \u003cp\u003eState of \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e, County of \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e. Subscribed and sworn before me\n    on \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e.\u003c/p\u003e\n\u003c/div\u003e\n","document-library/forms/form-milestone-certificate.html":"\u003c!-- TSI Contract Studio · form · Milestone achievement certificate · v1.0\n     Fragment only — the annex letter and title are supplied by the annex slot.\n     Internal markup (.draft-note, .atty-note) is stripped on clean export. --\u003e\n\u003cdiv class=\"doc-content\" data-doc-id=\"form-milestone-certificate\"\u003e\n  \u003cp\u003eThis certificate records the achievement of a payment milestone under the \u003cspan data-term=\"Agreement\"\u003eAgreement\u003c/span\u003e\n    between \u003cspan data-term=\"Seller\"\u003eSeller\u003c/span\u003e and \u003cspan data-term=\"Buyer\"\u003eBuyer\u003c/span\u003e. It is tied to the payment\n    schedule in Annex E; on execution it entitles Seller to invoice the amount shown against the identified milestone.\u003c/p\u003e\n\n  \u003ctable class=\"particulars\"\u003e\n    \u003ctr\u003e\u003cth\u003eProject\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eCertificate number\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eMilestone identifier (Annex E)\u003c/th\u003e\u003ctd\u003eM-\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eMilestone description\u003c/th\u003e\u003ctd class=\"text\"\u003e\u003cspan class=\"fill fill-wide\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n    \u003ctr\u003e\u003cth\u003eDate achieved\u003c/th\u003e\u003ctd\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n  \u003c/table\u003e\n\n  \u003ch3\u003ePayment due on this milestone\u003c/h3\u003e\n  \u003cdiv class=\"tbl-wrap\"\u003e\n    \u003ctable class=\"data-table\"\u003e\n      \u003cthead\u003e\n        \u003ctr\u003e\u003cth\u003eItem\u003c/th\u003e\u003cth class=\"num\"\u003eAmount\u003c/th\u003e\u003c/tr\u003e\n      \u003c/thead\u003e\n      \u003ctbody\u003e\n        \u003ctr\u003e\u003ctd\u003eMilestone value per Annex E\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eRetention withheld\u003c/td\u003e\u003ctd class=\"num\"\u003e− \u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n        \u003ctr\u003e\u003ctd\u003eNet amount due on this certificate\u003c/td\u003e\u003ctd class=\"num\"\u003e\u003cspan class=\"fill\"\u003e&nbsp;\u003c/span\u003e\u003c/td\u003e\u003c/tr\u003e\n      \u003c/tbody\u003e\n    \u003c/table\u003e\n  \u003c/div\u003e\n  \u003cspan class=\"draft-note\"\u003e[DRAFT NOTE: Enter the milestone value exactly as scheduled in Annex E; if the figures diverge,\n    Annex E governs. Show retention as a deduction where the Agreement applies it to milestone payments; enter zero\n    otherwise.]\u003c/span\u003e\n\n  \u003ch3\u003eCertification statement\u003c/h3\u003e\n  \u003cp\u003eSeller certifies that the milestone identified above has been achieved in accordance with its acceptance criteria in\n    Annex E as of the date achieved. Buyer, by countersignature, confirms the milestone and authorises payment of the net\n    amount due, subject to the payment terms of the Agreement and without prejudice to Buyer's rights in respect of\n    \u003cspan data-term=\"Substantial Completion\"\u003eSubstantial Completion\u003c/span\u003e and final acceptance.\u003c/p\u003e\n  \u003cspan class=\"atty-note note-block\"\u003e[ATTY: Confirm whether Buyer countersignature is a condition of payment or merely an\n    acknowledgement under the main agreement's payment article, and conform the
